<!-- Code à 6 chiffres — HTML + CSS + JS autonomes. Nécessite tokens.css (variables du design system).
     Un seul vrai champ (autocomplete="one-time-code") sous 6 cases dessinées : collage, saisie auto du SMS et lecteurs d'écran
     fonctionnent nativement. Chiffres qui glissent, réussite en vague, erreur en tremblement. -->
<link rel="stylesheet" href="tokens.css">

<!-- SECTION -->
<div class="fd">
  <form class="fd__card" data-otp-form novalidate>
    <header class="fd__head">
      <span class="fd__brand">
        <svg class="fd__logo" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="24" class="fd__logo-bg"/><path class="fd__logo-mark" d="M28 34l17 16-17 16M55 68h18"/></svg>
        <span class="fd__word">fonderie</span>
      </span>
      <span class="fd__step">Vérification en deux étapes</span>
    </header>

    <div class="fd__intro">
      <h2 class="fd__h" id="otp-h">Saisissez le code reçu</h2>
      <p class="fd__p" id="otp-desc">Envoyé par SMS au 06 •• •• •• 42. Il expire dans 10 minutes.</p>
    </div>

    <div class="otp" data-otp data-length="6" data-group="3" data-type="numeric" data-mask="false" data-wave="70" data-expected="424242">
      <label class="otp__sr" for="otp-input">Code de vérification à 6 chiffres</label>
      <input class="otp__input" id="otp-input" name="code" type="text" inputmode="numeric" autocomplete="one-time-code"
        maxlength="6" spellcheck="false" autocapitalize="off" aria-describedby="otp-desc otp-msg" required>
      <div class="otp__slots" aria-hidden="true"></div>
    </div>

    <p class="fd__msg" id="otp-msg" role="status" aria-live="polite"></p>

    <div class="fd__row">
      <button class="fd__link" type="button" data-otp-resend disabled>Renvoyer le code <span data-otp-timer>dans 0:30</span></button>
      <button class="fd__link fd__link--quiet" type="button">Utiliser une clé de sécurité</button>
    </div>

    <p class="fd__demo"><span>Code de démo <kbd>424 242</kbd><br><span class="fd__demo-sub">Tout autre code échoue.</span></span><button class="fd__paste" type="button" data-otp-paste>Coller le code</button></p>
  </form>
</div>
<!-- /SECTION -->

<script>
/* OtpField — champ unique + cases dessinées, sans dépendance.
   Attributs : data-length (4 à 8), data-group (taille des groupes, 0 = sans séparateur), data-type (numeric | alphanumeric),
   data-mask (true : points au lieu des caractères), data-wave (ms entre deux cases de la vague).
   Événement « otp:complete » (detail.value) ; puis el._otp.success(msg) ou el._otp.error(msg). el._otp.reset(). */
(function () {
  var reduce = window.matchMedia ? matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };

  function Otp(root) {
    this.root = root;
    this.input = root.querySelector('.otp__input');
    this.wrap = root.querySelector('.otp__slots');
    this.value = '';
    var self = this;
    this.input.addEventListener('input', function () { self.onInput(); });
    this.input.addEventListener('focus', function () { root.classList.add('is-focus'); self.paint(); });
    this.input.addEventListener('blur', function () { root.classList.remove('is-focus'); self.paint(); });
    // Garder le curseur en fin de saisie : la case active est toujours la suivante
    ['keyup', 'click', 'select'].forEach(function (ev) { self.input.addEventListener(ev, function () { var n = self.input.value.length; try { self.input.setSelectionRange(n, n); } catch (e) {} }); });
    root._otp = this;
    this.config();
  }

  Otp.prototype.config = function () {
    var d = this.root.dataset;
    this.len = Math.max(4, Math.min(8, +d.length || 6));
    this.group = +d.group || 0;
    this.alpha = d.type === 'alphanumeric';
    this.mask = d.mask === 'true';
    this.root.style.setProperty('--otp-wave', (d.wave != null ? +d.wave : 70) + 'ms');
    this.input.maxLength = this.len;
    this.input.inputMode = this.alpha ? 'text' : 'numeric';
    this.input.autocapitalize = this.alpha ? 'characters' : 'off';
    this.input.pattern = this.alpha ? '[A-Za-z0-9]{' + this.len + '}' : '\\d{' + this.len + '}';
    var label = this.root.querySelector('label');
    if (label) label.textContent = 'Code de vérification à ' + this.len + (this.alpha ? ' caractères' : ' chiffres');
    var html = '';
    for (var i = 0; i < this.len; i++) {
      if (this.group && i && i % this.group === 0) html += '<span class="otp__sep"></span>';
      html += '<span class="otp__slot" style="--i:' + i + '"><span class="otp__char"></span><span class="otp__caret"></span></span>';
    }
    this.wrap.innerHTML = html;
    this.slots = this.wrap.querySelectorAll('.otp__slot');
    this.set(this.value.slice(0, this.len), true);
  };

  Otp.prototype.clean = function (v) {
    v = this.alpha ? v.toUpperCase().replace(/[^A-Z0-9]/g, '') : v.replace(/\D/g, '');
    return v.slice(0, this.len);
  };

  Otp.prototype.onInput = function () {
    if (this.root.dataset.state === 'success' || this.root.dataset.state === 'busy') { this.input.value = this.value; return; }
    if (this.root.dataset.state === 'error') this.root.dataset.state = '';
    this.set(this.clean(this.input.value));
  };

  Otp.prototype.set = function (v, silent) {
    var prev = this.value;
    this.value = v;
    if (this.input.value !== v) this.input.value = v;
    for (var i = 0; i < this.slots.length; i++) {
      var s = this.slots[i], ch = v[i] || '';
      var c = s.querySelector('.otp__char');
      var shown = ch ? (this.mask ? '•' : ch) : '';
      if (c.textContent !== shown) {
        c.textContent = shown;
        if (ch && !silent && i >= prev.length && !reduce.matches) { s.classList.remove('is-new'); s.offsetWidth; s.classList.add('is-new'); }
      }
      s.classList.toggle('is-filled', !!ch);
    }
    this.paint();
    if (!silent && v.length === this.len && prev.length !== this.len) {
      this.root.dispatchEvent(new CustomEvent('otp:complete', { detail: { value: v }, bubbles: true }));
    }
  };

  Otp.prototype.paint = function () {
    var focus = document.activeElement === this.input, n = this.value.length;
    for (var i = 0; i < this.slots.length; i++) this.slots[i].classList.toggle('is-active', focus && i === Math.min(n, this.len - 1) && this.root.dataset.state !== 'success');
    this.root.classList.toggle('is-full', n === this.len);
  };

  Otp.prototype.busy = function () { this.root.dataset.state = 'busy'; this.input.setAttribute('aria-busy', 'true'); this.paint(); };
  Otp.prototype.success = function () {
    this.root.dataset.state = 'success';
    this.input.removeAttribute('aria-busy');
    this.input.setAttribute('aria-invalid', 'false');
    this.input.readOnly = true;
    this.paint();
  };
  Otp.prototype.error = function () {
    var self = this;
    this.input.removeAttribute('aria-busy');
    this.root.dataset.state = 'error';
    this.input.setAttribute('aria-invalid', 'true');
    if (!reduce.matches) { this.root.classList.remove('is-shake'); this.root.offsetWidth; this.root.classList.add('is-shake'); }
    if (navigator.vibrate && (!navigator.userActivation || navigator.userActivation.hasBeenActive)) navigator.vibrate([10, 40, 10]);
    // Vider après le tremblement et rendre la main
    setTimeout(function () { self.set('', true); self.input.focus(); }, reduce.matches ? 0 : 520);
  };
  Otp.prototype.reset = function () {
    this.root.dataset.state = '';
    this.input.readOnly = false;
    this.input.removeAttribute('aria-invalid');
    this.set('', true);
  };

  window.OtpField = {
    attach: function (el) { return el._otp || new Otp(el); },
    init: function (scope) { (scope || document).querySelectorAll('[data-otp]').forEach(window.OtpField.attach); },
  };
  window.OtpField.init();

  /* Mise en scène Fonderie : vérification simulée, renvoi avec compte à rebours, collage du code de démo. */
  document.querySelectorAll('[data-otp-form]').forEach(function (form) {
    var el = form.querySelector('[data-otp]'), otp = el._otp, msg = form.querySelector('#otp-msg') || form.querySelector('[role=status]');
    var tries = 3, resend = form.querySelector('[data-otp-resend]'), timer = form.querySelector('[data-otp-timer]'), left = 30, tick = 0;
    function say(t, kind) { msg.textContent = t; msg.dataset.kind = kind || ''; }
    function countdown() {
      clearInterval(tick); left = 30; resend.disabled = true; timer.textContent = 'dans 0:30';
      tick = setInterval(function () {
        left--; timer.textContent = left > 0 ? 'dans 0:' + String(left).padStart(2, '0') : '';
        if (left <= 0) { clearInterval(tick); resend.disabled = false; }
      }, 1000);
    }
    countdown();
    form.addEventListener('submit', function (e) { e.preventDefault(); if (otp.value.length === otp.len) el.dispatchEvent(new CustomEvent('otp:complete', { detail: { value: otp.value } })); });
    el.addEventListener('otp:complete', function (e) {
      otp.busy(); say('Vérification…');
      setTimeout(function () {
        var expected = (el.dataset.expected || '').toUpperCase().slice(0, otp.len);
        if (e.detail.value === expected) { otp.success(); say('Identité vérifiée. Ouverture de votre espace de déploiement…', 'ok'); }
        else {
          tries = Math.max(0, tries - 1);
          otp.error();
          say(tries ? 'Code incorrect. Il vous reste ' + tries + (tries > 1 ? ' essais.' : ' essai.') : 'Trop d’essais. Demandez un nouveau code.', 'error');
          if (!tries) { tries = 3; resend.disabled = false; clearInterval(tick); timer.textContent = ''; }
        }
      }, 650);
    });
    resend.addEventListener('click', function () { otp.reset(); tries = 3; say('Nouveau code envoyé.'); countdown(); otp.input.focus(); });
    var paste = form.querySelector('[data-otp-paste]');
    if (paste) paste.addEventListener('click', function () {
      otp.reset(); otp.input.focus();
      otp.set(otp.clean(el.dataset.expected || ''));
    });
  });
})();
</script>

<style>
  /* ——— Champ code ——— */
  .otp { --otp-w: 60px; --otp-gap: 8px; --otp-wave: 70ms; position: relative; display: block; max-width: 100%; }
  .otp__sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .otp__input {
    position: absolute; inset: 0; z-index: 1; width: 100%; height: 100%;
    margin: 0; padding: 0; border: 0; outline: 0; background: transparent;
    color: transparent; caret-color: transparent; font-size: 16px; letter-spacing: 2.5em;
    cursor: text; -webkit-tap-highlight-color: transparent;
  }
  .otp__input::selection { background: transparent; }
  .otp__input:-webkit-autofill { -webkit-text-fill-color: transparent; transition: background-color 99999s; }
  .otp__slots { display: flex; align-items: center; gap: var(--otp-gap); }
  .otp__sep { width: 12px; height: 2px; margin: 0 2px; border-radius: 2px; background: var(--border-control); flex: none; }
  .otp__slot {
    position: relative; display: grid; place-items: center;
    flex: 1 1 0; min-width: 0; max-width: var(--otp-w); aspect-ratio: 13 / 16;
    border: 1px solid var(--border-control); border-radius: var(--radius-card);
    background: var(--surface); color: var(--text-strong);
    font: 600 26px/1 var(--font-mono); font-variant-numeric: tabular-nums;
    transition: border-color 160ms var(--ease-out), box-shadow 160ms var(--ease-out), background-color 220ms var(--ease-out), color 220ms var(--ease-out), translate 420ms cubic-bezier(.34, 1.56, .64, 1);
  }
  .otp__slot.is-active { border-color: var(--focus-ring); box-shadow: 0 0 0 3px var(--accent-subtle-border); }
  .otp__char { display: block; }
  .otp__slot.is-new .otp__char { animation: otp-in 380ms cubic-bezier(.34, 1.56, .64, 1); }
  @keyframes otp-in { from { opacity: 0; transform: translateY(14px) scale(.7); filter: blur(2px); } 60% { opacity: 1; filter: none; } }
  .otp__caret { position: absolute; width: 2px; height: 28px; border-radius: 1px; background: var(--text-strong); opacity: 0; }
  .otp__slot.is-active:not(.is-filled) .otp__caret { animation: otp-blink 1.1s steps(1) infinite; }
  @keyframes otp-blink { 0%, 55% { opacity: 1; } 56%, 100% { opacity: 0; } }

  .otp[data-state=busy] .otp__slot { border-color: var(--border); animation: otp-pulse 900ms ease-in-out infinite; animation-delay: calc(var(--i) * 90ms); }
  @keyframes otp-pulse { 50% { background: var(--raised); } }
  .otp[data-state=success] .otp__slot {
    border-color: var(--tint-green-border); background: var(--tint-green-bg); color: var(--tint-green-fg);
    animation: otp-wave 520ms cubic-bezier(.34, 1.56, .64, 1) both; animation-delay: calc(var(--i) * var(--otp-wave));
    transition-delay: calc(var(--i) * var(--otp-wave));
  }
  @keyframes otp-wave { 0% { translate: 0 0; } 35% { translate: 0 -8px; } 100% { translate: 0 0; } }
  .otp[data-state=error] .otp__slot { border-color: var(--down); background: var(--tint-red-bg); color: var(--tint-red-fg); }
  .otp.is-shake .otp__slots { animation: otp-shake 460ms cubic-bezier(.36, .07, .19, .97); }
  @keyframes otp-shake { 0%, 100% { translate: 0; } 15% { translate: -8px; } 30% { translate: 7px; } 45% { translate: -5px; } 60% { translate: 3px; } 75% { translate: -1.5px; } }

  @media (prefers-reduced-motion: reduce) {
    .otp__slot { transition: none; }
    .otp__slot.is-new .otp__char, .otp[data-state=success] .otp__slot, .otp[data-state=busy] .otp__slot, .otp.is-shake .otp__slots { animation: none; }
    .otp__slot.is-active:not(.is-filled) .otp__caret { animation: none; opacity: 1; }
  }

  /* ——— Mise en scène : Fonderie, plateforme de déploiement ——— */
  .fd { width: min(100%, 480px); font-family: var(--font-sans); color: var(--text); }
  .fd__card { display: grid; gap: 24px; padding: 32px; border: 1px solid var(--border); border-radius: var(--radius-sheet); background: var(--surface); }
  .fd__head { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .fd__brand { display: inline-flex; align-items: center; gap: 8px; color: var(--text-strong); }
  .fd__logo { width: 28px; height: 28px; }
  .fd__logo-bg { fill: var(--accent); }
  .fd__logo-mark { fill: none; stroke: var(--accent-fg); stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; }
  .fd__word { font: 600 18px/1 var(--font-sans); letter-spacing: -0.025em; }
  .fd__step { font: 500 12px/16px var(--font-mono); letter-spacing: var(--track-caps); text-transform: uppercase; color: var(--text-muted); text-align: right; }
  .fd__intro { display: grid; gap: 8px; }
  .fd__h { margin: 0; font: 600 var(--t-page) / var(--t-page-lh) var(--font-sans); letter-spacing: var(--track-tight); color: var(--text-strong); }
  .fd__p { margin: 0; font-size: 16px; line-height: 24px; color: var(--text-muted); }
  .fd__msg { min-height: 24px; margin: -8px 0 0; font-size: 15px; line-height: 22px; color: var(--text-muted); }
  .fd__msg[data-kind=ok] { color: var(--up); }
  .fd__msg[data-kind=error] { color: var(--down); }
  .fd__row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
  .fd__link { min-height: 44px; padding: 0 12px; margin: 0 -12px; border: 0; border-radius: var(--radius-ctl); background: transparent; color: var(--text-strong); font: 500 15px/1 var(--font-sans); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--border-control); cursor: pointer; }
  .fd__link:hover:not(:disabled) { text-decoration-color: currentColor; }
  .fd__link:disabled { color: var(--text-muted); text-decoration: none; cursor: default; }
  .fd__link [data-otp-timer] { font-variant-numeric: tabular-nums; }
  .fd__link--quiet { color: var(--text-muted); }
  .fd__link:focus-visible, .fd__paste:focus-visible { outline: var(--focus-width) solid var(--focus-ring); outline-offset: 2px; }
  .fd__demo { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 0; padding: 12px 16px; border-radius: var(--radius-card); background: var(--raised); font-size: 14px; line-height: 22px; color: var(--text-muted); }
  .fd__demo kbd { padding: 1px 6px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); color: var(--text-strong); font: 500 13px/20px var(--font-mono); }
  .fd__demo-sub { font-size: 14px; }
  .fd__paste { flex: none; min-height: 44px; padding: 0 4px; border: 0; background: none; color: var(--text-strong); font: 500 14px/22px var(--font-sans); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }

  @media (max-width: 520px) {
    .fd__card { padding: 24px 16px; gap: 20px; }
    .fd__step { display: none; }
    .otp { --otp-w: 52px; --otp-gap: 6px; }
    .otp__slots { justify-content: center; }
    .otp__sep { width: 8px; margin: 0; }
    .fd__row { flex-direction: column; align-items: flex-start; gap: 0; }
  }
  @media (max-width: 360px) { .otp { --otp-gap: 5px; } .otp__slot { font-size: 22px; } }
</style>

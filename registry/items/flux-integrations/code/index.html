<style>
  .fx {
    padding: 96px 24px;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
  }
  .fx__head { max-width: 44rem; margin: 0 auto; text-align: center; }
  .fx__eyebrow { margin: 0 0 16px; color: var(--text-muted); font: 500 12px/18px var(--font-mono); letter-spacing: var(--track-caps); text-transform: uppercase; }
  .fx__title { margin: 0; color: var(--text-strong); font-size: clamp(1.75rem, 1.15rem + 2.3vw, 3rem); line-height: 1.08; font-weight: 600; letter-spacing: -0.03em; text-wrap: balance; }
  .fx__lead { margin: 16px auto 0; max-width: 34rem; color: var(--text-muted); font-size: 1.125rem; line-height: 1.75rem; text-wrap: pretty; }

  /* Scène : sources | produit | destinations */
  .fx__stage {
    position: relative;
    display: grid;
    grid-template-columns: minmax(200px, 1fr) minmax(320px, 1.7fr) minmax(200px, 1fr);
    align-items: center;
    max-width: 1120px;
    margin: 64px auto 0;
  }
  .fx__svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
  .fx__col { position: relative; z-index: 1; display: grid; gap: 16px; margin: 0; padding: 0; list-style: none; }
  .fx__col--in { justify-items: end; }
  .fx__col--out { justify-items: start; }

  .fx__app {
    display: flex; align-items: center; gap: 12px;
    width: 200px; height: 56px; padding: 0 16px 0 8px;
    border: 1px solid var(--border); border-radius: var(--radius-card);
    background: var(--surface); color: var(--text-strong);
    font: inherit; text-align: left; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: opacity var(--motion-slow) var(--ease-out), border-color var(--motion-base) var(--ease-out), translate var(--motion-slow) cubic-bezier(.34, 1.56, .64, 1);
  }
  .fx__app[data-state=dim] { opacity: .5; }
  .fx__app[data-state=active] { border-color: var(--border-strong); }
  .fx__col--in .fx__app[data-state=active] { translate: 4px 0; }
  .fx__col--out .fx__app[data-state=active] { translate: -4px 0; }
  .fx__app:focus-visible { outline: var(--focus-width) solid var(--focus-ring); outline-offset: 3px; }

  .fx__logo {
    position: relative; flex: none; display: grid; place-items: center;
    width: 40px; height: 40px; border-radius: var(--radius-ctl);
    background: var(--tint-neutral-bg); color: var(--tint-neutral-fg);
  }
  .fx__logo svg { width: 22px; height: 22px; }
  [data-tint=blue] > .fx__logo { background: var(--tint-blue-bg); color: var(--tint-blue-fg); }
  [data-tint=violet] > .fx__logo { background: var(--tint-violet-bg); color: var(--tint-violet-fg); }
  [data-tint=green] > .fx__logo { background: var(--tint-green-bg); color: var(--tint-green-fg); }
  [data-tint=amber] > .fx__logo { background: var(--tint-amber-bg); color: var(--tint-amber-fg); }
  [data-tint=pink] > .fx__logo { background: var(--tint-pink-bg); color: var(--tint-pink-fg); }
  [data-tint=brand] > .fx__logo { background: var(--accent); color: var(--accent-fg); }
  .fx__sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  /* Pastille d'état : une app en pause */
  .fx[data-statuts=true] .fx__app[data-status=pause] .fx__logo::after {
    content: ""; position: absolute; top: -3px; right: -3px; width: 10px; height: 10px; border-radius: 50%;
    background: var(--warn); box-shadow: 0 0 0 2px var(--surface);
  }
  .fx__name { display: grid; min-width: 0; font-size: 0.9375rem; line-height: 1.25rem; font-weight: 500; }
  .fx__name small { color: var(--text-muted); font-size: 0.8125rem; line-height: 1.125rem; font-weight: 400; }

  /* Produit central */
  .fx__hub { position: relative; z-index: 1; display: grid; justify-items: center; gap: 4px; }
  .fx__hub::before {
    content: ""; position: absolute; top: -72px; left: 50%; width: 240px; height: 240px; margin-left: -120px; border-radius: 50%;
    background: radial-gradient(closest-side, var(--glow-accent), transparent); pointer-events: none; z-index: -1;
  }
  .fx__core {
    position: relative; display: grid; place-items: center;
    width: 96px; height: 96px; margin-bottom: 12px; border-radius: var(--radius-sheet);
    background: var(--accent); color: var(--accent-fg);
  }
  .fx__ring { position: absolute; inset: 0; border: 1.5px solid var(--accent); border-radius: var(--radius-sheet); opacity: 0; pointer-events: none; }
  .fx__hubname { margin: 0; color: var(--text-strong); font-weight: 600; font-size: 1rem; line-height: 1.5rem; }
  .fx__hubcount { margin: 0; color: var(--text-muted); font-size: 0.8125rem; line-height: 1.125rem; }
  .fx__num { color: var(--text-strong); font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

  /* Fiche de l'app survolée */
  .fx__info {
    display: flex; align-items: center; gap: 16px;
    max-width: 640px; min-height: 72px; margin: 48px auto 0; padding: 12px 16px 12px 12px;
    border: 1px solid var(--border); border-radius: var(--radius-card); background: var(--surface);
  }
  .fx__info .fx__logo { width: 44px; height: 44px; }
  .fx__info-main { display: grid; min-width: 0; }
  .fx__info-main b { color: var(--text-strong); font-weight: 600; font-size: 0.9375rem; line-height: 1.25rem; }
  .fx__info-main span { color: var(--text-muted); font-size: 0.8125rem; line-height: 1.125rem; }
  .fx__info-stat { flex: 1; min-width: 0; color: var(--text-muted); font-size: 0.875rem; line-height: 1.25rem; }
  .fx__info-stat b { color: var(--text-strong); font-family: var(--font-mono); font-weight: 500; font-variant-numeric: tabular-nums; }
  .fx__info-side { display: flex; align-items: center; gap: 12px; flex: none; }
  .fx__lat { color: var(--text-muted); font: 500 12px/18px var(--font-mono); white-space: nowrap; }
  .fx__chip { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 8px; border-radius: var(--radius-pill); font-size: 0.75rem; font-weight: 500; white-space: nowrap; }
  .fx__chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .fx__chip--ok { background: var(--tint-green-bg); color: var(--tint-green-fg); }
  .fx__chip--pause { background: var(--tint-amber-bg); color: var(--tint-amber-fg); }
  .fx__chip--live { background: var(--accent-subtle); color: var(--text-strong); }
  .fx__chip--live::before { background: var(--accent); }

  /* Mobile d'abord pour le contenu, scène verticale sous 900 px */
  @media (max-width: 899px) {
    .fx { padding: 64px 16px; }
    .fx__lead { font-size: 1rem; line-height: 1.5rem; }
    .fx__stage { grid-template-columns: 1fr; gap: 72px; margin-top: 40px; }
    .fx__col { display: flex; justify-content: center; gap: 4px; }
    .fx__app { flex-direction: column; width: 80px; height: auto; min-height: 88px; padding: 4px 0; gap: 8px; border: 0; background: transparent; }
    .fx__app .fx__logo { width: 52px; height: 52px; border-radius: var(--radius-card); box-shadow: inset 0 0 0 1px var(--border); }
    .fx__app .fx__logo svg { width: 24px; height: 24px; }
    .fx__name { text-align: center; font-size: 0.75rem; line-height: 1rem; }
    .fx__name small { display: none; }
    .fx__col--in .fx__app[data-state=active] { translate: 0 2px; }
    .fx__col--out .fx__app[data-state=active] { translate: 0 -2px; }
    .fx__app[data-state=active] .fx__logo { box-shadow: inset 0 0 0 1.5px var(--border-strong); }
    .fx__info { flex-wrap: wrap; gap: 8px 12px; margin-top: 40px; }
    .fx__info-stat { flex-basis: 100%; order: 3; }
    .fx__info-side { margin-left: auto; }
  }
  @media (prefers-reduced-motion: reduce) {
    .fx__app { transition: none; }
    .fx__app[data-state=active] { translate: none; }
  }
</style>

<script>
(function () {
  /* ——— Moteur des faisceaux : courbes SVG, comètes en dégradé, paquets de données ———
     Balisage attendu dans root :
       [data-flow-stage]  conteneur positionné des tuiles et du hub
       [data-flow-svg]    <svg> en fond de la scène
       [data-flow-core]   le carré du produit central (point d'arrivée des courbes)
       [data-flow-app]    une tuile par app : data-side="in|out", data-status="ok|pause"
       [data-flow-count]  (facultatif) compteur d'événements
  */
  var FLOW_DEFAULTS = {
    speed: 1,           // multiplicateur de vitesse des paquets (1 = 160 px/s)
    packets: 2,         // paquets simultanés par faisceau (1 à 3)
    direction: 'both',  // 'both' (sources → produit → destinations) | 'in' | 'out'
    beam: 96,           // longueur de la comète, px
    curve: 0.5,         // courbure des liens (0 = droit, 1 = très arrondi)
    glow: true,         // halo discret autour des paquets
    statuts: true,      // les apps en pause n'émettent rien (lien en pointillés)
    count: 12482,       // valeur de départ du compteur
    onSelect: null,     // (app | null) => void, app = { index, name, role, stat, unit, latency, status, side, tint }
  };

  function createFlow(root, options) {
    var o = {}, k;
    for (k in FLOW_DEFAULTS) o[k] = FLOW_DEFAULTS[k];
    for (k in options || {}) if (options[k] !== undefined) o[k] = options[k];

    var NS = 'http://www.w3.org/2000/svg';
    var reduce = window.matchMedia ? matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
    var stage = root.querySelector('[data-flow-stage]');
    var svg = root.querySelector('[data-flow-svg]');
    var core = root.querySelector('[data-flow-core]');
    var hub = root.querySelector('[data-flow-hub]') || core;
    var countEl = root.querySelector('[data-flow-count]');
    var rings = root.querySelectorAll('[data-flow-ring]');
    var apps = [].slice.call(root.querySelectorAll('[data-flow-app]'));
    var uid = 'fx' + Math.random().toString(36).slice(2, 7);
    var links = [], sel = -1, sticky = false, raf = 0, last = 0, visible = true, dead = false;
    var count = o.count, lastPulse = 0, ringI = 0, seed = 11;
    var fmt = window.Intl ? new Intl.NumberFormat('fr-FR') : { format: String };

    function rnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
    function el(name, attrs, parent) {
      var n = document.createElementNS(NS, name);
      for (var a in attrs) n.setAttribute(a, attrs[a]);
      if (parent) parent.appendChild(n);
      return n;
    }
    function info(i) {
      var a = apps[i], d = a.dataset;
      return { index: i, name: d.name, role: d.role, stat: d.stat, unit: d.unit, latency: d.latency, status: d.status || 'ok', side: d.side, tint: d.tint, logo: a.querySelector('[data-flow-logo]') };
    }
    function flowsIn(a) { return o.direction === 'in' || (o.direction === 'both' && a.dataset.side !== 'out'); }

    /* Construction du SVG */
    function build() {
      while (svg.firstChild) svg.removeChild(svg.firstChild);
      var defs = el('defs', {}, svg);
      if (o.glow) {
        var f = el('filter', { id: uid + '-glow', x: '-200%', y: '-200%', width: '500%', height: '500%' }, defs);
        el('feGaussianBlur', { stdDeviation: '3' }, f);
      }
      links = apps.map(function (a, i) {
        var g = el('g', {}, svg);
        g.style.transition = 'opacity 260ms cubic-bezier(.2,0,0,1)';
        var track = el('path', { fill: 'none', 'stroke-width': '1.5', 'stroke-linecap': 'round' }, g);
        track.style.stroke = 'var(--border-control)';
        track.style.strokeOpacity = '.45';
        track.style.transition = 'stroke 260ms cubic-bezier(.2,0,0,1), stroke-opacity 260ms cubic-bezier(.2,0,0,1)';
        var paused = o.statuts && a.dataset.status === 'pause';
        if (paused) track.setAttribute('stroke-dasharray', '2 6');
        var pk = [];
        var n = paused ? 0 : Math.max(1, Math.min(3, Math.round(o.packets)));
        for (var j = 0; j < n; j++) {
          var gid = uid + '-g' + i + '-' + j;
          var grad = el('linearGradient', { id: gid, gradientUnits: 'userSpaceOnUse' }, defs);
          [[0, 0], [.6, .45], [1, 1]].forEach(function (s) {
            var st = el('stop', { offset: String(s[0]) }, grad);
            st.style.stopColor = 'var(--accent)'; st.style.stopOpacity = String(s[1]);
          });
          var beam = el('path', { fill: 'none', stroke: 'url(#' + gid + ')', 'stroke-width': '2.25', 'stroke-linecap': 'round' }, g);
          beam.style.transition = 'stroke-width 260ms cubic-bezier(.2,0,0,1)';
          var halo = o.glow ? el('circle', { r: '7', filter: 'url(#' + uid + '-glow)' }, g) : null;
          if (halo) { halo.style.fill = 'var(--accent)'; halo.style.opacity = '0'; }
          var dot = el('circle', { r: '3' }, g);
          dot.style.fill = 'var(--accent)'; dot.style.opacity = '0';
          pk.push({ grad: grad, beam: beam, dot: dot, halo: halo, s: 0, wait: (j / n) * 2.2 + rnd() * .8, crossed: false });
        }
        // Étiquette de données : visible sur le faisceau sélectionné, elle suit le premier paquet
        var tag = null;
        if (!paused && a.dataset.payload) {
          tag = el('g', {}, g);
          tag.style.opacity = '0'; tag.style.transition = 'opacity 200ms cubic-bezier(.2,0,0,1)';
          var inner = el('g', {}, tag); tag.inner = inner;
          inner.style.transformBox = 'fill-box'; inner.style.transformOrigin = '50% 100%';
          var bg = el('rect', { height: '22', rx: '6', y: '-11' }, inner);
          bg.style.fill = 'var(--surface)'; bg.style.stroke = 'var(--border-strong)'; bg.style.strokeOpacity = '.6';
          var tx = el('text', { y: '3.5', 'text-anchor': 'middle' }, inner);
          tx.textContent = a.dataset.payload;
          tx.style.fill = 'var(--text-strong)'; tx.style.font = '500 11px var(--font-mono)';
          tag.bg = bg; tag.tx = tx;
        }
        return { app: a, g: g, track: track, pk: pk, tag: tag, len: 1, paused: paused, inbound: flowsIn(a) };
      });
      layout();
    }

    /* Géométrie : courbe de Bézier de la tuile vers le hub, horizontale ou verticale selon la mise en page */
    function layout() {
      var sr = stage.getBoundingClientRect(), cr = core.getBoundingClientRect(), hr = hub.getBoundingClientRect();
      svg.setAttribute('width', sr.width); svg.setAttribute('height', sr.height);
      svg.setAttribute('viewBox', '0 0 ' + sr.width + ' ' + sr.height);
      var hc = { x: cr.left - sr.left + cr.width / 2, y: cr.top - sr.top + cr.height / 2 };

        else { var dy = (p3.y - g.p0.y) * cv; d = 'M' + g.p0.x + ' ' + g.p0.y + 'C' + g.p0.x + ' ' + (g.p0.y + dy) + ' ' + p3.x + ' ' + (p3.y - dy) + ' ' + p3.x + ' ' + p3.y; }

    function setBeam(l, p, s) {

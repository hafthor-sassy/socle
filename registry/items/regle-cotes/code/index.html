<!-- Règle de cotes — HTML + CSS + JS, autonome. Nécessite tokens.css. Palette conseillée : <html data-accent="framboise">.
     Marquez les éléments à mesurer avec data-measure="Nom" et les conteneurs à auditer avec data-measure-group.
     Survol avec Alt (⌥) : distance entre l'élément sélectionné (clic) et l'élément survolé, en px et en jeton. -->
<link rel="stylesheet" href="tokens.css">

<!-- SECTION -->
<div class="rl" data-redline data-trigger="alt" data-unit="both" data-base="8" data-sizes="true">
  <div class="rl-bar" role="toolbar" aria-label="Règle de cotes">
    <span class="rl-bar__brand" aria-hidden="true">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 16.5 16.5 4l3.5 3.5L7.5 20z"/><path d="M8 12.5l1.5 1.5M10.5 10l2 2M13 7.5l1.5 1.5"/></svg>
    </span>
    <div class="rl-seg" role="radiogroup" aria-label="Déclenchement">
      <button type="button" role="radio" data-rl-trigger="alt">Survol <kbd>⌥</kbd></button>
      <button type="button" role="radio" data-rl-trigger="always">Toujours</button>
      <button type="button" role="radio" data-rl-trigger="audit">Tout coter</button>
    </div>
    <button class="rl-issues" type="button" data-rl-issues hidden><span class="rl-issues__dot"></span><span data-rl-issues-n>0 écart</span></button>
    <button class="rl-clear" type="button" data-rl-clear aria-label="Effacer la sélection" disabled>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>
  <p class="rl-live" aria-live="polite" data-rl-live></p>
  <div class="rl-layer" aria-hidden="true" data-rl-layer><svg class="rl-svg" data-rl-svg></svg><div class="rl-labels" data-rl-labels></div></div>
</div>
<!-- /SECTION -->

<style>
  .rl { --rl-c: var(--accent); --rl-warn: var(--warn); --rl-spring: cubic-bezier(.34, 1.56, .64, 1); }

  /* Barre d'outils */
  .rl-bar { display: inline-flex; align-items: center; gap: 8px; padding: 6px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-pill); box-shadow: var(--shadow-popover); }
  .rl-bar__brand { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; background: var(--accent); color: var(--accent-fg); }
  .rl-seg { display: inline-flex; padding: 2px; background: var(--raised); border-radius: var(--radius-pill); }
  .rl-seg button, .rl-issues, .rl-clear { min-height: 36px; border: 0; border-radius: var(--radius-pill); background: none; color: var(--text-muted); font: 500 14px/1 var(--font-sans); cursor: pointer; transition: background-color var(--motion-fast) var(--ease-out), color var(--motion-fast) var(--ease-out); }
  .rl-seg button { display: inline-flex; align-items: center; gap: 6px; padding: 0 14px; white-space: nowrap; }
  .rl-issues { white-space: nowrap; }
  .rl-seg button:hover, .rl-clear:hover:not(:disabled) { color: var(--text-strong); }
  .rl-seg button[aria-checked="true"] { background: var(--surface); color: var(--text-strong); box-shadow: var(--shadow-overlay); }
  .rl-seg kbd { font: 500 12px/1 var(--font-mono); color: var(--text-muted); }
  .rl-issues { display: inline-flex; align-items: center; gap: 8px; padding: 0 12px; background: var(--tint-amber-bg); color: var(--tint-amber-fg); border: 1px solid var(--tint-amber-border); }
  .rl-issues[hidden] { display: none; }
  .rl-issues__dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .rl-clear { display: grid; place-items: center; width: 36px; padding: 0; }
  .rl-clear:disabled { opacity: .4; cursor: default; }
  .rl-bar button:focus-visible { outline: var(--focus-width) solid var(--focus-ring); outline-offset: var(--focus-offset); }
  .rl-live { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* Calque de mesure */
  .rl-layer { position: fixed; inset: 0; z-index: var(--z-overlay); pointer-events: none; }
  .rl-svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .rl-box { fill: none; stroke: var(--rl-c); stroke-width: 1; }
  .rl-box--anchor { stroke-width: 1.5; }
  .rl-box--parent { stroke-dasharray: 4 3; opacity: .7; }
  .rl-handle { fill: var(--surface); stroke: var(--rl-c); stroke-width: 1.25; }
  .rl-line { stroke: var(--rl-c); stroke-width: 1; fill: none; shape-rendering: crispEdges; }
  .rl-line--draw { stroke-dasharray: var(--len) var(--len); animation: rl-draw 240ms var(--ease-out) both; }
  .rl-line--guide { stroke-dasharray: 3 3; opacity: .7; }
  .rl-line--warn { stroke: var(--rl-warn); }
  .rl-tick { stroke: var(--rl-c); stroke-width: 1; shape-rendering: crispEdges; }
  .rl-tick--warn { stroke: var(--rl-warn); }
  .rl-fill { fill: color-mix(in srgb, var(--rl-c) 10%, transparent); }
  .rl-fill--warn { fill: color-mix(in srgb, var(--rl-warn) 16%, transparent); }
  @keyframes rl-draw { from { stroke-dashoffset: var(--len); } to { stroke-dashoffset: 0; } }

  .rl-labels { position: absolute; inset: 0; }
  .rl-tag { position: absolute; left: 0; top: 0; display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 7px; border-radius: 6px; background: var(--rl-c); color: var(--accent-fg);
    font: 600 12px/1 var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; transform: translate(-50%, -50%); box-shadow: 0 2px 8px color-mix(in srgb, var(--rl-c) 30%, transparent); }
  .rl-tag--pop { animation: rl-pop 360ms var(--rl-spring) both; }
  .rl-tag--side { transform: translate(0, -50%); --rl-tx: 0; }
  .rl-tag--above { transform: translate(-50%, -100%); --rl-ty: -100%; }
  .rl-tag i { font-style: normal; font-weight: 500; opacity: .85; }
  .rl-tag--warn { background: var(--tint-amber-bg); color: var(--tint-amber-fg); box-shadow: 0 0 0 1px var(--tint-amber-border); }
  .rl-tag--mini { height: 18px; padding: 0 5px; font-size: 11px; border-radius: 4px; box-shadow: none; }
  .rl-tag--size { background: var(--surface); color: var(--text-strong); box-shadow: 0 0 0 1px var(--rl-c); }
  .rl-tag--name { transform: translate(0, -100%); margin-top: -4px; background: none; color: var(--rl-c); box-shadow: none; padding: 0; height: 16px; font: 600 11px/16px var(--font-sans); }

  [data-redline-scope].is-rl-on [data-measure] { cursor: crosshair; }
  [data-measure]:focus-visible { outline: var(--focus-width) solid var(--focus-ring); outline-offset: var(--focus-offset); }

  @media (max-width: 640px) {
    .rl-bar { gap: 4px; padding: 4px; max-width: 100%; }
    .rl-bar__brand { display: none; }
    .rl-seg button { padding: 0 10px; min-height: 40px; }
    .rl-seg kbd { display: none; }
    .rl-issues, .rl-clear { min-height: 40px; }
    .rl-issues__l { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { .rl-line--draw, .rl-tag--pop { animation: none; } }
</style>

<script>

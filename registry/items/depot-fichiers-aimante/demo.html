<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dépôt de fichiers aimanté — démo</title>
<script>if (!new URLSearchParams(location.search).get('accent')) document.documentElement.setAttribute('data-accent', 'jade');</script>
<link rel="stylesheet" href="../../../css/tokens.css">
<link rel="stylesheet" href="../../../demo-kit/demo.css">
<script src="../../../demo-kit/demo.js"></script>
<style id="component-css"></style>
<style>
  .stage { min-height: 100vh; display: grid; place-items: center; align-content: center; gap: 16px; padding: 40px 24px; }
  .demo-bar { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .demo-bar button { min-height: 44px; padding: 0 16px; border: 1px solid var(--border-control); border-radius: var(--radius-pill); background: var(--surface); color: var(--text-strong); font: 500 14px/1 var(--font-sans); cursor: pointer; }
  .demo-bar button:hover { background: var(--raised); }
  .demo-bar button:focus-visible { outline: var(--focus-width) solid var(--focus-ring); outline-offset: 2px; }
  @media (max-width: 760px) { .stage { padding: 16px 12px; align-content: start; } }
  .is-thumb .stage { padding: 24px; }
  .is-thumb .demo-bar, .is-thumb .ls__p { display: none; }
</style>
</head>
<body>
<main class="stage">
  <div id="mount" style="display: contents"></div>
  <div class="demo-bar">
    <button type="button" data-demo="sim">Simuler un dépôt</button>
    <button type="button" data-demo="bad">Déposer un fichier refusé</button>
    <button type="button" data-demo="clear">Vider</button>
  </div>
</main>
<script>
  var props = Socle.props({ force: 0.55, portee: 140, raideur: 210, amortissement: 20, taille: 10, echec: true });
  var el = null, api = null;
  // Aperçus d'exemple dessinés en canvas avec les couleurs des tokens (ticket de caisse, note de taxi)
  function receipt(lines, wide) {
    var s = getComputedStyle(document.documentElement), c = document.createElement('canvas'), x = c.getContext('2d');
    c.width = 96; c.height = 96;
    x.fillStyle = s.getPropertyValue('--raised').trim(); x.fillRect(0, 0, 96, 96);
    x.save(); x.translate(48, 52); x.rotate(wide ? -0.06 : 0.08);
    x.fillStyle = s.getPropertyValue('--surface').trim(); x.fillRect(-26, -40, 52, 84);
    x.fillStyle = s.getPropertyValue('--text-muted').trim();
    for (var i = 0; i < lines; i++) x.fillRect(-18, -30 + i * 9, i % 3 === 2 ? 20 : 34, 3);
    x.fillStyle = s.getPropertyValue('--accent').trim(); x.fillRect(-18, 30, 36, 5);
    x.restore();
    return c.toDataURL('image/png');
  }
  function samples() {
    return [
      { name: 'ticket-boulangerie-des-carmes.jpg', size: 1.32e6, type: 'image/jpeg', thumb: receipt(6), meta: 'Ticket · 14,60 € TTC · rapproché' },
      { name: 'facture-hebergement-novembre.pdf', size: 186e3, type: 'application/pdf', meta: 'Facture · 29,99 € TTC · rapprochée' },
      { name: 'releve-bancaire-octobre.pdf', size: 2.4e6, type: 'application/pdf', fail: !!props.echec, meta: 'Relevé · 42 opérations lues' },
      { name: 'note-taxi-gare-part-dieu.png', size: 820e3, type: 'image/png', thumb: receipt(4, true), meta: 'Note de frais · 23,00 € · rapprochée' },
    ];
  }
  function apply(p) {
    if (!el) return;
    el.dataset.pull = p.force; el.dataset.radius = p.portee; el.dataset.stiffness = p.raideur; el.dataset.damping = p.amortissement; el.dataset.max = p.taille;
    var hint = el.querySelector('.drop__hint'); if (hint) hint.textContent = 'PDF, JPG ou PNG · ' + p.taille + ' Mo max par fichier';
    if (api) api.config();
  }
  fetch('code/index.html').then(function (r) { return r.text(); }).then(function (t) {
    var css = t.match(/<style>([\s\S]*?)<\/style>/), mk = t.match(/<!-- SECTION -->([\s\S]*?)<!-- \/SECTION -->/), js = t.match(/<script>([\s\S]*?)<\/script>/);
    document.getElementById('component-css').textContent = css ? css[1] : '';
    document.getElementById('mount').innerHTML = mk ? mk[1] : '';
    el = document.querySelector('[data-drop]');
    apply(props);
    var s = document.createElement('script'); s.textContent = js ? js[1] : ''; document.body.appendChild(s);
    api = el._drop;
    if (Socle.thumb) setTimeout(function () { api.simulate(samples().slice(0, 3)); }, 300);
  });
  function clear() { if (!api) return; api.items.slice().forEach(function (it) { if (it.abort) it.abort(); it.el.remove(); }); api.items = []; api.refresh(); }
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-demo]'); if (!b || !api) return;
    if (b.dataset.demo === 'sim') api.simulate(samples());
    if (b.dataset.demo === 'bad') api.simulate([{ name: 'maquette-plaquette-2027.psd', size: 48.2e6, type: 'image/vnd.adobe.photoshop' }]);
    if (b.dataset.demo === 'clear') clear();
  });
  Socle.onChange(apply);
  Socle.onReplay(function () { clear(); setTimeout(function () { api && api.simulate(samples()); }, 200); });
</script>
</body>
</html>

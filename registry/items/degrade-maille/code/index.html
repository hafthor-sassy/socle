<!-- Dégradé maillé vivant — HTML + CSS + JS (shader WebGL 1, repli canvas 2D). Nécessite tokens.css. Marque fictive : Aplomb (banque en ligne). -->
<link rel="stylesheet" href="tokens.css">

<!-- SECTION -->
<section class="mg" aria-labelledby="mg-title">
  <div class="mg__field" data-mesh
    data-speed="1" data-warp="0.6" data-spread="38" data-intensity="0.85" data-grain="0.06"
    data-pointer="true" data-calm="0.42" data-side="auto" aria-hidden="true"></div>

  <div class="mg__inner">
    <div class="mg__content">
      <a class="mg__brand" href="#accueil" aria-label="Aplomb, accueil">
        <svg viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="28" fill="currentColor"/><path d="M28 72 50 26l22 46" fill="none" style="stroke:var(--accent-fg)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M38 56h24" style="stroke:var(--accent-fg)" stroke-width="9" stroke-linecap="round"/></svg>
        <span>Aplomb</span>
      </a>
      <h1 id="mg-title" class="mg__title">Votre argent pro, enfin au&nbsp;calme.</h1>
      <p class="mg__lead">Le compte des indépendants qui met de côté la TVA et les cotisations à chaque encaissement. Vous ne voyez que ce qui est vraiment à vous.</p>
      <div class="mg__actions">
        <a class="mg__btn mg__btn--solid" href="#ouvrir">Ouvrir un compte</a>
        <a class="mg__btn mg__btn--ghost" href="#tarifs">Voir les offres</a>
      </div>
      <p class="mg__note">Ouverture en 8 minutes · Agrément ACPR · IBAN français</p>
    </div>

    <figure class="mg__card" aria-label="Exemple de compte Aplomb">
      <div class="mg__card-head">
        <span class="mg__card-label">Disponible</span>
        <span class="mg__pill">Compte Pro</span>
      </div>
      <p class="mg__balance">8&nbsp;742<span>,18&nbsp;€</span></p>
      <div class="mg__bar" role="img" aria-label="Sur 12 434 € encaissés : 8 742 € disponibles, 2 486 € de TVA et 1 206 € de cotisations mis de côté">
        <span style="flex: 70.3"></span><span style="flex: 20"></span><span style="flex: 9.7"></span>
      </div>
      <ul class="mg__legend" aria-hidden="true">
        <li><i></i>Disponible</li><li><i></i>TVA 2&nbsp;486&nbsp;€</li><li><i></i>Cotisations 1&nbsp;206&nbsp;€</li>
      </ul>
      <ul class="mg__tx">
        <li><span class="mg__tx-name">Studio Hublot</span><span class="mg__tx-meta">Virement reçu · aujourd’hui</span><span class="mg__tx-amt is-in">+&nbsp;2&nbsp;400,00&nbsp;€</span></li>
        <li><span class="mg__tx-name">Mise de côté TVA</span><span class="mg__tx-meta">Automatique · 20&nbsp;%</span><span class="mg__tx-amt">480,00&nbsp;€</span></li>
        <li><span class="mg__tx-name">Imprimerie Carmin</span><span class="mg__tx-meta">Carte · hier</span><span class="mg__tx-amt">−&nbsp;186,40&nbsp;€</span></li>
      </ul>
    </figure>
  </div>
</section>
<!-- /SECTION -->

<style>

  }

  }

    margin: 0; color: var(--text-strong); max-width: 13ch;

<script>
/* MeshGradient : quatre teintes tirées de la palette (tokens.css) qui ondulent dans un shader WebGL,
   avec un grain fin et une zone calme pour le texte. Repli canvas 2D si WebGL est indisponible. */
(function () {
  var REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)');

  function read(el) {
    var d = el.dataset;
    return {
      speed: d.speed != null ? +d.speed : 1, warp: d.warp != null ? +d.warp : 0.6, spread: d.spread != null ? +d.spread : 38,
      intensity: d.intensity != null ? +d.intensity : 0.85, grain: d.grain != null ? +d.grain : 0.06,
      pointer: d.pointer !== 'false', calm: d.calm != null ? +d.calm : 0.42, side: d.side || 'auto',
      fallback: d.fallback || '',

  }

  /* Couleurs : relues dans les variables, puis teintes voisines par rotation de teinte (HSL). */
  function rgbOf(el, v) {
    var i = document.createElement('i');
    i.style.cssText = 'position:absolute;width:0;height:0;visibility:hidden;color:var(' + v + ')';
    el.appendChild(i);
    var m = (getComputedStyle(i).color.match(/[\d.]+/g) || [0, 0, 0]).slice(0, 3).map(function (n) { return n / 255; });
    i.remove();
    return m;
  }
  function rot(c, deg) {
    var r = c[0], g = c[1], b = c[2], mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, h = 0, s = 0, d = mx - mn;
    if (d) { s = l > .5 ? d / (2 - mx - mn) : d / (mx + mn); h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; h /= 6; }
    h = (h + deg / 360 + 1) % 1;
    function f(p, q, t) { t = (t + 1) % 1; return t < 1 / 6 ? p + (q - p) * 6 * t : t < .5 ? q : t < 2 / 3 ? p + (q - p) * (2 / 3 - t) * 6 : p; }
    if (!s) return [l, l, l];
    var q = l < .5 ? l * (1 + s) : l + s - l * s, p = 2 * l - q;

  function palette(el, o) {
    var vivid = rgbOf(el, '--accent-vivid'), acc = rgbOf(el, '--accent'), soft = rgbOf(el, '--accent-subtle-border'), bg = rgbOf(el, '--bg');
    var dark = (bg[0] + bg[1] + bg[2]) / 3 < 0.5;
    // En sombre, la 3e teinte est un reflet clair ; en clair, la teinte douce de l'accent.
    var hi = dark ? vivid.map(function (v, i) { return v + (rgbOf(el, '--text-strong')[i] - v) * 0.45; }) : soft;
    return { bg: bg, c: [vivid, rot(vivid, o.spread), hi, rot(acc, -o.spread * 0.8)], dark: dark };
  }

  var VS = 'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
  var FS = [
    'precision highp float;',
    'uniform vec2 uRes;uniform float uT;uniform vec3 uBg;uniform vec3 uC0;uniform vec3 uC1;uniform vec3 uC2;uniform vec3 uC3;',
    'uniform vec2 uPtr;uniform float uPtrA;uniform float uWarp;uniform float uInt;uniform float uGrain;uniform float uCalm;uniform float uSide;uniform float uDark;',
    'float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}',
    'float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}',
    'float fbm(vec2 p){float v=0.,a=.5;mat2 m=mat2(1.6,1.2,-1.2,1.6);for(int i=0;i<4;i++){v+=a*n(p);p=m*p;a*=.5;}return v;}',
    'void main(){',
    '  vec2 uv=gl_FragCoord.xy/uRes;float asp=uRes.x/uRes.y;vec2 p=vec2(uv.x*asp,uv.y)*1.35;float t=uT*.35;',
    // Pointeur : tourbillon doux autour du curseur
    '  vec2 pp=vec2(uPtr.x*asp,uPtr.y)*1.35;vec2 dp=p-pp;float pf=uPtrA*exp(-dot(dp,dp)/.12);',
    '  p+=pf*.22*vec2(-dp.y,dp.x)/max(length(dp),.08);',
    // Déformation de domaine en deux passes : des nappes de soie plutôt que des taches rondes
    '  vec2 q=vec2(fbm(p+vec2(0.,t*.6)),fbm(p+vec2(5.2,1.3)-t*.5));',
    '  vec2 r=vec2(fbm(p+3.*uWarp*q+vec2(1.7,9.2)+t*.7),fbm(p+3.*uWarp*q+vec2(8.3,2.8)-t*.6));',
    '  float f=fbm(p+3.*uWarp*r);',
    '  vec3 col=mix(uC0,uC1,smoothstep(.25,.75,f));',
    '  col=mix(col,uC2,smoothstep(.45,1.,length(q))*(.85-.35*uDark));',
    '  col=mix(col,uC3,smoothstep(.45,.85,r.x)*.75);',
    // Vallées : le fond remonte entre les nappes pour donner du relief
    '  float depth=smoothstep(.2,.75,f*.9+r.y*.45+pf*.25);',
    '  depth=mix(depth,depth*depth,uDark);',
    '  col=mix(uBg,col,mix(1.,depth,.5+.45*uDark)*uInt);',
    '  float silk=sin((r.x+r.y)*9.+t*1.2);col+=silk*.025*uInt*depth;',
    // Zone calme : fondu vers --bg du côté du texte (0 gauche, 1 bas, 2 aucun)
    '  float calm=uSide<.5?smoothstep(uCalm+.28,uCalm-.06,uv.x):(uSide<1.5?smoothstep(min(.9,uCalm*1.45)+.3,min(.9,uCalm*1.45)-.08,uv.y):0.);',
    '  col=mix(col,uBg,clamp(calm,0.,1.));',
    '  float g=h(gl_FragCoord.xy+fract(uT*7.)*91.)-.5;col+=g*uGrain*(1.-calm*.8);',
    '  gl_FragColor=vec4(col,1.);',
    '}'
  ].join('\n');

  function init(scope) {
    var el = (scope || document).querySelector('[data-mesh]');
    if (!el || el._mesh) return el && el._mesh;
    var section = el.closest('section') || el.parentNode;
    var o = read(el), pal = palette(el, o);
    var canvas = document.createElement('canvas');
    el.appendChild(canvas);
    var gl = null, prog = null, U = {}, ctx2d = null;
    if (o.fallback !== 'canvas') {
      try { gl = canvas.getContext('webgl', { antialias: false, premultipliedAlpha: false, preserveDrawingBuffer: false }); } catch (e) { gl = null; }
    }
    if (gl) {
      var sh = function (type, src) { var s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return gl.getShaderParameter(s, gl.COMPILE_STATUS) ? s : null; };
      var vs = sh(gl.VERTEX_SHADER, VS), fs = sh(gl.FRAGMENT_SHADER, FS);
      if (vs && fs) {
        prog = gl.createProgram(); gl.attachShader(prog, vs); gl.attachShader(prog, fs); gl.linkProgram(prog);
        if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) prog = null;
      }
      if (prog) {
        gl.useProgram(prog);
        var buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
        var loc = gl.getAttribLocation(prog, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
        ['uRes', 'uT', 'uBg', 'uC0', 'uC1', 'uC2', 'uC3', 'uPtr', 'uPtrA', 'uWarp', 'uInt', 'uGrain', 'uCalm', 'uSide', 'uDark'].forEach(function (k) { U[k] = gl.getUniformLocation(prog, k); });
      } else gl = null;
    }
    if (!gl) {
      // Repli : quatre halos en canvas 2D sur une petite surface, agrandie (le lissage fait le fondu).
      canvas.remove(); canvas = document.createElement('canvas'); el.appendChild(canvas);
      ctx2d = canvas.getContext('2d');
      el.dataset.renderer = 'canvas';
    } else el.dataset.renderer = 'webgl';

    var W = 1, H = 1, scale = 1, raf = 0, visible = true, last = 0, time = 7, ptr = [0.7, 0.5], ptrT = [0.7, 0.5], ptrA = 0, ptrAT = 0;

    function sideCode() {
      if (o.side === 'none' || o.calm <= 0) return 2;
      if (o.side === 'left') return 0;
      if (o.side === 'bottom') return 1;
      return W < 900 ? 1 : 0;
    }
    function resize() {
      var r = el.getBoundingClientRect();
      W = Math.max(1, r.width); H = Math.max(1, r.height);
      scale = gl ? Math.min(1.5, window.devicePixelRatio || 1) : 0.125;
      canvas.width = Math.max(2, Math.round(W * scale)); canvas.height = Math.max(2, Math.round(H * scale));
      if (gl) gl.viewport(0, 0, canvas.width, canvas.height);
    }
    function v3(k, c) { gl.uniform3f(U[k], c[0], c[1], c[2]); }
    function render() {
      if (gl) {
        gl.uniform2f(U.uRes, canvas.width, canvas.height); gl.uniform1f(U.uT, time);
        v3('uBg', pal.bg); v3('uC0', pal.c[0]); v3('uC1', pal.c[1]); v3('uC2', pal.c[2]); v3('uC3', pal.c[3]);
        gl.uniform2f(U.uPtr, ptr[0], 1 - ptr[1]); gl.uniform1f(U.uPtrA, ptrA);
        gl.uniform1f(U.uWarp, o.warp); gl.uniform1f(U.uInt, o.intensity); gl.uniform1f(U.uGrain, o.grain);
        gl.uniform1f(U.uCalm, o.calm); gl.uniform1f(U.uSide, sideCode()); gl.uniform1f(U.uDark, pal.dark ? 1 : 0);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
      } else {
        var w = canvas.width, h = canvas.height, t = time, c = ctx2d, css = function (a, al) { return 'rgba(' + Math.round(a[0] * 255) + ',' + Math.round(a[1] * 255) + ',' + Math.round(a[2] * 255) + ',' + al + ')'; };
        c.globalCompositeOperation = 'source-over'; c.fillStyle = css(pal.bg, 1); c.fillRect(0, 0, w, h);
        var pts = [[.70 + .16 * Math.sin(t * .21), .38 - .18 * Math.cos(t * .17), .5], [.92 + .12 * Math.cos(t * .19 + 1), .78 - .16 * Math.sin(t * .23 + 2), .45], [.45 + .2 * Math.sin(t * .15 + 4), .85 - .22 * Math.cos(t * .13 + 1.5), .55], [.98 + .1 * Math.sin(t * .11 + 3), .12 - .1 * Math.cos(t * .2), .4]];
        for (var i = 0; i < 4; i++) {
          var x = pts[i][0] * w * (H / W) * (W / H), y = pts[i][1] * h, rr = pts[i][2] * h * 1.4;

          var g = c.createRadialGradient(x, y, 0, x, y, rr);
          g.addColorStop(0, css(pal.c[i], o.intensity * .9)); g.addColorStop(1, css(pal.c[i], 0));
          c.fillStyle = g; c.fillRect(0, 0, w, h);
        }
        var sc = sideCode();
        if (sc < 2) {
          var lg = sc === 0 ? c.createLinearGradient(0, 0, w, 0) : c.createLinearGradient(0, h, 0, 0);
          var cv = sc === 1 ? Math.min(.9, o.calm * 1.45) : o.calm;
          lg.addColorStop(0, css(pal.bg, 1)); lg.addColorStop(Math.max(0, cv - .06), css(pal.bg, 1)); lg.addColorStop(Math.min(1, cv + .28), css(pal.bg, 0));
          c.fillStyle = lg; c.fillRect(0, 0, w, h);
        }

    }

      raf = 0; if (!visible) return;
      var dt = Math.min(0.05, last ? (now - last) / 1000 : 0.016); last = now;
      time += dt * o.speed * 0.9;
      var k = 1 - Math.exp(-dt * 3.2);
      ptr[0] += (ptrT[0] - ptr[0]) * k; ptr[1] += (ptrT[1] - ptr[1]) * k; ptrA += (ptrAT - ptrA) * (1 - Math.exp(-dt * 2));
      render();
      if (o.speed > 0 || Math.abs(ptrA - ptrAT) > 0.002 || Math.abs(ptr[0] - ptrT[0]) + Math.abs(ptr[1] - ptrT[1]) > 0.001) raf = requestAnimationFrame(frame);
      else last = 0;
    }
    function wake() { if (!raf && visible) { if (REDUCED.matches) render(); else raf = requestAnimationFrame(frame); } }

    function onMove(e) {
      if (!o.pointer || e.pointerType === 'touch') return;
      var r = el.getBoundingClientRect();
      ptrT = [(e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height]; ptrAT = 1; wake();
    }
    function onLeave() { ptrAT = 0; wake(); }
    section.addEventListener('pointermove', onMove, { passive: true });
    section.addEventListener('pointerleave', onLeave);

    var ro = new ResizeObserver(function () { resize(); render(); wake(); }); ro.observe(el);
    var io = new IntersectionObserver(function (en) { visible = en[0].isIntersecting; if (visible) wake(); else { cancelAnimationFrame(raf); raf = 0; last = 0; } }); io.observe(el);
    var mo = new MutationObserver(function () { pal = palette(el, o); render(); wake(); });
    mo.observe(document.documentElement, { attributes: true, attributeFilter: ['class', 'style', 'data-accent'] });
    document.addEventListener('visibilitychange', function () { visible = !document.hidden; if (visible) wake(); });
    if (gl) canvas.addEventListener('webglcontextlost', function (e) { e.preventDefault(); cancelAnimationFrame(raf); raf = 0; });

    resize(); render();
    requestAnimationFrame(function () { el.setAttribute('data-ready', ''); });
    wake();

    var api = {
      renderer: gl ? 'webgl' : 'canvas',
      update: function (next) { o = next; pal = palette(el, o); render(); wake(); },

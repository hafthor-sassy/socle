<!-- Bouton lentille — HTML + CSS + JS autonomes (WebGL 1, sans bibliothèque). Nécessite tokens.css.
     Le fond sous le bouton est réfracté comme par du verre : bords qui bombent, léger grossissement, aberration chromatique,
     reflet qui suit le pointeur, voile pour garder le contraste AA. Repli CSS (backdrop-filter) sans WebGL.
     La source réfractée est un canvas, une image ou une vidéo (même origine) désigné par data-lens-source. -->
<link rel="stylesheet" href="tokens.css">

<!-- SECTION -->
<section class="lu" aria-labelledby="lu-h">
  <canvas class="lu__bg" id="lu-bg" aria-hidden="true"></canvas>

  <header class="lu__bar">
    <span class="lu__brand">
      <svg class="lu__logo" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="44" class="lu__logo-ring"/><circle cx="60" cy="40" r="19" class="lu__logo-dot"/></svg>
      <span class="lu__word">lueurs</span>
    </span>
    <nav class="lu__nav" aria-label="Festival">
      <a href="#">Programme</a><a href="#">Artistes</a><a href="#">Infos pratiques</a>
    </nav>
  </header>

  <div class="lu__copy">
    <p class="lu__kicker">Festival d’arts numériques · 4ᵉ édition</p>
    <h2 class="lu__h" id="lu-h">Quatre nuits de lumière, de son et de code.</h2>
    <p class="lu__date"><time datetime="2027-03-12">12</time> → <time datetime="2027-03-15">15 mars 2027</time> · Lyon, Halle Tony-Garnier</p>
  </div>

  <div class="lu__ctas">
    <button class="lens" type="button" data-lens data-lens-source="#lu-bg" data-refraction="1" data-aberration="0.35" data-frost="1.5" data-veil="0.42" data-rest="0.3">
      <span class="lens__label">Prendre mon billet</span>
      <svg class="lens__ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
    </button>
    <button class="lens lens--quiet" type="button" data-lens data-lens-source="#lu-bg" data-refraction="1" data-aberration="0.35" data-frost="1.5" data-veil="0.42" data-rest="0.3">
      <span class="lens__label">Voir le programme</span>
    </button>
  </div>
</section>
<!-- /SECTION -->

<script>
/* LensButton — lentille WebGL sur un bouton. Attributs : data-lens-source (sélecteur du canvas / img / video affiché derrière),
   data-refraction (0–1,5), data-aberration (0–1), data-frost (flou, px), data-veil (0–0,7), data-rest (réfraction au repos, 0–1).
   API : LensButton.attach(btn) ; LensButton.redraw() quand la source change (appelé chaque image si elle est animée). */
(function () {
  var reduce = window.matchMedia ? matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
  var lenses = [];
  var VS = 'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}';
  var FS = [
    'precision mediump float;',
    'uniform sampler2D T;uniform vec2 S;uniform float M,R,K,AB,FR,DPR;uniform vec2 L;uniform vec4 V;uniform vec3 RIM;',
    'float sd(vec2 p,vec2 b,float r){vec2 q=abs(p)-b+r;return length(max(q,0.))+min(max(q.x,q.y),0.)-r;}',
    'vec3 tx(vec2 px){vec2 uv=(px+M)/(S+2.*M);return texture2D(T,clamp(uv,0.001,.999)).rgb;}',
    'vec3 fr(vec2 px){if(FR<.1)return tx(px);vec3 c=tx(px)*.2;',
    ' for(int i=0;i<8;i++){float a=float(i)*.785398;c+=tx(px+vec2(cos(a),sin(a))*FR)*.1;}return c;}',
    'void main(){',
    ' vec2 p=vec2(gl_FragCoord.x,S.y*DPR-gl_FragCoord.y)/DPR;vec2 c=S*.5;vec2 q=p-c;',
    ' float d=sd(q,c,R);float h=.5;',
    ' vec2 n=normalize(vec2(sd(q+vec2(h,0.),c,R)-sd(q-vec2(h,0.),c,R),sd(q+vec2(0.,h),c,R)-sd(q-vec2(0.,h),c,R))+1e-5);',
    ' float inn=-d;float bz=min(S.y*.5,24.);float t=clamp(1.-inn/bz,0.,1.);',
    ' float amt=K*t*t*bz*1.6;',
    ' vec2 base=c+q*(1.-.1*K);vec2 o=n*amt;',
    ' vec3 col=vec3(fr(base+o*(1.+AB)).r,fr(base+o).g,fr(base+o*(1.-AB)).b);',
    ' col=mix(col,V.rgb,V.a);',
    ' vec2 ld=normalize(L-c+1e-3);float face=max(0.,dot(n,ld));',
    ' float rim=smoothstep(2.2,0.,inn)*(.25+.75*face)+smoothstep(7.,0.,inn)*face*.35;',
    ' col+=RIM*rim*(.35+.4*min(K,1.));',
    ' vec2 g=p-L;col+=RIM*exp(-dot(g,g)/(2.*S.y*S.y*.7))*.10*min(K,1.);',
    ' col*=1.-smoothstep(5.,0.,inn)*(1.-face)*.12;',
    ' col=clamp(col,0.,1.);float a=clamp(.5-d,0.,1.);gl_FragColor=vec4(col*a,a);}'
  ].join('\n');

  function css(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
  function rgb(str) {
    var c = document.createElement('canvas').getContext('2d');
    c.fillStyle = '#000'; c.fillStyle = str; var v = c.fillStyle;
    if (v[0] === '#') return [parseInt(v.slice(1, 3), 16) / 255, parseInt(v.slice(3, 5), 16) / 255, parseInt(v.slice(5, 7), 16) / 255];
    var m = v.match(/[\d.]+/g) || [0, 0, 0]; return [m[0] / 255, m[1] / 255, m[2] / 255];
  }

  function Lens(btn) {
    this.btn = btn;
    this.src = document.querySelector(btn.dataset.lensSource);
    this.k = 0; this.v = 0; this.target = 0;
    this.light = [0, 0]; this.lightT = null;
    var cv = document.createElement('canvas');
    cv.className = 'lens__glass';
    cv.setAttribute('aria-hidden', 'true');
    btn.insertBefore(cv, btn.firstChild);
    this.cv = cv;
    this.snap = document.createElement('canvas');
    this.sctx = this.snap.getContext('2d');
    var gl = cv.getContext('webgl', { premultipliedAlpha: true, alpha: true, antialias: false });
    if (!gl || !this.src || !this.init(gl)) { btn.classList.add('lens--fallback'); cv.remove(); this.gl = null; }
    var self = this;
    btn.addEventListener('pointerenter', function () { self.hot = true; self.aim(); });
    btn.addEventListener('pointerleave', function () { self.hot = false; self.press = false; self.lightT = null; self.aim(); });
    btn.addEventListener('pointermove', function (e) { var r = btn.getBoundingClientRect(); self.lightT = [e.clientX - r.left, e.clientY - r.top]; wake(); });
    btn.addEventListener('pointerdown', function () { self.press = true; self.aim(); });
    btn.addEventListener('pointerup', function () { self.press = false; self.aim(); });
    btn.addEventListener('focus', function () { self.focus = true; self.aim(); });
    btn.addEventListener('blur', function () { self.focus = false; self.aim(); });
    this.config();
    this.k = this.target;
  }

  Lens.prototype.init = function (gl) {
    function sh(t, s) { var o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o); return gl.getShaderParameter(o, gl.COMPILE_STATUS) ? o : null; }
    var vs = sh(gl.VERTEX_SHADER, VS), fs = sh(gl.FRAGMENT_SHADER, FS);
    if (!vs || !fs) return false;
    var pr = gl.createProgram(); gl.attachShader(pr, vs); gl.attachShader(pr, fs); gl.linkProgram(pr);
    if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) return false;
    gl.useProgram(pr);
    var b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
    var loc = gl.getAttribLocation(pr, 'a'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    var tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
    [gl.TEXTURE_WRAP_S, gl.TEXTURE_WRAP_T].forEach(function (w) { gl.texParameteri(gl.TEXTURE_2D, w, gl.CLAMP_TO_EDGE); });
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    this.u = {};
    var self = this;
    ['T', 'S', 'M', 'R', 'K', 'AB', 'FR', 'DPR', 'L', 'V', 'RIM'].forEach(function (n) { self.u[n] = gl.getUniformLocation(pr, n); });
    this.gl = gl;
    this.colors();
    return true;
  };

  Lens.prototype.colors = function () {
    var dark = document.documentElement.classList.contains('dark');
    this.veilRGB = rgb(css('--surface'));
    this.rimRGB = dark ? rgb(css('--text-strong')).map(function (x) { return x * 0.55; }) : rgb(css('--surface'));
  };

  Lens.prototype.config = function () {
    var d = this.btn.dataset;
    this.refr = d.refraction != null ? +d.refraction : 1;
    this.ab = (d.aberration != null ? +d.aberration : 0.35) * 0.45;
    this.frost = d.frost != null ? +d.frost : 1.5;
    this.veil = d.veil != null ? +d.veil : 0.42;
    this.rest = d.rest != null ? +d.rest : 0.3;
    this.btn.style.setProperty('--lens-veil', Math.round(this.veil * 100) + '%');
    this.aim();
  };

  Lens.prototype.aim = function () {
    var on = this.hot || this.focus;
    this.target = this.refr * (this.press ? 1.25 : on ? 1 : this.rest);
    wake();
  };

  Lens.prototype.step = function (dt) {
    if (reduce.matches) { this.k = this.target; this.v = 0; }
    else { var a = -170 * (this.k - this.target) - 15 * this.v; this.v += a * dt; this.k += this.v * dt; }
    var w = this.btn.offsetWidth, h = this.btn.offsetHeight;
    var lt = this.lightT || [w * 0.22, -h * 0.6];
    this.light[0] += (lt[0] - this.light[0]) * Math.min(1, dt * 14);
    this.light[1] += (lt[1] - this.light[1]) * Math.min(1, dt * 14);
    return Math.abs(this.k - this.target) + Math.abs(this.v) > 0.002 || Math.abs(lt[0] - this.light[0]) + Math.abs(lt[1] - this.light[1]) > 0.5;
  };

  Lens.prototype.render = function () {
    var gl = this.gl; if (!gl) return;
    var btn = this.btn, src = this.src, dpr = Math.min(2, window.devicePixelRatio || 1);
    var w = btn.offsetWidth, h = btn.offsetHeight, m = 44;
    if (!w || !h) return;
    var W = Math.round(w * dpr), H = Math.round(h * dpr);
    if (this.cv.width !== W || this.cv.height !== H) { this.cv.width = W; this.cv.height = H; }
    // Instantané de la source sous le bouton (+ marge pour les bords qui bombent)
    var br = btn.getBoundingClientRect(), sr = src.getBoundingClientRect();
    var sw = src.width || src.naturalWidth || src.videoWidth, sx = sw / sr.width, sy = (src.height || src.naturalHeight || src.videoHeight) / sr.height;
    var ow = Math.round((w + 2 * m) * dpr), oh = Math.round((h + 2 * m) * dpr);
    if (this.snap.width !== ow || this.snap.height !== oh) { this.snap.width = ow; this.snap.height = oh; }
    var scale = br.width / w || 1; // tient compte d'un scale() appliqué au bouton
    var cx = br.left + br.width / 2 - sr.left, cy = br.top + br.height / 2 - sr.top;
    this.sctx.clearRect(0, 0, ow, oh);
    try {
      this.sctx.drawImage(src, (cx - (w / 2 + m) * scale) * sx, (cy - (h / 2 + m) * scale) * sy, (w + 2 * m) * scale * sx, (h + 2 * m) * scale * sy, 0, 0, ow, oh);
    } catch (e) { return; }
    gl.viewport(0, 0, W, H);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, this.snap);
    var cs = getComputedStyle(btn), rad = Math.min(h / 2, parseFloat(cs.borderTopLeftRadius) || h / 2);
    var u = this.u;
    gl.uniform1i(u.T, 0); gl.uniform2f(u.S, w, h); gl.uniform1f(u.M, m); gl.uniform1f(u.R, rad);
    gl.uniform1f(u.K, Math.max(0, this.k)); gl.uniform1f(u.AB, this.ab); gl.uniform1f(u.FR, this.frost); gl.uniform1f(u.DPR, dpr);
    gl.uniform2f(u.L, this.light[0], this.light[1]);
    gl.uniform4f(u.V, this.veilRGB[0], this.veilRGB[1], this.veilRGB[2], this.veil);
    gl.uniform3f(u.RIM, this.rimRGB[0], this.rimRGB[1], this.rimRGB[2]);
    gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  };

  var raf = 0, last = 0, live = false, visible = true;
  function frame(t) {
    var dt = last ? Math.min(0.033, (t - last) / 1000) : 1 / 60; last = t;
    if (window.LensButton.onFrame) window.LensButton.onFrame(t, dt);
    var moving = false;
    lenses.forEach(function (l) { if (l.step(dt)) moving = true; l.render(); });
    raf = (moving || (live && visible && !reduce.matches)) ? requestAnimationFrame(frame) : 0;
    if (!raf) last = 0;
  }
  function wake() { if (!raf) raf = requestAnimationFrame(frame); }

  window.LensButton = {
    onFrame: null,
    attach: function (btn) { if (!btn._lens) { btn._lens = new Lens(btn); lenses.push(btn._lens); wake(); } return btn._lens; },
    init: function (scope) { (scope || document).querySelectorAll('[data-lens]').forEach(window.LensButton.attach); },
    animate: function (on) { live = !!on; wake(); },     // source animée : rendu à chaque image (pause hors écran)
    redraw: function () { wake(); },
    config: function () { lenses.forEach(function (l) { l.config(); }); wake(); },
    setVisible: function (v) { visible = v; wake(); },
  };
  new MutationObserver(function () { lenses.forEach(function (l) { if (l.gl) l.colors(); }); wake(); })
    .observe(document.documentElement, { attributes: true, attributeFilter: ['class', 'style', 'data-accent'] });
  addEventListener('resize', wake);
  addEventListener('scroll', wake, { passive: true });
  window.LensButton.init();
})();

/* Mise en scène : affiche du festival Lueurs dessinée en canvas (couleurs relues dans tokens.css). */
(function () {
  var cv = document.getElementById('lu-bg'); if (!cv) return;
  var ctx = cv.getContext('2d'), section = cv.parentNode, C = {}, W = 0, H = 0, dpr = 1, seen = true;
  var reduce = window.matchMedia ? matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
  function read() {
    var s = getComputedStyle(document.documentElement);
    ['--bg', '--border', '--border-strong', '--accent', '--accent-vivid', '--accent-subtle', '--text-muted'].forEach(function (k) { C[k] = s.getPropertyValue(k).trim(); });
  }
  function size() {
    dpr = Math.min(2, window.devicePixelRatio || 1);
    W = section.clientWidth; H = section.clientHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  }
  function draw(t) {
    var s = t / 1000;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = C['--bg']; ctx.fillRect(0, 0, W, H);
    // Trame de points
    ctx.fillStyle = C['--border'];
    for (var y = 12; y < H; y += 24) for (var x = 12; x < W; x += 24) ctx.fillRect(x - 1, y - 1, 2, 2);
    // Anneaux concentriques en rotation lente
    var mob = W < 640, rx = mob ? W * 0.8 : W * 0.74, ry = mob ? H * 0.3 : H * 0.4, R = Math.max(W, H) * 0.5;
    ctx.lineWidth = 1.5;
    for (var i = 0; i < 9; i++) {
      var r = R * (0.18 + i * 0.1);
      ctx.save(); ctx.translate(rx, ry); ctx.rotate((i % 2 ? -1 : 1) * s * (0.04 + i * 0.008));
      ctx.setLineDash(i % 3 === 0 ? [] : [r * 0.18, r * 0.06]);
      ctx.strokeStyle = i % 3 === 0 ? C['--accent'] : C['--accent-vivid'];
      ctx.globalAlpha = 0.85 - i * 0.07;
      ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
    }
    ctx.globalAlpha = 1; ctx.setLineDash([]);
    // Disque plein décalé (le motif du logo)
    ctx.fillStyle = C['--accent']; ctx.beginPath(); ctx.arc(rx + R * 0.08, ry - R * 0.08, R * 0.12, 0, Math.PI * 2); ctx.fill();
    // Rayures diagonales qui glissent
    ctx.save(); ctx.beginPath(); ctx.rect(0, H * (mob ? 0.5 : 0.52), W, H); ctx.clip();
    ctx.strokeStyle = C['--accent-vivid']; ctx.lineWidth = 2; ctx.globalAlpha = 0.5;
    var off = (s * 18) % 28;
    for (var k = -H; k < W + H; k += 28) { ctx.beginPath(); ctx.moveTo(k + off, H); ctx.lineTo(k + off + H * 0.6, H * 0.4); ctx.stroke(); }
    ctx.restore(); ctx.globalAlpha = 1;
    // Mot géant (deux lignes sur mobile, pour passer derrière les boutons empilés)
    var fs = Math.round(W * (mob ? 0.44 : 0.235)), sway = Math.sin(s * 0.3) * 6;
    ctx.font = '800 ' + fs + 'px Geist, system-ui, sans-serif';
    if ('letterSpacing' in ctx) ctx.letterSpacing = (-fs * 0.045) + 'px';
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = C['--border-strong'];
    if (mob) { ctx.fillText('LUE', W / 2 + sway, H - 40 - fs * 0.8); ctx.fillText('URS', W / 2 - sway, H - 40); }
    else ctx.fillText('LUEURS', W / 2 + sway, H - 20);
  }
  function frame(t) { draw(t || performance.now()); }
  read(); size(); draw(0);
  window.LensButton.onFrame = function (t) { if (seen) frame(t); };
  if (document.fonts) document.fonts.load('800 100px Geist').then(function () { draw(performance.now()); window.LensButton.redraw(); });
  window.LensButton.animate(section.dataset.animate !== 'false');
  new ResizeObserver(function () { size(); draw(performance.now()); window.LensButton.redraw(); }).observe(section);
  new MutationObserver(function () { read(); draw(performance.now()); window.LensButton.redraw(); })
    .observe(document.documentElement, { attributes: true, attributeFilter: ['class', 'style', 'data-accent'] });
  if ('IntersectionObserver' in window) new IntersectionObserver(function (es) { seen = es[0].isIntersecting; window.LensButton.setVisible(seen); }).observe(section);
})();
</script>

<style>
  /* ——— Bouton lentille ——— */
  .lens {
    --lens-h: 60px;
    --lens-veil: 42%;
    position: relative;
    isolation: isolate;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    height: var(--lens-h);
    padding: 0 28px;
    border: 0;
    border-radius: var(--radius-pill);
    background: transparent;
    color: var(--text-strong);
    font: 600 17px/1 var(--font-sans);
    letter-spacing: -0.01em;
    white-space: nowrap;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    transition: scale 420ms cubic-bezier(.34, 1.56, .64, 1);
  }
  .lens:active { scale: .97; transition-duration: 120ms; }
  .lens:focus-visible { outline: var(--focus-width) solid var(--focus-ring); outline-offset: 4px; }
  .lens__glass { position: absolute; inset: 0; z-index: -1; width: 100%; height: 100%; border-radius: inherit; pointer-events: none; }
  .lens__label { position: relative; }
  .lens__ico { position: relative; width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: translate 300ms cubic-bezier(.34, 1.56, .64, 1); }
  .lens:hover .lens__ico { translate: 3px 0; }
  .lens--quiet { --lens-h: 52px; padding: 0 22px; font-size: 16px; font-weight: 550; }
  /* Repli sans WebGL : verre dépoli CSS */
  .lens--fallback {
    background: color-mix(in srgb, var(--surface) calc(var(--lens-veil) + 18%), transparent);
    -webkit-backdrop-filter: blur(10px) saturate(1.5);
    backdrop-filter: blur(10px) saturate(1.5);
    box-shadow: inset 0 1px 0 color-mix(in srgb, var(--surface) 60%, transparent), inset 0 0 0 1px var(--border);
  }
  @media (prefers-reduced-motion: reduce) { .lens, .lens__ico { transition: none; } .lens:active { scale: 1; } }

  /* ——— Mise en scène : festival Lueurs ——— */
  .lu { position: relative; display: grid; grid-template-rows: auto 1fr auto; gap: 32px; width: 100%; min-height: 640px; padding: 24px 40px 56px; overflow: hidden; font-family: var(--font-sans); color: var(--text); }
  .lu__bg { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; }
  .lu > :not(canvas) { position: relative; z-index: 1; }
  .lu__bar { display: flex; align-items: center; justify-content: space-between; gap: 24px; }
  .lu__brand { display: inline-flex; align-items: center; gap: 10px; color: var(--text-strong); }
  .lu__logo { width: 30px; height: 30px; }
  .lu__logo-ring { fill: none; stroke: var(--text-strong); stroke-width: 12; }
  .lu__logo-dot { fill: var(--accent); }
  .lu__word { font: 600 20px/1 var(--font-sans); letter-spacing: -0.03em; }
  .lu__nav { display: flex; gap: 4px; padding: 4px; border-radius: var(--radius-pill); background: color-mix(in srgb, var(--bg) 80%, transparent); }
  .lu__nav a { display: inline-flex; align-items: center; height: 36px; padding: 0 14px; border-radius: var(--radius-pill); color: var(--text-strong); font-size: 14px; font-weight: 500; text-decoration: none; }
  .lu__nav a:hover { background: var(--state-hover); }
  .lu__nav a:focus-visible { outline: var(--focus-width) solid var(--focus-ring); outline-offset: 0; }
  .lu__copy { align-self: start; display: grid; gap: 16px; max-width: 560px; padding-top: 32px; }
  .lu__kicker { margin: 0; font: 500 13px/18px var(--font-mono); letter-spacing: var(--track-caps); text-transform: uppercase; color: var(--text-strong); }
  .lu__h { margin: 0; font: 650 clamp(2rem, 1.2rem + 3vw, 3.5rem) / 1.04 var(--font-sans); letter-spacing: -0.035em; color: var(--text-strong); text-wrap: balance; }
  .lu__date { margin: 0; font-size: 16px; line-height: 24px; color: var(--text-strong); }
  .lu__date, .lu__kicker { justify-self: start; padding: 2px 8px; margin-left: -8px; border-radius: var(--radius-ctl); background: color-mix(in srgb, var(--bg) 82%, transparent); }
  .lu__ctas { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 12px; }

  @media (max-width: 640px) {
    .lu { min-height: 720px; padding: 16px 16px 72px; gap: 24px; }
    .lu__nav { display: none; }
    .lu__copy { padding-top: 16px; }
    .lu__date { font-size: 15px; line-height: 22px; }
    .lu__ctas { flex-direction: column; align-items: stretch; }
    .lens { width: 100%; }
  }
</style>

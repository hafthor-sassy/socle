<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carte chemise — démo</title>
<link rel="stylesheet" href="../../../css/tokens.css">
<link rel="stylesheet" href="../../../demo-kit/demo.css">
<script src="../../../demo-kit/demo.js"></script>
<style id="component-css"></style>
<style>
  .stage { min-height: 100vh; display: grid; place-items: center; padding: 56px 32px; }
  @media (max-width: 600px) { .stage { padding: 32px 16px 56px; } }
  .is-thumb .stage { padding: 24px 40px 40px; }
  .is-thumb .chem__head { display: none; }
  .is-thumb .fold { padding-top: 100px; }
</style>
</head>
<body>
<main class="stage"><div id="mount" style="display:contents"></div></main>
<script>
  var props = Socle.props({ ouverture: 58, eventail: 5, raideur: 260, amortissement: 19, decalage: 55, mode: 'clic', unique: false });
  var root = null, booted = false;
  function render(p) {
    if (!root) return;
    root.style.setProperty('--chem-angle', p.ouverture);
    root.style.setProperty('--chem-fan', p.eventail);
    root.style.setProperty('--chem-stiffness', p.raideur);
    root.style.setProperty('--chem-damping', p.amortissement);
    root.style.setProperty('--chem-stagger', p.decalage);
    root.dataset.unique = String(!!p.unique);
    var modeChanged = root.dataset.mode !== p.mode;
    root.dataset.mode = p.mode;
    if (booted && modeChanged) location.reload();
  }
  /* Rejouer : la première chemise s'entrouvre, puis s'ouvre ; la deuxième suit. */
  function scene() {
    var c = root && root._chemise; if (!c) return;
    c.closeAll();
    setTimeout(function () { c.peek(0, true); }, 250);
    setTimeout(function () { c.open(0, true); }, 900);
    setTimeout(function () { c.peek(0, false); c.open(1, true); }, 1500);
    setTimeout(function () { c.open(1, false); }, 3000);
  }
  fetch('code/index.html').then(function (r) { return r.text(); }).then(function (t) {
    var css = t.match(/<style>([\s\S]*?)<\/style>/), js = t.match(/<script>([\s\S]*?)<\/script>/), mk = t.match(/<!-- SECTION -->([\s\S]*?)<!-- \/SECTION -->/);
    document.getElementById('component-css').textContent = css ? css[1] : '';
    var mount = document.getElementById('mount');
    mount.innerHTML = mk ? mk[1] : '';
    root = mount.querySelector('[data-chemise]');
    render(props);
    try { new Function(js ? js[1] : '')(); } catch (e) { console.error(e); }
    booted = true;
    if (Socle.thumb && root._chemise) { root._chemise.open(0, true); root._chemise.peek(2, true); if (Socle.reducedMotion()) root._chemise.jump(); }
  });
  Socle.onChange(render);
  Socle.onReplay(scene);
</script>
</body>
</html>

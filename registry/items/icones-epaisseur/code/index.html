<style>
  .ic {
    --ic-stroke: 1.5; --ic-size: 24px; --ic-eff: var(--ic-stroke);

  .ic-stroke__track { position: relative; display: block; height: 36px; }
  .ic-stroke__ticks { position: absolute; left: 9px; right: 9px; top: 50%; display: flex; justify-content: space-between; transform: translateY(-50%); pointer-events: none; }

  .ic-stroke input { position: relative; width: 100%; height: 36px; margin: 0; accent-color: var(--accent); cursor: pointer; }

  .ic-seg { display: inline-flex; padding: 2px; border-radius: var(--radius-pill); background: var(--raised); border: 1px solid var(--border); }

  .ic-switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .ic-switch__ui { position: relative; width: 36px; height: 20px; border-radius: 999px; background: var(--scale-track); transition: background-color var(--motion-base) var(--ease-out); }
  .ic-switch__ui::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--surface); box-shadow: var(--shadow-overlay); transition: transform 300ms var(--ic-spring); }
  .ic-switch input:checked + .ic-switch__ui { background: var(--accent); }

  .ic-search { position: relative; display: flex; align-items: center; }

  .ic-search input::placeholder { color: var(--text-muted); }

  /* Grille */

  .ic__gridwrap { padding: 24px; min-width: 0; }
  .ic__grid { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
  .ic-tile { position: relative; display: grid; justify-items: center; align-content: center; gap: 12px; height: 96px; padding: 12px 8px; border-radius: var(--radius-card); background: var(--surface); color: var(--text-strong); cursor: pointer; outline: none;
    transition: background-color var(--motion-fast) var(--ease-out), transform 240ms var(--ic-spring); -webkit-tap-highlight-color: transparent; }
  .ic-tile::after { content: ""; position: absolute; inset: 0; border-radius: inherit; border: 1px solid var(--border); pointer-events: none; transition: border-color var(--motion-fast) var(--ease-out); }
  .ic-tile:hover { background: var(--raised); }
  .ic-tile:active { transform: scale(.96); }
  .ic-tile[aria-selected="true"] { background: var(--accent-subtle); }
  .ic-tile[aria-selected="true"]::after { border-color: var(--accent); }
  .ic-tile:focus-visible::after { border: var(--focus-width) solid var(--focus-ring); }
  .ic-tile svg { width: var(--ic-size); height: var(--ic-size); transition: width 260ms var(--ic-spring), height 260ms var(--ic-spring), stroke-width 260ms var(--ease-out); }
  .ic-tile span { color: var(--text-muted); font: 500 12px/16px var(--font-sans); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .ic-tile[aria-selected="true"] span { color: var(--text-strong); }
  .ic-tile.is-in { animation: ic-in 420ms var(--ic-spring) both; animation-delay: calc(var(--i) * 14ms); }
  @keyframes ic-in { from { opacity: 0; transform: translateY(6px) scale(.96); } }

  .ic-dock { display: none; }
  .ic__empty { display: grid; justify-items: center; gap: 12px; padding: 64px 16px; text-align: center; color: var(--text-muted); }

  .ic__insp { display: grid; align-content: start; gap: 16px; padding: 24px; border-left: 1px solid var(--border); background: var(--raised); min-width: 0; }
  .ic-prev { position: relative; display: grid; place-items: center; aspect-ratio: 16 / 10; border-radius: var(--radius-card); background: var(--surface); border: 1px solid var(--border); overflow: hidden; }
  .ic-prev__keys { position: absolute; width: 144px; height: 144px; stroke: color-mix(in srgb, var(--accent) 30%, transparent); stroke-width: .06; fill: none; }
  .ic-prev__icon { position: relative; width: 144px; height: 144px; color: var(--text-strong); }

  .ic-tabs button[aria-selected="true"] { background: var(--surface); color: var(--text-strong); border-color: var(--border); }

  .ic-code { margin: 0; max-height: 168px; overflow: auto; padding: 12px; border-radius: var(--radius-ctl); background: var(--surface); border: 1px solid var(--border); color: var(--text); font: 400 12px/18px var(--font-mono); white-space: pre-wrap; word-break: break-all; }
  .ic-code mark { background: var(--accent-subtle); color: var(--text-strong); border-radius: 3px; padding: 0 2px; box-shadow: 0 0 0 1px var(--accent-subtle-border); }
  .ic-code .t { color: var(--text-muted); }

  .ic-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border: 1px solid var(--border-control); border-radius: var(--radius-ctl); background: var(--surface); color: var(--text-strong); font: 500 15px/1 var(--font-sans); cursor: pointer; }
  .ic-btn--solid { background: var(--accent); border-color: transparent; color: var(--accent-fg); }
  .ic-copy { position: relative; overflow: hidden; transition: transform 200ms var(--ic-spring); }

    .ic-search { grid-column: 1 / -1; order: 6; }

    .ic__body { grid-template-columns: 1fr; }
    .ic__gridwrap { padding: 16px; }
    .ic__grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .ic-tile { height: 88px; gap: 8px; padding: 8px 4px; }
    .ic-tile span { font-size: 14px; line-height: 20px; }

  @container (max-width: 360px) { .ic-switch span:last-child { font-size: 13px; } }
  @media (prefers-reduced-motion: reduce) {

  }
</style>

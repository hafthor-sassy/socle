<script>
/* RampeOklch — vanilla, sans dépendance. RampeOklch.mount(el, { teinte, clarte, chroma, suivre, mode, selection }) */
(function () {
  var ROLES = ['Fond de l’app', 'Fond subtil', 'Élément', 'Élément survolé', 'Élément actif', 'Bordure subtile', 'Bordure', 'Bordure forte', 'Plein', 'Plein survolé', 'Texte doux', 'Texte fort'];
  var CMAX = 0.37;

  /* ——— OKLCH ⇄ sRGB ——— */
  function lab2lin(L, a, b) {
    var l = L + 0.3963377774 * a + 0.2158037573 * b, m = L - 0.1055613458 * a - 0.0638541728 * b, s = L - 0.0894841775 * a - 1.291485548 * b;
    l = l * l * l; m = m * m * m; s = s * s * s;
    return [4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s, -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s, -0.0041960863 * l - 0.7034186147 * m + 1.707614701 * s];
  }
  function lch2lin(L, C, H) { var h = H * Math.PI / 180; return lab2lin(L, C * Math.cos(h), C * Math.sin(h)); }
  function inGamut(c) { return c[0] >= -1e-4 && c[0] <= 1.0001 && c[1] >= -1e-4 && c[1] <= 1.0001 && c[2] >= -1e-4 && c[2] <= 1.0001; }
  function gam(v) { v = Math.min(1, Math.max(0, v)); return v <= 0.0031308 ? 12.92 * v : 1.055 * Math.pow(v, 1 / 2.4) - 0.055; }
  function ungam(v) { return v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }
  function maxC(L, H) { var lo = 0, hi = CMAX; for (var i = 0; i < 16; i++) { var mid = (lo + hi) / 2; if (inGamut(lch2lin(L, mid, H))) lo = mid; else hi = mid; } return lo; }
  function toHex(lin) { return '#' + lin.map(function (v) { return ('0' + Math.round(gam(v) * 255).toString(16)).slice(-2); }).join('').toUpperCase(); }
  function srgb2lch(rgb) {
    var r = ungam(rgb[0]), g = ungam(rgb[1]), b = ungam(rgb[2]);
    var l = Math.cbrt(0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b), m = Math.cbrt(0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b), s = Math.cbrt(0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b);
    var L = 0.2104542553 * l + 0.793617785 * m - 0.0040720468 * s, A = 1.9779984951 * l - 2.428592205 * m + 0.4505937099 * s, B = 0.0259040371 * l + 0.7827717662 * m - 0.808675766 * s;
    return [L, Math.hypot(A, B), (Math.atan2(B, A) * 180 / Math.PI + 360) % 360];
  }
  var cx;
  function cssRgb(c) {
    if (!cx) { var cv = document.createElement('canvas'); cv.width = cv.height = 1; cx = cv.getContext('2d', { willReadFrequently: true }); }
    cx.clearRect(0, 0, 1, 1); cx.fillStyle = '#000'; cx.fillStyle = c; cx.fillRect(0, 0, 1, 1);
    var d = cx.getImageData(0, 0, 1, 1).data; return [d[0] / 255, d[1] / 255, d[2] / 255];
  }

  /* ——— Contraste ——— */
  function Y(lin) { return 0.2126 * lin[0] + 0.7152 * lin[1] + 0.0722 * lin[2]; }
  function wcag(a, b) { var x = Y(clampLin(a)), y = Y(clampLin(b)); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); }
  function clampLin(c) { return c.map(function (v) { return Math.min(1, Math.max(0, v)); }); }
  /* APCA-W3 0.0.98G : Lc signé (texte sur fond). */
  function apca(txt, bg) {
    var f = function (c) { c = clampLin(c).map(gam); return 0.2126729 * Math.pow(c[0], 2.4) + 0.7151522 * Math.pow(c[1], 2.4) + 0.072175 * Math.pow(c[2], 2.4); };
    var yt = f(txt), yb = f(bg), bt = 0.022;
    if (yt < bt) yt += Math.pow(bt - yt, 1.414); if (yb < bt) yb += Math.pow(bt - yb, 1.414);
    if (Math.abs(yb - yt) < 0.0005) return 0;
    var S = yb > yt ? (Math.pow(yb, 0.56) - Math.pow(yt, 0.57)) * 1.14 : (Math.pow(yb, 0.65) - Math.pow(yt, 0.62)) * 1.14;
    return Math.abs(S) < 0.1 ? 0 : (S > 0 ? S - 0.027 : S + 0.027) * 100;
  }
  var WHITE = [1, 1, 1], BLACK = [0, 0, 0];
  function fr(n, d) { return n.toFixed(d == null ? 2 : d).replace('.', ','); }

  /* ——— Génération : 12 paliers réguliers à l'œil ——— */
  function ramp(H, L9, C9, mode) {
    var c = function (x) { return Math.min(0.99, Math.max(0.05, x)); };
    var Ls, Cf;
    if (mode === 'sombre') {
      var Ld = Math.min(0.76, Math.max(0.56, L9));
      Ls = [0.165, 0.195, 0.24, 0.275, 0.31, 0.35, 0.405, 0.48, Ld, Ld + 0.04, 0.8, 0.945];
      Cf = [0.1, 0.14, 0.28, 0.38, 0.46, 0.52, 0.6, 0.72, 1, 1, 0.72, 0.24];
    } else {
      var l11 = Math.min(L9 - 0.08, 0.53), l12 = Math.min(0.3, l11 - 0.14);
      Ls = [0.988, 0.972, 0.948, 0.922, 0.893, 0.852, 0.79, 0.66, L9, L9 - 0.045, l11, l12];
      Cf = [0.012, 0.03, 0.07, 0.11, 0.15, 0.21, 0.3, 0.5, 1, 1.02, 0.9, 0.42];
    }
    return Ls.map(function (L, i) {
      L = c(L);
      var C = Math.min(C9 * Cf[i], maxC(L, H));
      var lin = lch2lin(L, C, H);
      return { n: i + 1, L: L, C: C, H: H, lin: lin, hex: toHex(lin), role: ROLES[i] };
    });
  }

  function mount(root, opts) {
    opts = opts || {};
    var $ = function (s) { return root.querySelector(s); };
    var plane = $('[data-rk-plane]'), cv = $('[data-rk-canvas]'), handle = $('[data-rk-handle]'), pathSvg = $('[data-rk-path]');
    var hue = $('[data-rk-hue]'), hueCv = $('[data-rk-hue-canvas]'), stepsEl = $('[data-rk-steps]');
    var st = { H: +root.dataset.teinte || 265, L: 0.52, C: 0.13, suivre: root.dataset.suivre !== 'false', mode: root.dataset.mode || 'clair', sel: 9, fmt: 'oklch' };
    var cur = { x: 0, y: 0, vx: 0, vy: 0, raf: 0 }, steps = [], lifts = [];

    /* Lecture de l'accent de la palette en cours (variables tokens.css). */
    function fromAccent() {
      var v = getComputedStyle(root).getPropertyValue('--accent').trim();
      if (!v) return;
      var lch = srgb2lch(cssRgb(v));
      if (lch[1] < 0.02) { st.C = 0.02; st.L = Math.max(0.4, Math.min(0.62, lch[0])); return; }
      st.H = Math.round(lch[2]); st.L = Math.max(0.4, Math.min(0.75, lch[0])); st.C = Math.min(lch[1], maxC(st.L, st.H));
    }

    /* Plan clarté × chroma de la teinte courante, rendu en basse définition puis lissé. */
    var drawQueued = false;
    function drawPlane() {
      if (drawQueued) return; drawQueued = true;
      requestAnimationFrame(function () {
        drawQueued = false;
        var W = 150, Hh = 100; cv.width = W; cv.height = Hh;
        var g = cv.getContext('2d'), img = g.createImageData(W, Hh), d = img.data;
        for (var y = 0; y < Hh; y++) {
          var L = 1 - y / (Hh - 1);
          for (var x = 0; x < W; x++) {
            var C = x / (W - 1) * CMAX, lin = lch2lin(L, C, st.H), k = (y * W + x) * 4;
            if (inGamut(lin)) { d[k] = gam(lin[0]) * 255; d[k + 1] = gam(lin[1]) * 255; d[k + 2] = gam(lin[2]) * 255; d[k + 3] = 255; }
          }
        }
        g.putImageData(img, 0, 0);
        drawPath();
      });
      /* Bande de teintes (chroma maximal commun à L = 0,7) */
      var hw = 360; hueCv.width = hw; hueCv.height = 1;
      var hg = hueCv.getContext('2d'), hi = hg.createImageData(hw, 1);
      for (var i = 0; i < hw; i++) { var lin2 = lch2lin(0.7, Math.min(0.13, maxC(0.7, i)), i); hi.data[i * 4] = gam(lin2[0]) * 255; hi.data[i * 4 + 1] = gam(lin2[1]) * 255; hi.data[i * 4 + 2] = gam(lin2[2]) * 255; hi.data[i * 4 + 3] = 255; }
      hg.putImageData(hi, 0, 0);
    }
    function pos(L, C) { var r = plane.getBoundingClientRect(); return [C / CMAX * r.width, (1 - L) * r.height]; }
    function drawPath() {
      var r = plane.getBoundingClientRect(); if (!r.width) return;
      pathSvg.setAttribute('viewBox', '0 0 ' + r.width + ' ' + r.height);
      /* frontière de la gamme sRGB */
      var edge = '', n = 48;
      for (var i = 0; i <= n; i++) { var L = 1 - i / n, p = pos(L, maxC(L, st.H)); edge += (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); }
      var pts = steps.map(function (s) { var p = pos(s.L, s.C); return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' ');
      var dots = steps.map(function (s) { var p = pos(s.L, s.C); return '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="' + (s.n === st.sel ? 5 : 3.5) + '"' + (s.n === st.sel ? ' class="is-sel"' : '') + '/>'; }).join('');
      pathSvg.innerHTML = '<path d="' + edge + '"/><polyline points="' + pts + '"/>' + dots;
    }

    /* Poignée : ressort vers sa cible (raideur 260, amortissement 22). */
    function moveHandle(instant) {
      var p = pos(st.L, st.C);
      if (instant || matchMedia('(prefers-reduced-motion: reduce)').matches) { cur.x = p[0]; cur.y = p[1]; cur.vx = cur.vy = 0; handle.style.transform = 'translate(' + cur.x + 'px,' + cur.y + 'px)'; return; }
      if (cur.raf) return;
      var last = performance.now();
      (function tick(t) {
        var dt = Math.min(0.032, (t - last) / 1000); last = t;
        var q = pos(st.L, st.C), k = 260, c = 22;
        cur.vx += ((q[0] - cur.x) * k - cur.vx * c) * dt; cur.vy += ((q[1] - cur.y) * k - cur.vy * c) * dt;
        cur.x += cur.vx * dt; cur.y += cur.vy * dt;
        handle.style.transform = 'translate(' + cur.x.toFixed(2) + 'px,' + cur.y.toFixed(2) + 'px)';
        if (Math.abs(q[0] - cur.x) + Math.abs(q[1] - cur.y) < 0.3 && Math.abs(cur.vx) + Math.abs(cur.vy) < 3) { cur.raf = 0; handle.style.transform = 'translate(' + q[0] + 'px,' + q[1] + 'px)'; return; }
        cur.raf = requestAnimationFrame(tick);
      })(last);
    }
    var dragging = false;
    function fromPointer(e) {
      var r = plane.getBoundingClientRect();
      var L = 1 - Math.max(0, Math.min(1, (e.clientY - r.top) / r.height));
      var C = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * CMAX;
      st.L = Math.max(0.3, Math.min(0.85, L)); st.C = Math.min(C, maxC(st.L, st.H));
      setFollow(false); compute(); moveHandle(dragging === 'jump' ? false : true);
    }
    plane.addEventListener('pointerdown', function (e) { plane.setPointerCapture(e.pointerId); dragging = 'jump'; handle.classList.add('is-drag'); fromPointer(e); dragging = true; });
    plane.addEventListener('pointermove', function (e) { if (dragging) fromPointer(e); });
    ['pointerup', 'pointercancel'].forEach(function (t) { plane.addEventListener(t, function () { dragging = false; handle.classList.remove('is-drag'); }); });
    handle.addEventListener('keydown', function (e) {
      var s = e.shiftKey ? 5 : 1, k = e.key;
      if (k === 'ArrowUp') st.L = Math.min(0.85, st.L + 0.01 * s); else if (k === 'ArrowDown') st.L = Math.max(0.3, st.L - 0.01 * s);
      else if (k === 'ArrowRight') st.C = st.C + 0.005 * s; else if (k === 'ArrowLeft') st.C = Math.max(0, st.C - 0.005 * s); else return;
      e.preventDefault(); st.C = Math.min(st.C, maxC(st.L, st.H)); setFollow(false); compute(); moveHandle();
    });
    hue.addEventListener('input', function () { st.H = +hue.value; st.C = Math.min(st.C, maxC(st.L, st.H)); setFollow(false); compute(true); drawPlane(); moveHandle(); });

    var follow = $('[data-rk-follow]');
    function setFollow(v) { st.suivre = v; follow.setAttribute('aria-pressed', v); }
    follow.addEventListener('click', function () { setFollow(!st.suivre); if (st.suivre) { fromAccent(); hue.value = st.H; compute(true); drawPlane(); moveHandle(); } });

    var modeEl = $('[data-rk-mode]');
    modeEl.addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) { st.mode = b.dataset.m; compute(true); } });
    modeEl.addEventListener('keydown', function (e) { if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { st.mode = st.mode === 'clair' ? 'sombre' : 'clair'; compute(true); modeEl.querySelector('[aria-checked="true"]').focus(); } });

    stepsEl.addEventListener('click', function (e) { var b = e.target.closest('.rk__step'); if (b) { st.sel = +b.dataset.n; paintSel(); } });
    stepsEl.addEventListener('keydown', function (e) {
      var d = { ArrowRight: 1, ArrowLeft: -1, ArrowDown: 1, ArrowUp: -1 }[e.key]; if (!d) return;
      e.preventDefault(); st.sel = Math.max(1, Math.min(12, st.sel + d)); paintSel(); stepsEl.querySelector('[data-n="' + st.sel + '"]').focus();
    });

    var tabs = $('[data-rk-tabs]');
    tabs.addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) { st.fmt = b.dataset.f; paintExport(); } });
    var copy = $('[data-rk-copy]');
    copy.addEventListener('click', function () {
      var lbl = $('[data-rk-copy-lbl]');
      (navigator.clipboard ? navigator.clipboard.writeText($('[data-rk-code]').textContent) : Promise.reject()).then(function () {
        copy.classList.add('is-done'); lbl.textContent = 'Copié'; setTimeout(function () { copy.classList.remove('is-done'); lbl.textContent = 'Copier'; }, 1500);
      }, function () { lbl.textContent = 'Sélectionnez le code'; });
    });

    /* Rendu des paliers. bump = petite vague de ressort sur les cases quand la teinte ou le mode changent. */
    function compute(bump) {
      steps = ramp(st.H, st.L, st.C, st.mode);
      var html = '';
      steps.forEach(function (s, i) {
        var w = wcag(WHITE, s.lin), b = wcag(BLACK, s.lin), fg = w >= b ? '#FFFFFF' : '#000000';
        s.fg = fg; s.fgRatio = Math.max(w, b);
        root.style.setProperty('--r' + s.n, s.hex);
      });
      /* Libellé du plein : blanc, puis le palier de texte, sinon la couleur la plus contrastée (noir compris). */
      var nine = steps[8], tx = st.mode === 'sombre' ? steps[0] : steps[11];
      var cands = [[WHITE, '#FFFFFF'], [tx.lin, tx.hex]], best = cands.filter(function (c) { return wcag(c[0], nine.lin) >= 4.5; })[0];
      if (!best) best = cands.concat([[BLACK, '#000000']]).sort(function (x, y) { return wcag(y[0], nine.lin) - wcag(x[0], nine.lin); })[0];
      var fg9 = best[1];
      root.style.setProperty('--r9-fg', fg9);
      if (!stepsEl.children.length) {
        stepsEl.innerHTML = steps.map(function (s) { return '<li><button type="button" class="rk__step" data-n="' + s.n + '" aria-pressed="false"><b>' + s.n + '</b><small></small></button></li>'; }).join('');
      }
      steps.forEach(function (s, i) {
        var b = stepsEl.children[i].firstChild;
        b.style.setProperty('--sw', s.hex); b.style.setProperty('--sw-fg', s.fg); b.style.setProperty('--edge', s.L > 0.9 || s.L < 0.2 ? 1 : 0);
        b.querySelector('small').textContent = s.hex;
        b.setAttribute('aria-label', 'Palier ' + s.n + ', ' + s.role + ', ' + s.hex);
      });
      if (bump) wave();
      $('[data-rk-chip]').style.background = nine.hex;
      $('[data-rk-base-hex]').textContent = nine.hex;
      $('[data-rk-base-oklch]').textContent = 'oklch(' + fr(nine.L * 100, 1) + ' % ' + fr(nine.C, 3) + ' ' + Math.round(nine.H) + ')';
      handle.style.background = nine.hex;
      handle.setAttribute('aria-valuenow', Math.round(st.L * 100));
      handle.setAttribute('aria-valuetext', 'Clarté ' + Math.round(st.L * 100) + ' %, chroma ' + fr(st.C, 3) + ', teinte ' + Math.round(st.H) + '°');
      hue.value = Math.round(st.H);
      $('[data-rk-hue-out]').textContent = Math.round(st.H) + '°';
      var hl = lch2lin(0.7, Math.min(0.13, maxC(0.7, st.H)), st.H); hue.style.setProperty('--rk-hue-c', toHex(hl));
      modeEl.querySelectorAll('button').forEach(function (b) { var on = b.dataset.m === st.mode; b.setAttribute('aria-checked', on); b.tabIndex = on ? 0 : -1; });
      paintChecks(fg9); paintSel(); paintExport(); drawPath();
    }

    function wave() {
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      var btns = Array.prototype.map.call(stepsEl.children, function (li) { return li.firstChild; });
      var t0 = performance.now();
      cancelAnimationFrame(wave.raf);
      (function f(t) {
        var done = true;
        btns.forEach(function (b, i) {
          var tt = (t - t0) / 1000 - i * 0.025; if (tt < 0) { done = false; return; }
          var y = -6 * Math.exp(-7 * tt) * Math.sin(16 * tt); /* oscillateur amorti */
          if (tt < 0.9) done = false;
          b.style.setProperty('--lift', y.toFixed(2) + 'px');
        });
        if (!done) wave.raf = requestAnimationFrame(f); else btns.forEach(function (b) { b.style.setProperty('--lift', '0px'); });
      })(t0);
    }

    function paintSel() {
      Array.prototype.forEach.call(stepsEl.children, function (li, i) { var b = li.firstChild, on = i + 1 === st.sel; b.setAttribute('aria-pressed', on); b.tabIndex = on ? 0 : -1; });
      var s = steps[st.sel - 1]; if (!s) return;
      var w = wcag(WHITE, s.lin), b = wcag(BLACK, s.lin), bg = steps[st.mode === 'sombre' ? 0 : 1];
      var onBg = wcag(s.lin, bg.lin), lc = apca(s.lin, bg.lin);
      $('[data-rk-detail]').innerHTML =
        '<div class="rk__dhead"><span class="rk__dsw" style="--d:' + s.hex + ';--d-fg:' + s.fg + '">' + s.n + '</span><div><b>' + s.role + '</b><span>Palier ' + s.n + ' sur 12</span></div></div>' +
        '<dl class="rk__dl"><dt>Hex</dt><dd>' + s.hex + '</dd><dt>OKLCH</dt><dd>' + fr(s.L * 100, 1) + ' % ' + fr(s.C, 3) + ' ' + Math.round(s.H) + '</dd>' +
        '<dt>Texte blanc</dt><dd>' + fr(w) + ':1 ' + lvl(w) + '</dd><dt>Texte noir</dt><dd>' + fr(b) + ':1 ' + lvl(b) + '</dd>' +
        '<dt>Sur le fond (palier ' + bg.n + ')</dt><dd>' + fr(onBg) + ':1 · Lc ' + fr(Math.abs(lc), 0) + '</dd></dl>';
      drawPath();
    }
    function lvl(k) { return k >= 7 ? 'AAA' : k >= 4.5 ? 'AA' : k >= 3 ? 'AA large' : '—'; }

    function paintChecks(fg9) {
      var s = steps, dark = st.mode === 'sombre', bg = s[1];
      var fgLin = cssRgb(fg9).map(ungam);
      var rows = [
        ['Texte fort sur fond', s[11], bg, 7, 'AAA', 'wcag'],
        ['Texte doux sur fond', s[10], bg, 4.5, 'AA', 'wcag'],
        ['Libellé sur plein', { lin: fgLin, hex: fg9 }, s[8], 4.5, 'AA', 'wcag'],
        ['Plein sur fond (composant)', s[8], s[0], 3, '3:1', 'wcag'],
        ['Bordure forte sur fond', s[7], s[0], 3, '3:1', 'wcag'],
        ['Texte fort · APCA', s[11], bg, 90, 'Lc 90', 'apca'],
        ['Texte doux · APCA', s[10], bg, 60, 'Lc 60', 'apca']
      ];
      var pass = 0;
      $('[data-rk-checks]').innerHTML = rows.map(function (r) {
        var v = r[5] === 'apca' ? Math.abs(apca(r[1].lin, r[2].lin)) : wcag(r[1].lin, r[2].lin);
        var ok = v >= r[3]; if (ok) pass++;
        var tag = !ok ? 'Échec' : r[5] === 'apca' ? r[4] : (v >= 7 ? 'AAA' : r[4]);
        return '<li><span class="rk__pair" style="background:' + r[2].hex + ';color:' + r[1].hex + '" aria-hidden="true">Aa</span><span>' + r[0] + '</span><span class="rk__val">' + (r[5] === 'apca' ? 'Lc ' + fr(v, 0) : fr(v) + ':1') + '</span><span class="rk__lvl' + (!ok ? ' is-fail' : tag === 'AAA' ? '' : ' is-aa') + '">' + tag + '</span></li>';
      }).join('');
      $('[data-rk-pass]').textContent = pass; $('[data-rk-total]').textContent = rows.length;
    }

    function paintExport() {
      tabs.querySelectorAll('button').forEach(function (b) { b.setAttribute('aria-selected', b.dataset.f === st.fmt); });
      var name = 'teinte', sel = st.mode === 'sombre' ? '.dark' : ':root', adj = st.mode === 'sombre' ? 'sombre' : 'claire', out;
      if (st.fmt === 'tw') out = "// tailwind.config.js — rampe " + adj + "\ncolors: {\n  " + name + ": {\n" + steps.map(function (s) { return "    " + s.n + ": '" + s.hex + "',"; }).join('\n') + "\n  },\n}";
      else out = '/* Rampe ' + adj + ' · teinte ' + Math.round(st.H) + '° */\n' + sel + ' {\n' + steps.map(function (s) {
        return '  --' + name + '-' + s.n + ': ' + (st.fmt === 'hex' ? s.hex : 'oklch(' + (s.L * 100).toFixed(1) + '% ' + s.C.toFixed(3) + ' ' + s.H.toFixed(1) + ')') + ';';
      }).join('\n') + '\n}';
      $('[data-rk-code]').textContent = out;
    }

    function update(o) {
      o = o || {};
      if (o.mode) st.mode = o.mode;
      if (o.selection) st.sel = +o.selection;
      if (o.suivre != null) setFollow(!!o.suivre);
      if (st.suivre) fromAccent();
      else {
        if (o.teinte != null) st.H = +o.teinte;
        if (o.clarte != null) st.L = +o.clarte / 100;
        if (o.chroma != null) st.C = Math.min(+o.chroma, maxC(st.L, st.H));
      }
      compute(); drawPlane(); moveHandle(true);
    }
    setFollow(st.suivre);
    update(opts);
    new ResizeObserver(function () { drawPath(); moveHandle(true); }).observe(plane);
    /* Palette ou thème changés : si « partir de l'accent » est actif, la rampe suit. */
    new MutationObserver(function () { if (st.suivre) { fromAccent(); compute(true); drawPlane(); moveHandle(); } }).observe(document.documentElement, { attributes: true, attributeFilter: ['class', 'data-accent', 'style'] });
    return { update: update, set: function (o) { Object.assign(st, o); compute(true); drawPlane(); moveHandle(); }, state: st };
  }
  window.RampeOklch = { mount: mount };
  document.querySelectorAll('[data-rk]').forEach(function (el) { if (!el._rk) el._rk = mount(el); });
})();
</script>

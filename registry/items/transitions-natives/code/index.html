<!-- Transitions de page natives — HTML + CSS + JS, sans bibliothèque. Nécessite tokens.css.
     View Transitions API (document.startViewTransition) : la photo et le nom du produit passent
     d'une page à l'autre, le reste glisse ou se fond. Sans l'API, la page change instantanément (repli invisible).
     Balisage : un conteneur [data-vt] ; des pages [data-vt-page] ; des liens [data-vt-to="id"] ; [data-vt-back].
     Réglages : data-duration (ms), data-ease (emphase | ressort | douce), data-style (glisse | fondu | profondeur), data-shared (true | false).
     API : el.vt.go('id' | 'list', declencheur?) ; événement « vt:change » (detail.page). -->
<link rel="stylesheet" href="tokens.css">

<style>
/* ---------- Mise en page ---------- */
.ou { container: ou / inline-size; --ou-dark: var(--text-strong); --ou-gap: 24px; max-width: 1120px; margin: 0 auto; font-family: var(--font-sans); color: var(--text); }
.dark .ou { --ou-dark: var(--bg); }
.ou *, .ou *::before, .ou *::after { box-sizing: border-box; }
.ou__bar { display: flex; align-items: center; gap: 24px; height: 64px; padding: 0 4px; border-bottom: 1px solid var(--border); }
.ou__brand { display: inline-flex; align-items: center; gap: 10px; min-height: 44px; color: var(--text-strong); text-decoration: none; font-weight: 600; font-size: 17px; letter-spacing: -0.02em; border-radius: 8px; }
.ou__brand svg { width: 28px; height: 28px; flex: none; }
.ou__nav { display: flex; gap: 4px; margin-right: auto; }
.ou__nav a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 12px; border-radius: 8px; color: var(--text-muted); text-decoration: none; font-size: 14px; }
.ou__nav a:hover { color: var(--text-strong); background: var(--state-hover); }
.ou__nav a[aria-current] { color: var(--text-strong); }
.ou__cart { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface); color: var(--text-strong); font: 500 14px/1 var(--font-sans); cursor: pointer; }
.ou__cart:hover { background: var(--raised); }
.ou__cart-n { display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 999px; background: var(--accent); color: var(--accent-fg); font: 600 12px/1 var(--font-mono); font-variant-numeric: tabular-nums; }
.ou__cart-n.is-bump { animation: ou-bump 520ms linear(0, 0.029, 0.09, 0.183, 0.291, 0.403, 0.502, 0.606, 0.701, 0.775, 0.846, 0.905, 0.947, 0.984, 1.011, 1.028, 1.041, 1.048, 1.051, 1.05, 1.047, 1.043, 1.038, 1.033, 1.027, 1.021, 1.017, 1.013, 1.009, 1.006, 1.003, 1); }
@keyframes ou-bump { 0% { transform: scale(.6); } 100% { transform: scale(1); } }

.ou__view { view-transition-name: ou-view; padding: 40px 4px 48px; }
.ou__page[hidden] { display: none; }

/* ---------- Liste ---------- */
.ou__head { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 32px; }
.ou__eyebrow { margin: 0 0 8px; color: var(--text-muted); font: 500 13px/1.4 var(--font-mono); letter-spacing: 0.02em; text-transform: uppercase; }
.ou__h1 { margin: 0; color: var(--text-strong); font-size: clamp(32px, 4.2vw, 52px); line-height: 1.04; letter-spacing: -0.035em; font-weight: 600; text-wrap: balance; }
.ou [tabindex="-1"]:focus { outline: none; }
.ou__sub { margin: 0; max-width: 34ch; color: var(--text-muted); font-size: 15px; line-height: 1.5; }
.ou__grid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--ou-gap); }
.ou__card { display: block; color: inherit; text-decoration: none; border-radius: 16px; }
.ou__card:focus-visible { outline: var(--focus-width) solid var(--focus-ring); outline-offset: 4px; }
.ou__ph { position: relative; margin: 0; aspect-ratio: 4 / 5; border-radius: 16px; overflow: hidden; background: var(--ou-bg); }
.ou__ph svg { position: absolute; inset: 0; width: 100%; height: 100%; transition: transform 600ms cubic-bezier(.2, 0, 0, 1); }
.ou__card:hover .ou__ph svg { transform: scale(1.04) translateY(-1.5%); }
.ou__tag { position: absolute; left: 12px; top: 12px; z-index: 1; padding: 4px 10px; border-radius: 999px; background: var(--surface); color: var(--text-strong); font: 500 12px/18px var(--font-sans); }
.ou__meta { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 14px 2px 0; }
.ou__name { margin: 0; width: fit-content; color: var(--text-strong); font-size: 15px; font-weight: 500; letter-spacing: -0.01em; }
.ou__price { color: var(--text-strong); font: 500 15px/1.4 var(--font-sans); font-variant-numeric: tabular-nums; }
.ou__color { grid-column: 1 / -1; color: var(--text-muted); font-size: 14px; }

/* ---------- Fiche ---------- */
.ou__detail { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 48px; align-items: start; }
.ou__back { grid-column: 1 / -1; justify-self: start; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; margin: -16px 0 -24px -12px; padding: 0 12px; border: 0; border-radius: 8px; background: none; color: var(--text-muted); font: 500 14px/1 var(--font-sans); cursor: pointer; }
.ou__back:hover { color: var(--text-strong); background: var(--state-hover); }
.ou__detail .ou__ph { aspect-ratio: 4 / 5; border-radius: 16px; }
.ou__detail .ou__name { font-size: clamp(28px, 3.4vw, 40px); line-height: 1.08; letter-spacing: -0.03em; font-weight: 600; }
.ou__dprice { margin: 12px 0 0; color: var(--text-strong); font: 500 18px/1.4 var(--font-sans); font-variant-numeric: tabular-nums; }
.ou__desc { margin: 20px 0 0; max-width: 46ch; color: var(--text); font-size: 15px; line-height: 1.6; }
.ou__fs { margin: 28px 0 0; padding: 0; border: 0; }
.ou__legend { display: flex; justify-content: space-between; width: 100%; margin-bottom: 10px; padding: 0; color: var(--text-strong); font-size: 14px; font-weight: 500; }
.ou__legend span { color: var(--text-muted); font-weight: 400; }
.ou__sizes { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.ou__size { position: relative; }
.ou__size input { position: absolute; inset: 0; margin: 0; opacity: 0; cursor: pointer; }
.ou__size span { display: grid; place-items: center; height: 48px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text-strong); font: 500 14px/1 var(--font-mono); transition: border-color 160ms, background-color 160ms, color 160ms; }
.ou__size input:hover + span { border-color: var(--border-strong); }
.ou__size input:checked + span { border-color: var(--text-strong); box-shadow: inset 0 0 0 1px var(--text-strong); }
.ou__size input:focus-visible + span { outline: var(--focus-width) solid var(--focus-ring); outline-offset: 2px; }
.ou__size input:disabled + span { color: var(--text-disabled); background: var(--raised); text-decoration: line-through; }
.ou__size input:disabled { cursor: not-allowed; }
.ou__add { display: inline-flex; align-items: center; justify-content: center; gap: 10px; width: 100%; height: 52px; margin-top: 16px; border: 0; border-radius: 999px; background: var(--accent); color: var(--accent-fg); font: 600 15px/1 var(--font-sans); cursor: pointer; transition: background-color 160ms, transform 160ms; }
.ou__add:hover { background: var(--accent-hover); }
.ou__add:active { transform: scale(.985); }
.ou__specs { margin: 28px 0 0; padding: 0; border-top: 1px solid var(--border); }
.ou__specs div { display: grid; grid-template-columns: 120px 1fr; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
.ou__specs dt { color: var(--text-muted); }
.ou__specs dd { margin: 0; color: var(--text); }
.ou__sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@container ou (max-width: 900px) { .ou__meta { grid-template-columns: 1fr; } .ou__name, .ou__price { font-size: 14px; } }

/* ---------- Mobile : vraie mise en page téléphone ---------- */
@media (max-width: 719px) {
  .ou { --ou-gap: 12px; }
  .ou__bar { gap: 8px; height: 56px; }
  .ou__nav { display: none; }
  .ou__brand { margin-right: auto; }
  .ou__view { padding: 24px 0 32px; }
  .ou__head { display: block; margin-bottom: 20px; }
  .ou__sub { margin-top: 12px; }
  .ou__grid { grid-template-columns: repeat(2, minmax(0, 1fr)); row-gap: 20px; }
  .ou__ph { border-radius: 12px; }
  .ou__meta { grid-template-columns: 1fr; padding-top: 10px; }
  .ou__name, .ou__price { font-size: 14px; }
  .ou__color { display: none; }
  .ou__detail { grid-template-columns: 1fr; gap: 20px; }
  .ou__detail .ou__ph { aspect-ratio: 1 / 1; border-radius: 12px; }
  .ou__back { margin: -12px 0 -8px -12px; }
  .ou__sizes { gap: 6px; }
  .ou__specs div { grid-template-columns: 104px 1fr; }
}

/* ---------- Transitions (pseudo-éléments sur <html>) ---------- */
::view-transition-group(*) { animation-duration: var(--ou-vt-dur, 420ms); animation-timing-function: var(--ou-vt-ease, cubic-bezier(.2, 0, 0, 1)); }
::view-transition-old(root), ::view-transition-new(root) { animation: none; }
::view-transition-old(ou-view), ::view-transition-new(ou-view) { animation-duration: var(--ou-vt-dur, 420ms); animation-timing-function: cubic-bezier(.2, 0, 0, 1); animation-fill-mode: both; }
/* La photo garde ses proportions pendant le voyage. */
::view-transition-old(ou-img), ::view-transition-new(ou-img) { height: 100%; width: 100%; object-fit: cover; animation-duration: var(--ou-vt-dur, 420ms); }
::view-transition-old(ou-title), ::view-transition-new(ou-title) { height: 100%; width: auto; object-fit: none; object-position: left top; }
html[data-ou-style="glisse"][data-ou-dir="fwd"]::view-transition-old(ou-view) { animation-name: ou-out-left; }
html[data-ou-style="glisse"][data-ou-dir="fwd"]::view-transition-new(ou-view) { animation-name: ou-in-right; }
html[data-ou-style="glisse"][data-ou-dir="back"]::view-transition-old(ou-view) { animation-name: ou-out-right; }
html[data-ou-style="glisse"][data-ou-dir="back"]::view-transition-new(ou-view) { animation-name: ou-in-left; }
html[data-ou-style="profondeur"][data-ou-dir="fwd"]::view-transition-old(ou-view) { animation-name: ou-sink; }
html[data-ou-style="profondeur"][data-ou-dir="fwd"]::view-transition-new(ou-view) { animation-name: ou-rise; }
html[data-ou-style="profondeur"][data-ou-dir="back"]::view-transition-old(ou-view) { animation-name: ou-fade-out; }
html[data-ou-style="profondeur"][data-ou-dir="back"]::view-transition-new(ou-view) { animation-name: ou-unsink; }
html[data-ou-style="fondu"]::view-transition-old(ou-view) { animation-name: ou-fade-out; }
html[data-ou-style="fondu"]::view-transition-new(ou-view) { animation-name: ou-fade-in; }
@keyframes ou-out-left { to { opacity: 0; transform: translateX(-48px); } }
@keyframes ou-in-right { from { opacity: 0; transform: translateX(48px); } }
@keyframes ou-out-right { to { opacity: 0; transform: translateX(48px); } }
@keyframes ou-in-left { from { opacity: 0; transform: translateX(-48px); } }
@keyframes ou-sink { to { opacity: 0; transform: scale(.94); filter: blur(4px); } }
@keyframes ou-rise { from { opacity: 0; transform: translateY(24px); } }
@keyframes ou-unsink { from { opacity: 0; transform: scale(.94); filter: blur(4px); } }
@keyframes ou-fade-out { to { opacity: 0; } }
@keyframes ou-fade-in { from { opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  ::view-transition-group(*), ::view-transition-old(*), ::view-transition-new(*) { animation: none !important; }
  .ou__ph svg, .ou__cart-n.is-bump { transition: none; animation: none; }
}
</style>

    grid.innerHTML = PRODUCTS.map(function (p) {
      return '<li><a class="ou__card" href="#' + p.id + '" data-vt-to="' + p.id + '">' +
        '<figure class="ou__ph" style="--ou-bg:' + p.bg + '">' + (p.tag ? '<span class="ou__tag">' + p.tag + '</span>' : '') + art(p) + '</figure>' +
        '<div class="ou__meta"><p class="ou__name">' + p.name + '</p><span class="ou__price">' + p.price + '</span><span class="ou__color">' + p.color + '</span></div></a></li>';
    }).join('');

    function fill(p) {
      dimg.style.setProperty('--ou-bg', p.bg);
      dimg.innerHTML = art(p);
      dname.textContent = p.name;
      root.querySelector('[data-vt-dprice]').textContent = p.price + ' · ' + p.color;
      root.querySelector('[data-vt-ddesc]').textContent = p.desc;
      root.querySelector('[data-vt-sizes]').innerHTML = p.sizes.map(function (s, i) {
        var off = p.out.indexOf(s) > -1;
        return '<label class="ou__size"><input type="radio" name="ou-size" value="' + s + '"' + (off ? ' disabled' : '') + (i === 2 ? ' checked' : '') + ' aria-label="Taille ' + s + (off ? ', épuisée' : '') + '"><span aria-hidden="true">' + s + '</span></label>';
      }).join('');
      root.querySelector('[data-vt-specs]').innerHTML = p.specs.map(function (s) { return '<div><dt>' + s[0] + '</dt><dd>' + s[1] + '</dd></div>'; }).join('');
    }
    function cardOf(id) { return grid.querySelector('[data-vt-to="' + id + '"]'); }
    function name(el, n) { if (el) el.style.viewTransitionName = n || ''; }
    function shared(id, on) {
      if (root.dataset.shared === 'false') return;
      var c = cardOf(id); if (!c) return;
      var target = current === 'list' ? [c.querySelector('.ou__ph'), c.querySelector('.ou__name')] : [dimg, dname];
      name(target[0], on ? 'ou-img' : ''); name(target[1], on ? 'ou-title' : '');
    }
    function swap(to) {
      var id = current === 'list' ? null : current;
      if (to === 'list') { pages.detail.hidden = true; pages.list.hidden = false; }
      else { fill(PRODUCTS.filter(function (p) { return p.id === to; })[0]); pages.list.hidden = true; pages.detail.hidden = false; }
      current = to;
      return id;
    }
    function go(to, trigger) {
      if (to === current || busy) return;
      var fwd = to !== 'list', fromId = current;
      if (fwd) lastTrigger = trigger || cardOf(to);
      var dur = Math.max(120, +root.dataset.duration || 420);
      var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
      var after = function () {
        var p = PRODUCTS.filter(function (x) { return x.id === to; })[0];
        live.textContent = fwd ? p.name + ', fiche produit' : 'Toute la collection';
        if (fwd && trigger) dname.focus({ preventScroll: true });
        else if (lastTrigger) lastTrigger.focus({ preventScroll: true });
        if (fwd && root.getBoundingClientRect().top < 0) root.scrollIntoView({ block: 'start' });
        root.dispatchEvent(new CustomEvent('vt:change', { detail: { page: to } }));
      };
      if (!document.startViewTransition || reduce) { swap(to); after(); return; }
      html.style.setProperty('--ou-vt-dur', dur + 'ms');
      html.style.setProperty('--ou-vt-ease', EASE[root.dataset.ease] || EASE.emphase);
      html.dataset.ouStyle = root.dataset.style || 'glisse';
      html.dataset.ouDir = fwd ? 'fwd' : 'back';
      var sid = fwd ? to : fromId;
      shared(sid, true);
      var t = document.startViewTransition(function () { shared(sid, false); swap(to); shared(sid, true); });
      busy = t;
      t.finished.finally(function () {
        shared(sid, false); busy = null;
        delete html.dataset.ouStyle; delete html.dataset.ouDir;
      });
      t.updateCallbackDone.then(after);
    }

    root.addEventListener('click', function (e) {
      var a = e.target.closest('[data-vt-to]');
      if (a && root.contains(a)) { e.preventDefault(); go(a.dataset.vtTo, a); return; }
      var b = e.target.closest('[data-vt-back]');
      if (b && root.contains(b)) { e.preventDefault(); go('list', b); return; }
      if (e.target.closest('[data-vt-add]')) {
        cart++;
        cartN.textContent = cart; cartBtn.setAttribute('aria-label', 'Panier, ' + cart + ' article' + (cart > 1 ? 's' : ''));
        cartN.classList.remove('is-bump'); void cartN.offsetWidth; cartN.classList.add('is-bump');
        live.textContent = dname.textContent + ' ajouté au panier';
      }
    });
    root.addEventListener('keydown', function (e) { if (e.key === 'Escape' && current !== 'list') go('list'); });
    root.vt = { go: go, get page() { return current; }, products: PRODUCTS };
  });
})();
</script>

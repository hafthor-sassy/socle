<!-- Fil d’activité d’agent IA — HTML + CSS + JS intégré, sans dépendance. Nécessite tokens.css. Marque, personnes et données fictives. -->
<link rel="stylesheet" href="tokens.css">

<!-- SECTION -->
<section class="af" data-agent-feed data-scenario="rdv" data-speed="1" data-density="confortable" data-args="replies" data-approval="true" data-time="relatif" data-thinking="true" data-autoscroll="true" aria-labelledby="af-title">
  <header class="af__head">
    <div class="af__agent">
      <span class="af__avatar" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M5 10v4M9 7v10M13 4v16M17 8v8M21 11v2"/></svg>
      </span>
      <div class="af__who">
        <h2 class="af__name" id="af-title">Iris</h2>
        <p class="af__role">Agent téléphonique · Cabinet dentaire des Carmes</p>
      </div>
    </div>
    <p class="af__call" data-af-call>
      <span class="af__pulse" aria-hidden="true"></span>
      <span data-af-status>En appel</span>
      <span class="af__clock" data-af-clock>00:00</span>
    </p>
  </header>

  <div class="af__caller">
    <span class="af__lbl">Appelant</span>
    <b data-af-caller>—</b>
    <span class="af__num" data-af-number></span>
    <span class="af__intent" data-af-intent></span>
    <span class="af__wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
  </div>

  <div class="af__body">
    <ol class="af__feed" data-af-feed tabindex="0" role="log" aria-live="off" aria-label="Activité de l’agent, de la plus ancienne à la plus récente"></ol>
    <button class="af__follow" type="button" data-af-follow hidden>
      <span data-af-follow-label>Suivre le direct</span>
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg>
    </button>
  </div>

  <footer class="af__foot">
    <button class="af__replay" type="button" data-af-replay aria-label="Rejouer le scénario">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7L4 8.5"/><path d="M4 4v4.5h4.5"/></svg>
    </button>
    <div class="af__speed" role="group" aria-label="Vitesse de lecture">
      <button type="button" data-af-speed="0.5" aria-pressed="false">0,5×</button>
      <button type="button" data-af-speed="1" aria-pressed="true">1×</button>
      <button type="button" data-af-speed="2" aria-pressed="false">2×</button>
      <button type="button" data-af-speed="4" aria-pressed="false">4×</button>
    </div>
    <p class="af__stats" data-af-stats></p>
  </footer>
  <p class="af__sr" role="status" aria-live="polite" data-af-sr></p>
</section>
<!-- /SECTION -->

<style>
  .af {
    --af-h: 600px; --af-gap: 20px; --af-pad: 24px; --af-fs: 15px; --af-lh: 22px;
    --af-spring: cubic-bezier(.2, 1.2, .3, 1);
    position: relative; display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; grid-template-columns: minmax(0, 1fr);
    width: 100%; min-width: 0; max-width: 760px; height: var(--af-h); margin: 0 auto; overflow: hidden;
    background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius-sheet);
    font-family: var(--font-sans); font-size: var(--af-fs); line-height: var(--af-lh);
  }
  @supports (transition-timing-function: linear(0, 1)) {
    .af { --af-spring: linear(0, .049, .161, .291, .441, .584, .701, .808, .893, .952, .997, 1.026, 1.042, 1.05, 1.05, 1.047, 1.041, 1.034, 1.026, 1.019, 1.014, 1.008, 1.004, 1.002, 1, .998, .998, .997, .997, .998, .999, 1); }
  }
  .af[data-density="compacte"] { --af-gap: 12px; --af-pad: 16px; --af-fs: 14px; --af-lh: 20px; }
  .af *, .af *::before, .af *::after { box-sizing: border-box; }
  .af :where(p, h2, ol, ul, dl, dd, pre) { margin: 0; padding: 0; }
  .af :where(button) { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .af :focus-visible { outline: var(--focus-width) solid var(--focus-ring); outline-offset: var(--focus-offset); }
  .af code, .af .af__clock, .af .af__num, .af time { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .af__sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ——— En-tête ——— */
  .af__head { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px var(--af-pad); }
  .af__agent { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .af__avatar { flex: none; display: grid; place-items: center; width: 40px; height: 40px; border-radius: var(--radius-pill); background: var(--accent-subtle); color: var(--accent); border: 1px solid var(--accent-subtle-border); }
  .af__who { min-width: 0; }
  .af__name { color: var(--text-strong); font-size: 15px; line-height: 20px; font-weight: 600; letter-spacing: var(--track-snug); }
  .af__role { color: var(--text-muted); font-size: 13px; line-height: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .af__call { flex: none; display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border-radius: var(--radius-pill); background: var(--raised); border: 1px solid var(--border); font-size: 13px; font-weight: 500; color: var(--text-strong); }
  .af__clock { color: var(--text-muted); font-size: 12px; }
  .af__pulse { position: relative; width: 8px; height: 8px; border-radius: 50%; background: var(--up); }
  .af__pulse::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 1.5px solid var(--up); opacity: 0; animation: af-ping 1.8s var(--ease-out) infinite; }
  .af.is-ended .af__pulse { background: var(--text-disabled); }
  .af.is-ended .af__pulse::after, .af.is-paused .af__pulse::after { animation: none; }

  .af__caller { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 12px; min-height: 44px; padding: 8px var(--af-pad); background: var(--raised); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); font-size: 13px; line-height: 18px; }
  .af__lbl { font: 500 11px/16px var(--font-mono); letter-spacing: var(--track-caps); text-transform: uppercase; color: var(--text-muted); }
  .af__caller b { color: var(--text-strong); font-weight: 600; }
  .af__num { color: var(--text-muted); font-size: 12px; }
  .af__intent { display: inline-flex; align-items: center; height: 24px; padding: 0 8px; border-radius: var(--radius-pill); background: var(--surface); border: 1px solid var(--border); color: var(--text); font-size: 12px; }
  .af__wave { display: inline-flex; align-items: center; gap: 2px; height: 20px; margin-left: auto; }
  .af__wave i { display: block; width: 2px; height: 16px; border-radius: 2px; background: var(--text-muted); transform: scaleY(.25); transform-origin: center; animation: af-wave 1.1s ease-in-out infinite; }
  .af__wave i:nth-child(2) { animation-delay: -.9s; } .af__wave i:nth-child(3) { animation-delay: -.35s; } .af__wave i:nth-child(4) { animation-delay: -.7s; }
  .af__wave i:nth-child(5) { animation-delay: -.15s; } .af__wave i:nth-child(6) { animation-delay: -.55s; } .af__wave i:nth-child(7) { animation-delay: -.8s; }
  .af.is-ended .af__wave i, .af.is-paused .af__wave i { animation: none; }

  /* ——— Fil ——— */
  .af__body { position: relative; min-height: 0; }
  .af__feed { height: 100%; overflow-y: auto; overscroll-behavior: contain; list-style: none; padding: var(--af-pad) var(--af-pad) 8px; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
  .af__feed:focus-visible { outline-offset: -2px; border-radius: var(--radius-card); }
  .af__empty { display: grid; place-items: center; gap: 8px; height: 100%; text-align: center; color: var(--text-muted); font-size: 14px; }

  .af-step { position: relative; display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 12px; padding-bottom: var(--af-gap); animation: af-in .5s var(--af-spring) both; }
  .af-step::before { content: ""; position: absolute; left: 11.5px; top: 30px; bottom: 6px; width: 1px; background: var(--border); }
  .af-step:last-child::before { display: none; }
  .af[data-thinking="false"] .af-step[data-type="think"] { display: none; }

  .af-node { position: relative; display: grid; place-items: center; width: 24px; height: 24px; margin-top: -1px; border-radius: 50%; background: var(--surface); border: 1px solid var(--border); color: var(--text-muted); }
  .af-node svg { display: block; }
  .af-node > svg:not(.af-spin) { animation: af-pop .45s var(--af-spring) both; }
  [data-state="running"] > .af-node { border-color: var(--accent-subtle-border); color: var(--accent); box-shadow: 0 0 0 4px var(--glow-accent); }
  [data-state="success"] > .af-node, [data-state="approved"] > .af-node { background: var(--tint-green-bg); border-color: var(--tint-green-border); color: var(--tint-green-fg); }
  [data-state="error"] > .af-node { background: var(--tint-red-bg); border-color: var(--tint-red-border); color: var(--tint-red-fg); }
  [data-state="waiting"] > .af-node { background: var(--tint-amber-bg); border-color: var(--tint-amber-border); color: var(--tint-amber-fg); box-shadow: 0 0 0 4px var(--glow); }
  [data-state="refused"] > .af-node { background: var(--tint-neutral-bg); border-color: var(--tint-neutral-border); color: var(--tint-neutral-fg); }
  .af-spin { animation: af-rot .9s linear infinite; }

  .af-step__main { min-width: 0; }
  .af-step__row { display: flex; align-items: center; gap: 8px; min-height: 22px; }
  .af-step__kind { flex: none; font: 500 11px/16px var(--font-mono); letter-spacing: var(--track-caps); text-transform: uppercase; color: var(--text-muted); }
  .af-step__title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-strong); font-weight: 500; }
  .af-step__title code { font-size: .9em; font-weight: 500; }
  [data-type="ask"] .af-step__title { white-space: normal; text-wrap: balance; }
  [data-state="running"] .af-step__title { -webkit-mask-image: linear-gradient(90deg, #000 30%, rgba(0,0,0,.45) 50%, #000 70%); mask-image: linear-gradient(90deg, #000 30%, rgba(0,0,0,.45) 50%, #000 70%); -webkit-mask-size: 300% 100%; mask-size: 300% 100%; animation: af-shine 1.6s linear infinite; }
  .af-step__meta { flex: none; display: inline-flex; align-items: center; gap: 8px; margin-left: auto; padding-left: 8px; color: var(--text-muted); font-size: 12px; line-height: 16px; }
  .af-step__meta [data-dur]:empty { display: none; }
  .af-step__meta [data-dur] { display: inline-flex; align-items: center; height: 20px; padding: 0 6px; border-radius: var(--radius-pill); background: var(--raised); font-family: var(--font-mono); font-variant-numeric: tabular-nums; color: var(--text); }
  .af[data-time="masque"] .af-step__meta time { display: none; }
  .af-badge { flex: none; display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: var(--radius-pill); font-size: 12px; font-weight: 500; line-height: 16px; border: 1px solid transparent; }
  .af-badge:empty { display: none; }
  .af-badge[data-tone="run"] { background: var(--accent-subtle); color: var(--text-strong); border-color: var(--accent-subtle-border); }
  .af-badge[data-tone="wait"] { background: var(--tint-amber-bg); color: var(--tint-amber-fg); border-color: var(--tint-amber-border); }
  .af-badge[data-tone="err"] { background: var(--tint-red-bg); color: var(--tint-red-fg); border-color: var(--tint-red-border); }
  .af-badge[data-tone="ok"] { background: var(--tint-green-bg); color: var(--tint-green-fg); border-color: var(--tint-green-border); }
  .af-badge[data-tone="neutral"] { background: var(--tint-neutral-bg); color: var(--tint-neutral-fg); border-color: var(--tint-neutral-border); }

  .af-step__body { display: grid; gap: 8px; margin-top: 8px; }
  .af-step__body:empty { display: none; }
  .af-text { color: var(--text-muted); max-width: 62ch; text-wrap: pretty; }
  .af-caret { display: inline-block; width: 2px; height: 1em; margin-left: 2px; vertical-align: -2px; border-radius: 1px; background: var(--accent); animation: af-blink 1s steps(1) infinite; }
  [data-state]:not([data-state="running"]) .af-caret { display: none; }

  /* Plan */
  .af-plan { list-style: none; display: grid; gap: 4px; }
  .af-plan li { display: flex; align-items: center; gap: 8px; min-height: 24px; color: var(--text-muted); transition: color var(--motion-base) var(--ease-out); }
  .af-plan i { flex: none; display: grid; place-items: center; width: 16px; height: 16px; border-radius: 50%; border: 1px solid var(--border-control); color: var(--tint-green-fg); transition: background-color var(--motion-base) var(--ease-out), border-color var(--motion-base) var(--ease-out); }
  .af-plan i svg { opacity: 0; transform: scale(.4); transition: opacity var(--motion-base) var(--ease-out), transform .4s var(--af-spring); }
  .af-plan [data-p="active"] { color: var(--text-strong); }
  .af-plan [data-p="active"] i { border-color: var(--accent); box-shadow: inset 0 0 0 3px var(--surface), inset 0 0 0 8px var(--accent); }
  .af-plan [data-p="done"] i { background: var(--tint-green-bg); border-color: var(--tint-green-border); }
  .af-plan [data-p="done"] i svg { opacity: 1; transform: none; }
  .af-plan [data-p="skip"] { color: var(--text-disabled); text-decoration: line-through; text-decoration-thickness: 1px; }
  .af-plan [data-p="skip"] i { border-style: dashed; border-color: var(--text-disabled); }

  /* Repliables */
  .af-tog { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; margin: -6px 0 -6px -8px; padding: 0 8px; border: 0; border-radius: var(--radius-ctl); background: transparent; color: var(--text-muted); font-size: 13px; position: relative; }
  .af-tog::after { content: ""; position: absolute; inset: -6px 0; }
  .af-tog:hover { background: var(--state-hover); color: var(--text-strong); }
  .af-tog svg { transition: transform var(--motion-slow) var(--af-spring); }
  .af-tog[aria-expanded="true"] svg { transform: rotate(90deg); }
  .af-col { display: grid; grid-template-rows: 0fr; transition: grid-template-rows var(--motion-slow) var(--ease-out); }
  .af-col[data-open] { grid-template-rows: 1fr; }
  .af-col__in { min-height: 0; overflow: hidden; visibility: hidden; transition: visibility 0s var(--motion-slow); }
  .af-col[data-open] .af-col__in { visibility: visible; transition-delay: 0s; }
  .af[data-args="masques"] .af-args { display: none; }

  /* Outils */
  .af-json { margin: 4px 0 0; padding: 12px; border-radius: var(--radius-ctl); background: var(--raised); border: 1px solid var(--border); font: 12px/18px var(--font-mono); color: var(--text-muted); white-space: pre-wrap; overflow-wrap: anywhere; }
  .af-json .k { color: var(--tint-violet-fg); } .af-json .s { color: var(--tint-green-fg); } .af-json .n { color: var(--tint-blue-fg); } .af-json .b { color: var(--tint-amber-fg); }
  .af-bar { position: relative; height: 2px; border-radius: 2px; background: var(--scale-track); overflow: hidden; }
  .af-bar::after { content: ""; position: absolute; inset: 0; width: 40%; border-radius: 2px; background: var(--accent); animation: af-slide 1.1s var(--ease-out) infinite; }
  [data-state]:not([data-state="running"]) .af-bar { display: none; }

  /* Résultats */
  .af-kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; padding: 12px; border-radius: var(--radius-ctl); background: var(--raised); font-size: 13px; line-height: 20px; }
  .af-kv dt { color: var(--text-muted); }
  .af-kv dd { color: var(--text-strong); font-weight: 500; min-width: 0; }
  .af-slots { list-style: none; display: flex; flex-wrap: wrap; gap: 8px; }
  .af-slots li { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: var(--radius-pill); border: 1px solid var(--border); background: var(--surface); font: 500 13px/18px var(--font-mono); color: var(--text); animation: af-in .45s var(--af-spring) both; }
  .af-slots li:nth-child(2) { animation-delay: 60ms; } .af-slots li:nth-child(3) { animation-delay: 120ms; } .af-slots li:nth-child(4) { animation-delay: 180ms; }
  .af-slots [data-pick] { background: var(--accent-subtle); border-color: var(--accent-subtle-border); color: var(--text-strong); }
  .af-slots [data-pick] span { font-family: var(--font-sans); font-size: 12px; color: var(--text-muted); }
  .af-note { display: flex; align-items: flex-start; gap: 8px; padding: 12px; border-radius: var(--radius-ctl); font-size: 13px; line-height: 20px; }
  .af-note svg { flex: none; margin-top: 2px; }
  .af-note[data-tone="empty"] { border: 1px dashed var(--border-control); color: var(--text-muted); }
  .af-note[data-tone="err"] { background: var(--tint-red-bg); color: var(--tint-red-fg); border: 1px solid var(--tint-red-border); }
  .af-note[data-tone="ok"] { background: var(--raised); color: var(--text); }
  .af-note b { font-weight: 600; }
  .af-note small { display: block; font-size: 12px; opacity: .9; }

  /* Validation */
  .af-ask { display: grid; gap: 12px; padding: 16px; border-radius: var(--radius-card); background: var(--raised); border: 1px solid var(--border); }
  .af-ask .af-kv { padding: 0; background: none; }
  .af-ask__act { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .af-ask__hint { flex: 1 1 160px; color: var(--text-muted); font-size: 12px; line-height: 16px; }
  .af-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; padding: 0 16px; border-radius: var(--radius-ctl); border: 1px solid var(--border-control); background: var(--surface); color: var(--text-strong); font-size: 14px; font-weight: 500; transition: transform var(--motion-fast) var(--ease-out), background-color var(--motion-base) var(--ease-out); }
  .af-btn:hover { background: var(--raised); }
  .af-btn:active { transform: scale(.97); }
  .af-btn--primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  .af-btn--primary:hover { background: var(--accent-hover); }
  @media (min-width: 768px) { .af-btn { height: 36px; } .af-btn::after { content: ""; position: absolute; inset: -4px 0; } .af-btn { position: relative; } }
  .af-ask__done { display: flex; align-items: center; gap: 8px; color: var(--text-muted); font-size: 13px; }

  /* Réponse */
  .af-say { padding-left: 12px; border-left: 2px solid var(--accent); color: var(--text-strong); font-size: calc(var(--af-fs) + 1px); line-height: calc(var(--af-lh) + 2px); max-width: 60ch; text-wrap: pretty; }
  .af-tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .af-end { display: flex; align-items: center; gap: 12px; padding: 4px 0 16px; color: var(--text-muted); font-size: 12px; animation: af-in .5s var(--af-spring) both; }
  .af-end::before, .af-end::after { content: ""; flex: 1; height: 1px; background: var(--border); }

  /* Suivi du direct */
  .af__follow { position: absolute; left: 50%; bottom: 12px; display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 16px; border-radius: var(--radius-pill); border: 1px solid var(--border-strong); background: var(--surface); color: var(--text-strong); font-size: 13px; font-weight: 500; box-shadow: var(--shadow-popover); transform: translateX(-50%); animation: af-rise .45s var(--af-spring) both; }
  .af__follow[hidden] { display: none; }
  .af__follow b { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 6px; border-radius: var(--radius-pill); background: var(--accent); color: var(--accent-fg); font: 600 11px/1 var(--font-mono); }
  .af__follow b:empty { display: none; }

  /* Pied */
  .af__foot { display: flex; align-items: center; gap: 8px; padding: 8px var(--af-pad) 8px calc(var(--af-pad) - 8px); border-top: 1px solid var(--border); }
  .af__replay { display: grid; place-items: center; width: 44px; height: 44px; border: 0; border-radius: var(--radius-ctl); background: transparent; color: var(--text-muted); }
  .af__replay:hover { background: var(--state-hover); color: var(--text-strong); }
  .af__replay:active svg { transform: rotate(-90deg); transition: transform var(--motion-slow) var(--af-spring); }
  .af__speed { display: inline-flex; padding: 2px; border-radius: var(--radius-pill); background: var(--raised); border: 1px solid var(--border); }
  .af__speed button { min-width: 44px; height: 40px; padding: 0 8px; border: 0; border-radius: var(--radius-pill); background: transparent; color: var(--text-muted); font: 500 12px/1 var(--font-mono); transition: background-color var(--motion-base) var(--ease-out), color var(--motion-base) var(--ease-out); }
  .af__speed [aria-pressed="true"] { background: var(--surface); color: var(--text-strong); box-shadow: var(--shadow-overlay); }
  .af__stats { margin-left: auto; color: var(--text-muted); font-size: 12px; line-height: 16px; text-align: right; font-variant-numeric: tabular-nums; }
  .af__stats b { color: var(--text-strong); font-weight: 600; font-family: var(--font-mono); }
  @media (min-width: 768px) { .af__speed button { height: 32px; } }
  @media (max-width: 520px) {
    .af { --af-pad: 16px; }
    .af__role { font-size: 12px; }
    .af__call [data-af-status] { display: none; }
    .af__stats [data-wide] { display: none; }

    }
    function finish(s) {
      if (s.t === 'tool' && s.fail) { state(s, 'error', 'Échec', 'err'); st.errors++; say(s.name + ' : échec après ' + dur(s.e)); }
      else if (s.t === 'result' && s.error) { state(s, 'error', 'Erreur 503', 'err'); var r = s.el.querySelector('[data-retry]'); if (r) r.textContent = 'Nouvelle tentative lancée.'; }
      else {
        state(s, 'success');
        if (s.t === 'tool') say(s.name + ' : réussi en ' + dur(s.e));
      }
      if (s.t === 'think') {
        var tog = s.el.querySelector('[data-af-tog]');
        if (tog && !tog.dataset.touched) setTimeout(function () { if (!tog.dataset.touched) toggle(tog, false); }, mq.matches ? 0 : 700);
      }
      if (s.t === 'final') {
        var tags = s.el.querySelector('[data-tags]');
        tags.innerHTML = s.tags.map(function (x) { return '<span class="af-badge" data-tone="' + x[0] + '">' + esc(x[1]) + '</span>'; }).join('');
        say('Réponse donnée : ' + s.text);
      }
      if (s.pd != null) plan(s.pd, 'done');
      if (s.skip) s.skip.forEach(function (i) { plan(i, 'skip'); });
    }
    function next() {
      st.i++;
      st.cur = st.queue[st.i] || null;
      if (st.cur) start(st.cur);
      else end();
    }
    function end() {
      st.ended = true;
      root.classList.add('is-ended');
      q('[data-af-status]').textContent = 'Appel terminé';
      var li = document.createElement('li');
      li.className = 'af-end';
      li.textContent = 'Fin de l’appel · ' + q('[data-af-clock]').textContent;
      feed.appendChild(li);
      stats();
      root.dispatchEvent(new CustomEvent('agent:done', { bubbles: true, detail: { scenario: cfg.scenario, duree: st.t, outils: st.tools, erreurs: st.errors } }));
      if (cfg.loop) loopTimer = setTimeout(function () { if (root.isConnected) reset(); }, 2800);
    }
    function decide(ok) {
      var s = st.cur;
      if (!s || s.t !== 'ask' || s.decided) return;
      s.decided = true;
      var act = s.el.querySelector('[data-act]');
      var now = cfg.time === 'absolu' ? ' à ' + stamp(st.t) : ' après ' + dur(s.e);
      act.outerHTML = '<p class="af-ask__done">' + (ok ? I.ok : I.no) + '<span>' + (ok ? 'Approuvé' : 'Refusé') + ' par vous' + now + '</span></p>';
      state(s, ok ? 'approved' : 'refused', ok ? 'Approuvé' : 'Refusé', ok ? 'ok' : 'neutral');
      say(ok ? 'Approuvé. L’agent reprend.' : 'Refusé. L’agent adapte sa réponse.');
      [].splice.apply(st.queue, [st.i + 1, 0].concat((ok ? s.ok : s.ko).map(copy)));
      root.dispatchEvent(new CustomEvent('agent:approval', { bubbles: true, detail: { decision: ok ? 'approve' : 'refuse', titre: s.title } }));
      next();
      kick();
    }

    /* ——— Horloge virtuelle ——— */
    function advance(real) {
      var s = st.cur;
      if (!s) return;
      if (s.t === 'ask') {
        s.e += real; st.t += real; update(s);
        if (cfg.autoApprove && s.e >= cfg.autoApprove) decide(true);
        return;
      }
      var dt = mq.matches ? Infinity : real * cfg.speed;
      while (s && s.t !== 'ask' && dt > 0) {
        var left = s.dur - s.e;
        if (dt < left) { s.e += dt; st.t += dt; update(s); dt = 0; }
        else { s.e = s.dur; st.t += left; dt -= left; update(s); finish(s); next(); s = st.cur; }
      }
    }
    function frame(now) {
      raf = 0;
      if (!root.isConnected) return stop();
      if (!running()) { last = 0; return; }
      var dt = last ? Math.min(now - last, 100) : 16;
      last = now;
      advance(dt);
      clock(); stats(); stick();
      if (!st.ended) raf = requestAnimationFrame(frame);
    }
    function running() { return visible && !document.hidden && st && !st.ended; }
    function kick() {
      root.classList.toggle('is-paused', !running());
      if (!raf && running()) { last = 0; raf = requestAnimationFrame(frame); }
      if (mq.matches) { advance(0); clock(); stats(); stick(); }
    }
    function clock() {
      var s = st.sc.offset + Math.floor(st.t / 1000);
      q('[data-af-clock]').textContent = pad(Math.floor(s / 60)) + ':' + pad(s % 60);
    }
    function stats() {
      var n = st.shown;
      q('[data-af-stats]').innerHTML = '<span data-wide>' + n + ' étape' + (n > 1 ? 's' : '') + ' · ' + st.tools + ' outil' + (st.tools > 1 ? 's' : '') +
        (st.errors ? ' · ' + st.errors + ' erreur' + (st.errors > 1 ? 's' : '') : '') + ' · </span>Durée totale <b>' + num(st.t / 1000, 1) + ' s</b>';
    }
    function say(t) { srEl.textContent = t; }

    /* ——— Défilement : suit le direct, s’arrête si l’on remonte ——— */
    function gap() { return feed.scrollHeight - feed.scrollTop - feed.clientHeight; }
    function stick() { if (follow && cfg.autoscroll && !scrolling && gap() > 1) feed.scrollTop = feed.scrollHeight; else if (!cfg.autoscroll && gap() > 24 && follow) { follow = false; syncFollow(); } }
    function syncFollow() {
      followBtn.hidden = follow;
      followBtn.querySelector('[data-af-follow-label]').textContent = st && st.ended ? 'Aller à la fin' : 'Suivre le direct';
      var b = followBtn.querySelector('b');
      if (!b) { b = document.createElement('b'); followBtn.insertBefore(b, followBtn.lastElementChild); }
      b.textContent = unseen ? String(unseen) : '';
      followBtn.setAttribute('aria-label', (st && st.ended ? 'Aller à la fin' : 'Suivre le direct') + (unseen ? ', ' + unseen + ' nouvelle' + (unseen > 1 ? 's' : '') + ' étape' + (unseen > 1 ? 's' : '') : ''));
    }
    function markIntent() { intent = performance.now(); }
    feed.addEventListener('wheel', function (e) { if (e.deltaY < 0) markIntent(); }, { passive: true });
    feed.addEventListener('touchstart', markIntent, { passive: true });
    feed.addEventListener('pointerdown', markIntent);
    feed.addEventListener('keydown', function (e) { if (/^(ArrowUp|PageUp|Home)$/.test(e.key)) markIntent(); });
    feed.addEventListener('scroll', function () {
      var g = gap();
      if (g < 8) { if (!follow) { follow = true; unseen = 0; syncFollow(); } return; }
      if (performance.now() - intent < 900 && follow && g > 24) { follow = false; unseen = 0; syncFollow(); }
    }, { passive: true });
    followBtn.addEventListener('click', function () {
      follow = true; unseen = 0; syncFollow();
      scrolling = !mq.matches;
      feed.scrollTo({ top: feed.scrollHeight, behavior: mq.matches ? 'auto' : 'smooth' });
      setTimeout(function () { scrolling = false; }, 450);
      feed.focus({ preventScroll: true });
    });

    /* ——— Interactions ——— */
    function toggle(btn, open) {
      var col = root.querySelector('#' + btn.getAttribute('aria-controls'));
      btn.setAttribute('aria-expanded', String(open));
      if (open) col.setAttribute('data-open', ''); else col.removeAttribute('data-open');
      if (btn.closest('[data-think]')) btn.querySelector('span').textContent = open ? 'Masquer le raisonnement' : 'Afficher le raisonnement';
    }
    feed.addEventListener('click', function (e) {
      var t = e.target.closest('[data-af-tog]');
      if (t) { t.dataset.touched = '1'; toggle(t, t.getAttribute('aria-expanded') !== 'true'); return; }
      var d = e.target.closest('[data-af-decide]');
      if (d) decide(d.dataset.afDecide === 'ok');
    });
    q('[data-af-replay]').addEventListener('click', reset);
    function syncSpeed() { root.querySelectorAll('[data-af-speed]').forEach(function (b) { b.setAttribute('aria-pressed', String(parseFloat(b.dataset.afSpeed) === cfg.speed)); }); }
    root.querySelectorAll('[data-af-speed]').forEach(function (b) {
      b.addEventListener('click', function () { root.dataset.speed = b.dataset.afSpeed; });
    });

    /* Réglages en direct : scénario et validation relancent, le reste s’applique sans perdre l’état. */
    var mo = new MutationObserver(function (list) {
      var restart = list.some(function (m) { return m.attributeName === 'data-scenario' || m.attributeName === 'data-approval'; });
      if (restart) return reset();
      var prev = cfg.args;
      cfg = read();
      syncSpeed();
      if (cfg.args !== prev && cfg.args !== 'masques') root.querySelectorAll('.af-args [data-af-tog]').forEach(function (b) { toggle(b, cfg.args === 'ouverts'); });
      st.queue.forEach(function (s) { if (s.el) s.el.querySelector('time').textContent = stamp(s.t0); });
      kick();
    });
    mo.observe(root, { attributes: true, attributeFilter: ['data-scenario', 'data-approval', 'data-speed', 'data-args', 'data-time', 'data-autoscroll', 'data-autoapprove', 'data-loop'] });

    /* Pause hors écran et onglet masqué. */
    var io = 'IntersectionObserver' in window ? new IntersectionObserver(function (en) { visible = en[0].isIntersecting; kick(); }, { threshold: 0.1 }) : null;
    if (io) io.observe(root);
    function onVis() { kick(); }
    document.addEventListener('visibilitychange', onVis);
    function stop() { if (io) io.disconnect(); mo.disconnect(); document.removeEventListener('visibilitychange', onVis); clearTimeout(loopTimer); cancelAnimationFrame(raf); }

    root.agentFeed = { replay: reset, approve: function () { decide(true); }, refuse: function () { decide(false); }, destroy: stop };
    reset();
    return root.agentFeed;
  }

  document.querySelectorAll('[data-agent-feed]').forEach(init);
  window.AgentFeed = { init: init, scenarios: SCENARIOS };
})();
</script>

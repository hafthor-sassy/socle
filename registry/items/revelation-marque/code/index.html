<!-- Révélation de marque — HTML + CSS + JS autonomes. Nécessite tokens.css (variables du design system).
     Le logo se construit pétale par pétale sur un ressort, le mot-symbole monte de son masque, puis l'écran se lève.
     data-mode="intro" : une fois puis la page ; data-mode="loop" : préchargeur en boucle. -->
<link rel="stylesheet" href="tokens.css">

<!-- SECTION -->
<div class="br" data-brand-reveal data-mode="intro" data-exit="curtain" data-percent="true" data-duration="2400" data-stagger="90">
  <!-- La page révélée -->
  <div class="br__page" data-page>
    <header class="br__bar">
      <a href="#" class="br__lock" aria-label="nacre, accueil">
        <svg class="br__mark" viewBox="0 0 32 32" aria-hidden="true"><g class="br__petals"><path d="M16 16A7.2 7.2 0 0 1 16 3.4A7.2 7.2 0 0 1 16 16Z"/><path d="M16 16A7.2 7.2 0 0 1 28.6 16A7.2 7.2 0 0 1 16 16Z"/><path d="M16 16A7.2 7.2 0 0 1 16 28.6A7.2 7.2 0 0 1 16 16Z"/><path d="M16 16A7.2 7.2 0 0 1 3.4 16A7.2 7.2 0 0 1 16 16Z"/></g><circle cx="16" cy="16" r="2.1" class="br__pearl"/></svg>
        <span>nacre</span>
      </a>
      <nav class="br__nav" aria-label="Rayons"><a href="#">Femme</a><a href="#">Homme</a><a href="#">Maison</a><a href="#">Journal</a></nav>
      <a href="#" class="br__bag" aria-label="Panier, 2 articles"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 8h13l-1 11.5a1.5 1.5 0 0 1-1.5 1.4H8a1.5 1.5 0 0 1-1.5-1.4z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg><span>2</span></a>
    </header>
    <main class="br__hero">
      <div class="br__copy">
        <p class="br__kicker br__in" style="--d: 0">Collection automne · 24 pièces</p>
        <h2 class="br__title br__in" style="--d: 1">La maille,<br>en pleine lumière.</h2>
        <p class="br__lead br__in" style="--d: 2">Laine mérinos tracée, coton biologique filé au Portugal. Livraison offerte dès 80&nbsp;€, retours sous 30&nbsp;jours.</p>
        <div class="br__ctas br__in" style="--d: 3"><a href="#" class="br__cta">Découvrir la collection</a><button type="button" class="br__ghost" data-replay>Rejouer l’intro</button></div>
      </div>
      <ul class="br__shelf" role="list">
        <li class="br__card br__in" style="--d: 2">
          <span class="br__img" aria-hidden="true"><svg viewBox="0 0 120 120"><path d="M42 22l-22 12 8 22 10-4v46h44V52l10 4 8-22-22-12c-2 8-9 12-18 12s-16-4-18-12z"/><path d="M48 66h24M48 74h24M48 82h24"/></svg></span>
          <span class="br__pname">Pull Ondine</span><span class="br__price">89&nbsp;€</span>
        </li>
        <li class="br__card br__in" style="--d: 3">
          <span class="br__img" aria-hidden="true"><svg viewBox="0 0 120 120"><path d="M38 20h44l6 20-8 4v56H40V44l-8-4z"/><path d="M60 20v80M50 34h-6M70 34h6"/></svg></span>
          <span class="br__pname">Gilet Perle</span><span class="br__price">119&nbsp;€</span>
        </li>
      </ul>
    </main>
  </div>

  <!-- L'écran de révélation -->
  <div class="br__veil" data-veil role="status" aria-live="polite" aria-label="Chargement de nacre">
    <div class="br__center">
      <svg class="br__big" viewBox="0 0 32 32" aria-hidden="true" data-big>
        <g data-spin>
          <path data-petal d="M16 16A7.2 7.2 0 0 1 16 3.4A7.2 7.2 0 0 1 16 16Z"/><path data-petal d="M16 16A7.2 7.2 0 0 1 28.6 16A7.2 7.2 0 0 1 16 16Z"/>
          <path data-petal d="M16 16A7.2 7.2 0 0 1 16 28.6A7.2 7.2 0 0 1 16 16Z"/><path data-petal d="M16 16A7.2 7.2 0 0 1 3.4 16A7.2 7.2 0 0 1 16 16Z"/>
        </g>
        <circle data-pearl cx="16" cy="16" r="2.1"/>
      </svg>
      <span class="br__word" aria-hidden="true"><span>n</span><span>a</span><span>c</span><span>r</span><span>e</span></span>
    </div>
    <div class="br__meter" aria-hidden="true"><span class="br__line"><i data-fill></i></span><span class="br__pct" data-pct>0</span></div>
    <span class="br__sr" data-sr>Chargement…</span>
  </div>
</div>
<!-- /SECTION -->

<style>
  .br { position: relative; width: 100%; min-height: 600px; overflow: hidden; isolation: isolate; background: var(--bg); color: var(--text); font-family: var(--font-sans); }
  .br a { color: inherit; text-decoration: none; }
  .br :focus-visible { outline: var(--focus-width) solid var(--focus-ring); outline-offset: var(--focus-offset); }

  /* ——— Page ——— */
  .br__page { min-height: inherit; display: grid; grid-template-rows: auto 1fr; padding: 0 clamp(16px, 4vw, 48px); }
  .br__bar { display: flex; align-items: center; gap: 24px; min-height: 72px; border-bottom: 1px solid var(--border); }
  .br__lock { display: inline-flex; align-items: center; gap: 10px; min-height: 44px; font-size: 22px; font-weight: 600; letter-spacing: -0.04em; color: var(--text-strong); }
  .br__mark { width: 28px; height: 28px; }
  .br__mark path, .br__big path { fill: var(--accent); }
  .br__pearl { fill: var(--bg); }
  .br__nav { display: flex; gap: 4px; margin-left: auto; }
  .br__nav a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 12px; border-radius: var(--radius-pill); font-size: 15px; color: var(--text-muted); transition: color var(--motion-base) var(--ease-out), background-color var(--motion-base) var(--ease-out); }
  .br__nav a:hover { color: var(--text-strong); background: var(--state-hover); }
  .br__bag { position: relative; display: grid; place-items: center; width: 44px; height: 44px; border-radius: var(--radius-pill); color: var(--text-strong); }
  .br__bag svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
  .br__bag span { position: absolute; top: 4px; right: 2px; min-width: 18px; height: 18px; padding: 0 5px; display: grid; place-items: center; border-radius: var(--radius-pill); background: var(--accent); color: var(--accent-fg); font: 600 11px/1 var(--font-mono); }

  .br__hero { display: grid; grid-template-columns: 1.05fr 1fr; gap: clamp(24px, 4vw, 64px); align-items: center; padding: clamp(32px, 6vw, 72px) 0; }
  .br__kicker { margin: 0 0 16px; font: 500 12px/16px var(--font-mono); letter-spacing: var(--track-caps); text-transform: uppercase; color: var(--text-muted); }
  .br__title { margin: 0; font-size: clamp(2.25rem, 1.4rem + 3.4vw, 4.25rem); line-height: 1.02; letter-spacing: -0.04em; font-weight: 600; color: var(--text-strong); }
  .br__lead { margin: 20px 0 0; max-width: 44ch; font-size: var(--t-base); line-height: 1.6; color: var(--text-muted); }
  .br__ctas { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
  .br__cta { display: inline-flex; align-items: center; height: 48px; padding: 0 22px; border-radius: var(--radius-pill); background: var(--accent); color: var(--accent-fg) !important; font-weight: 550; font-size: 15px; transition: background-color var(--motion-base) var(--ease-out), transform 240ms cubic-bezier(.34, 1.56, .64, 1); }
  .br__cta:hover { background: var(--accent-hover); }
  .br__cta:active, .br__ghost:active { transform: scale(.97); }
  .br__ghost { height: 48px; padding: 0 20px; border: 1px solid var(--border-control); border-radius: var(--radius-pill); background: transparent; color: var(--text-strong); font: 500 15px/1 var(--font-sans); cursor: pointer; transition: background-color var(--motion-base) var(--ease-out); }
  .br__ghost:hover { background: var(--state-hover); }
  .br__shelf { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .br__card { display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; }
  .br__card:nth-child(2) { margin-top: 48px; }
  .br__img { grid-column: 1 / -1; aspect-ratio: 4 / 5; display: grid; place-items: center; border-radius: var(--radius-card); background: var(--accent-subtle); margin-bottom: 8px; }
  .br__img svg { width: 62%; fill: none; stroke: var(--accent); stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
  .br__pname { font-size: 15px; font-weight: 550; color: var(--text-strong); }
  .br__price { font: 500 14px/22px var(--font-mono); color: var(--text-muted); }

  /* Entrée de la page après la révélation */
  .br__in { opacity: 1; transform: none; }
  .br.is-pre .br__in { opacity: 0; transform: translateY(24px); }
  .br.is-pre.is-revealed .br__in { opacity: 1; transform: none; }
  .br.is-revealed .br__in { transition: opacity 700ms var(--ease-out), transform 900ms cubic-bezier(.16, 1, .3, 1); transition-delay: calc(var(--d, 0) * 70ms + 120ms); }

  /* ——— Voile de révélation ——— */
  .br__veil { position: absolute; inset: 0; z-index: 5; display: grid; place-items: center; background: var(--surface); color: var(--text-strong); border-radius: 0 0 var(--veil-r, 0px) var(--veil-r, 0px); will-change: transform; }
  .br__veil[hidden] { display: none; }
  .br__center { display: grid; justify-items: center; gap: 20px; }
  .br__big { width: clamp(88px, 11vw, 120px); height: auto; overflow: visible; }
  .br__big [data-spin], .br__big [data-petal], .br__big [data-pearl] { transform-box: view-box; transform-origin: 16px 16px; }
  .br__big [data-pearl] { fill: var(--surface); }
  .br__word { display: inline-flex; overflow: hidden; padding: .04em .02em .12em; font-size: clamp(36px, 4.6vw, 52px); font-weight: 600; letter-spacing: -0.05em; line-height: 1; }
  .br__word span { display: inline-block; }
  .br__meter { position: absolute; left: clamp(16px, 4vw, 48px); right: clamp(16px, 4vw, 48px); bottom: clamp(24px, 4vw, 40px); display: flex; align-items: center; gap: 16px; transition: opacity 300ms var(--ease-out); }
  .br[data-percent=false] .br__meter { opacity: 0; }
  .br__line { position: relative; flex: 1; height: 1px; background: var(--border); overflow: hidden; }
  .br__line i { position: absolute; inset: 0; background: var(--text-strong); transform-origin: left; transform: scaleX(var(--p, 0)); }
  .br__pct { min-width: 4ch; text-align: right; font: 500 13px/1 var(--font-mono); font-variant-numeric: tabular-nums; color: var(--text-muted); }
  .br__pct::after { content: " %"; }
  .br__sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  @media (max-width: 760px) {
    .br { min-height: 720px; }
    .br__nav { display: none; }
    .br__bag { margin-left: auto; }
    .br__bar { min-height: 64px; }
    .br__hero { grid-template-columns: 1fr; padding: 32px 0 40px; gap: 32px; }
    .br__card:nth-child(2) { margin-top: 24px; }
    .br__ctas { margin-top: 24px; }
    .br__cta, .br__ghost { flex: 1 1 auto; justify-content: center; }
  }
  @media (prefers-reduced-motion: reduce) {
    .br.is-pre.is-revealed .br__in { opacity: 1; transform: none; }
  .br.is-revealed .br__in { transition: opacity 200ms linear; transform: none; }
    .br.is-pre .br__in, .br.is-pre.is-revealed .br__in { transform: none; }
  }
</style>

<script>
/* BrandReveal — construction du logo (ressorts en easing linear()), masque du mot-symbole, compteur et sortie.
   Web Animations API, aucune dépendance. Mode boucle : arrêt hors de l'écran (IntersectionObserver). */
(function () {
  var reduce = function () { return window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches; };
  function spring(k, c) {
    var x = 0, v = 0, dt = 1 / 120, pts = [], t = 0;
    while (t < 3) { v += (-k * (x - 1) - c * v) * dt; x += v * dt; t += dt; pts.push(x); if (t > .3 && Math.abs(x - 1) < .001 && Math.abs(v) < .01) break; }
    var step = Math.max(1, Math.round(pts.length / 56)), out = ['0'];
    for (var i = step; i < pts.length; i += step) out.push(pts[i].toFixed(3));
    out.push('1');
    return { easing: 'linear(' + out.join(', ') + ')', duration: Math.round(t * 1000) };
  }
  var EXPO = 'cubic-bezier(.16, 1, .3, 1)', INOUT = 'cubic-bezier(.76, 0, .24, 1)';
  var ROT = [0, 90, 180, 270];

  function init(root) {
    if (root._brandReveal) return root._brandReveal;
    var veil = root.querySelector('[data-veil]'), petals = [].slice.call(root.querySelectorAll('[data-petal]')), pearl = root.querySelector('[data-pearl]'),
        spin = root.querySelector('[data-spin]'), letters = [].slice.call(root.querySelectorAll('.br__word span')), fill = root.querySelector('[data-fill]'),
        pct = root.querySelector('[data-pct]'), sr = root.querySelector('[data-sr]'), big = root.querySelector('[data-big]');
    var anims = [], timers = [], raf = 0, visible = true, run = 0, loopNext = null;
    function opt() { return { mode: root.dataset.mode || 'intro', exit: root.dataset.exit || 'curtain', dur: +root.dataset.duration || 2400, stag: +root.dataset.stagger || 90, k: +root.dataset.stiffness || 240, c: +root.dataset.damping || 15 }; }
    function A(el, kf, o) { var a = el.animate(kf, Object.assign({ fill: 'both' }, o)); anims.push(a); return a; }
    function later(fn, ms) { timers.push(setTimeout(fn, ms)); }
    function clear() {
      run++; anims.forEach(function (a) { a.cancel(); }); anims = []; timers.forEach(clearTimeout); timers = []; cancelAnimationFrame(raf); raf = 0; loopNext = null;
    }
    function counter(ms, id) {
      var t0 = performance.now();
      (function tick(now) {
        if (id !== run) return;
        var p = Math.min(1, (now - t0) / ms), e = p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
        fill.style.setProperty('--p', e.toFixed(4)); pct.textContent = Math.round(e * 100);
        if (p < 1) raf = requestAnimationFrame(tick);
      })(t0);
    }

    // Construction : pétales qui éclosent du centre, perle, quart de tour qui s'amortit, lettres qui montent.
    function build(o, id) {
      var S = spring(o.k, o.c);
      petals.forEach(function (p, i) {
        A(p, [{ transform: 'rotate(' + (ROT[i] - 90) + 'deg) scale(0)', opacity: 0 }, { transform: 'rotate(' + (ROT[i] - 90) + 'deg) scale(.15)', opacity: 1, offset: .08 }, { transform: 'rotate(0deg) scale(1)', opacity: 1 }],
          { duration: S.duration, easing: S.easing, delay: i * o.stag });
      });
      A(spin, [{ transform: 'rotate(-45deg)' }, { transform: 'rotate(0deg)' }], { duration: S.duration + 200, easing: S.easing, delay: 3 * o.stag + 120 });
      A(pearl, [{ transform: 'scale(0)' }, { transform: 'scale(1)' }], { duration: S.duration, easing: spring(420, 16).easing, delay: 4 * o.stag + 160 });
      letters.forEach(function (l, i) {
        A(l, [{ transform: 'translateY(115%) rotate(6deg)' }, { transform: 'translateY(0) rotate(0)' }], { duration: 900, easing: EXPO, delay: 4 * o.stag + 260 + i * 45 });
      });
    }
    function unbuild(o) {
      petals.forEach(function (p, i) { A(p, [{ transform: 'scale(1)', opacity: 1 }, { transform: 'rotate(90deg) scale(0)', opacity: 0 }], { duration: 520, easing: INOUT, delay: i * 50 }); });
      A(pearl, [{ transform: 'scale(1)' }, { transform: 'scale(0)' }], { duration: 300, easing: INOUT });
      letters.forEach(function (l, i) { A(l, [{ transform: 'translateY(0)' }, { transform: 'translateY(-115%)' }], { duration: 520, easing: INOUT, delay: i * 30 }); });
    }
    function exit(o, id) {
      sr.textContent = 'nacre est prêt.';
      root.classList.add('is-revealed');
      var done = function () { if (id === run) { veil.hidden = true; } };
      var a;
      if (o.exit === 'zoom') {
        letters.forEach(function (l, i) { A(l, [{ opacity: 1 }, { opacity: 0 }], { duration: 240, delay: i * 20 }); });
        A(big, [{ transform: 'scale(1)' }, { transform: 'scale(.9)', offset: .18 }, { transform: 'scale(42)' }], { duration: 1100, easing: 'cubic-bezier(.7, 0, .2, 1)' });
        a = A(veil, [{ opacity: 1 }, { opacity: 1, offset: .55 }, { opacity: 0 }], { duration: 1100, easing: 'linear' });
      } else if (o.exit === 'fade') {
        a = A(veil, [{ opacity: 1, filter: 'blur(0)' }, { opacity: 0, filter: 'blur(6px)' }], { duration: 700, easing: 'ease-out' });
      } else {
        A(root.querySelector('.br__center'), [{ transform: 'translateY(0)' }, { transform: 'translateY(-40px)' }], { duration: 1000, easing: INOUT });
        a = A(veil, [{ transform: 'translateY(0)', borderBottomLeftRadius: '0px', borderBottomRightRadius: '0px' }, { transform: 'translateY(-60%)', borderBottomLeftRadius: '50% 120px', borderBottomRightRadius: '50% 120px', offset: .6 }, { transform: 'translateY(-110%)', borderBottomLeftRadius: '50% 0px', borderBottomRightRadius: '50% 0px' }],
          { duration: 1050, easing: INOUT });
      }
      a.onfinish = done;
    }

    function play() {
      clear(); var id = run, o = opt();
      veil.hidden = false; root.classList.remove('is-revealed'); root.classList.add('is-pre');
      fill.style.setProperty('--p', 0); pct.textContent = '0'; sr.textContent = 'Chargement…';
      if (reduce()) { // repli statique : logo posé, puis fondu court
        fill.style.setProperty('--p', 1); pct.textContent = '100';
        if (o.mode === 'loop') return;
        later(function () { if (id === run) { root.classList.add('is-revealed'); A(veil, [{ opacity: 1 }, { opacity: 0 }], { duration: 200 }).onfinish = function () { veil.hidden = true; }; } }, 700);
        return;
      }
      build(o, id);
      if (o.mode === 'loop') {
        counter(o.dur, id);
        loopNext = function () { if (id !== run) return; unbuild(o); later(function () { if (id === run && visible) play(); else loopNext = play; }, 760); };
        later(function () { if (visible) loopNext(); }, o.dur + 400);
        return;
      }
      counter(o.dur, id);
      later(function () { exit(o, id); }, o.dur + 200);
    }

    root.addEventListener('click', function (e) { if (e.target.closest('[data-replay]')) play(); });
    if ('IntersectionObserver' in window) {
      new IntersectionObserver(function (es) {
        visible = es[0].isIntersecting;
        anims.forEach(function (a) { try { visible ? (a.playState === 'paused' && a.play()) : (a.playState === 'running' && a.pause()); } catch (err) {} });
        if (visible && loopNext && opt().mode === 'loop') { var f = loopNext; loopNext = null; f(); }
      }, { threshold: .1 }).observe(root);
    }
    var api = { play: play, stop: clear };
    root._brandReveal = api;
    play();
    return api;
  }
  window.BrandReveal = { init: init };
  document.querySelectorAll('[data-brand-reveal]').forEach(init);
})();
</script>

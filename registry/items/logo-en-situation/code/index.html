<!-- Logo en situation — HTML + CSS + JS autonomes. Nécessite tokens.css (variables du design system).
     Remplacez le <symbol id="ls-mark"> par votre icône (viewBox 32 × 32, fill="currentColor") : toutes les maquettes suivent. -->
<link rel="stylesheet" href="tokens.css">

<!-- SECTION -->
<section class="ls" data-logo-situ data-tile="accent" data-avatar="circle" style="--ls-app-radius: 22.5%">
  <svg width="0" height="0" style="position: absolute" aria-hidden="true">
    <symbol id="ls-mark" viewBox="0 0 32 32">
      <path d="M7.18 13.2a9 9 0 0 1 17.64 0z"/><path d="M7 14.8h18v4.8H7z"/><path d="M7 21.2h6.4V26H7zM18.6 21.2H25V26h-6.4z"/>
    </symbol>
  </svg>

  <header class="ls__head">
    <div>
      <p class="ls__kicker">Logo en situation</p>
      <h2 class="ls__title"><span data-brand>Strata</span>, posé partout où il vivra.</h2>
    </div>
    <span class="ls__lockup" aria-hidden="true"><svg class="ls__mark"><use href="#ls-mark"/></svg><b data-brand>Strata</b></span>
  </header>

  <div class="ls__grid">
    <!-- 1. Onglet de navigateur + favicon -->
    <figure class="ls__cell ls__cell--browser">
      <div class="ls__browser" aria-hidden="true">
        <div class="ls__tabs">
          <span class="ls__dots"><i></i><i></i><i></i></span>
          <span class="ls__tab is-on"><span class="ls__fav"><svg><use href="#ls-mark"/></svg></span><span class="ls__tabtxt"><span data-brand>Strata</span> — Studio d’architecture</span><span class="ls__x">×</span></span>
          <span class="ls__tab"><span class="ls__fav ls__fav--ghost"></span><span class="ls__tabtxt">Concours Halle Rive Gauche</span></span>
        </div>
        <div class="ls__url"><span class="ls__lock"></span><span><span data-slug>strata</span>-studio.fr/projets</span></div>
        <div class="ls__page"><span class="ls__nav"><span class="ls__lockup ls__lockup--sm"><svg class="ls__mark"><use href="#ls-mark"/></svg><b data-brand>Strata</b></span><span class="ls__navl"><i>Projets</i><i>Atelier</i><i>Contact</i></span></span><span class="ls__h">Halle Rive Gauche, livraison 2027</span><span class="ls__line w40"></span><span class="ls__blocks"><i></i><i></i><i></i></span></div>
      </div>
      <figcaption class="ls__cap"><b>Favicon</b><span class="ls__sizes" aria-label="Tailles du favicon">
        <span class="ls__fz" style="--s: 16px"><span class="ls__fav"><svg><use href="#ls-mark"/></svg></span><em>16</em></span>
        <span class="ls__fz" style="--s: 32px"><span class="ls__fav"><svg><use href="#ls-mark"/></svg></span><em>32</em></span>
        <span class="ls__fz" style="--s: 48px"><span class="ls__fav"><svg><use href="#ls-mark"/></svg></span><em>48</em></span>
      </span></figcaption>
    </figure>

    <!-- 2. Icône d'application -->
    <figure class="ls__cell ls__cell--app">
      <div class="ls__home" aria-hidden="true">
        <span class="ls__app ls__app--ghost"></span><span class="ls__app ls__app--brand"><svg><use href="#ls-mark"/></svg></span><span class="ls__app ls__app--ghost"></span>
        <span class="ls__applbl"></span><span class="ls__applbl is-brand" data-brand>Strata</span><span class="ls__applbl"></span>
        <span class="ls__notif"><span class="ls__app ls__app--brand ls__app--mini"><svg><use href="#ls-mark"/></svg></span><span><b data-brand>Strata</b><em>Plans de la phase APS validés par le client.</em></span></span>
      </div>
      <figcaption class="ls__cap"><b>Icône d’app</b><span>Rayon <span data-radius>22,5 %</span></span></figcaption>
    </figure>

    <!-- 3. Avatar réseau social -->
    <figure class="ls__cell ls__cell--social">
      <div class="ls__profile">
        <div class="ls__cover" aria-hidden="true"></div>
        <div class="ls__avatar" aria-hidden="true"><svg><use href="#ls-mark"/></svg></div>
        <p class="ls__pname"><span data-brand>Strata</span> Studio <svg class="ls__verified" viewBox="0 0 16 16" role="img" aria-label="Compte vérifié"><circle cx="8" cy="8" r="8"/><path d="M4.8 8.2l2.1 2.1 4.3-4.4"/></svg></p>
        <p class="ls__handle">@<span data-slug>strata</span>.studio</p>
        <p class="ls__bio">Architecture et réhabilitation à Bordeaux. Bois, pierre, lumière.</p>
        <p class="ls__stats"><span><b>1 284</b> abonnés</span><span><b>212</b> projets</span></p>
      </div>
      <figcaption class="ls__cap"><b>Avatar</b><span data-avatar-lbl>Cercle</span></figcaption>
    </figure>

    <!-- 4. Carte de visite recto / verso -->
    <figure class="ls__cell ls__cell--card">
      <button type="button" class="ls__flip" aria-pressed="false" aria-label="Retourner la carte de visite">
        <span class="ls__card">
          <span class="ls__face ls__face--front"><svg class="ls__bigmark"><use href="#ls-mark"/></svg><b class="ls__cardword" data-brand>Strata</b></span>
          <span class="ls__face ls__face--back">
            <span class="ls__lockup ls__lockup--sm"><svg class="ls__mark"><use href="#ls-mark"/></svg><b data-brand>Strata</b></span>
            <span class="ls__who"><b>Clémence Arnaud</b><em>Architecte associée</em></span>
            <span class="ls__contact">06 41 22 87 30<br>clemence@<span data-slug>strata</span>-studio.fr<br>14 quai des Chartrons, Bordeaux</span>
          </span>
        </span>
      </button>
      <figcaption class="ls__cap"><b>Carte de visite</b><span>85 × 55 mm · touchez pour retourner</span></figcaption>
    </figure>
  </div>
</section>
<!-- /SECTION -->

<style>
  .ls {
    --ls-app-radius: 22.5%;
    width: min(100%, 1040px); margin: 0 auto; color: var(--text); font-family: var(--font-sans);
  }
  .ls svg { fill: currentColor; }
  .ls__head { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 24px; }
  .ls__kicker { margin: 0 0 8px; font: 500 12px/16px var(--font-mono); letter-spacing: var(--track-caps); text-transform: uppercase; color: var(--text-muted); }
  .ls__title { margin: 0; max-width: 18ch; font-size: var(--t-page); line-height: var(--t-page-lh); letter-spacing: var(--track-tight); font-weight: 600; color: var(--text-strong); text-wrap: balance; }
  .ls__lockup { display: inline-flex; align-items: center; gap: 10px; color: var(--text-strong); }
  .ls__lockup b { font-size: 22px; font-weight: 650; letter-spacing: -0.04em; }
  .ls__mark { width: 30px; height: 30px; color: var(--accent); }
  .ls__lockup--sm b { font-size: 15px; }
  .ls__lockup--sm .ls__mark { width: 20px; height: 20px; }

  .ls__grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .ls__cell { margin: 0; display: grid; grid-template-rows: 1fr auto; gap: 16px; padding: 16px; border: 1px solid var(--border); border-radius: var(--radius-sheet); background: var(--surface); min-width: 0; }
  .ls__cell--browser, .ls__cell--card { grid-column: span 2; }
  .ls__cap { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 14px; line-height: 20px; color: var(--text-muted); }
  .ls__cap b { font-weight: 550; color: var(--text-strong); }

  /* Tuile de l'icône : accent, encre ou clair */
  .ls { --tile-bg: var(--accent); --tile-fg: var(--accent-fg); }
  .ls[data-tile=ink] { --tile-bg: var(--text-strong); --tile-fg: var(--surface); }
  .ls[data-tile=light] { --tile-bg: var(--surface); --tile-fg: var(--accent); }

  /* 1. Navigateur */
  .ls__browser { display: grid; grid-template-rows: auto auto 1fr; border: 1px solid var(--border); border-radius: var(--radius-card); overflow: hidden; background: var(--bg); min-height: 220px; }
  .ls__tabs { display: flex; align-items: end; gap: 4px; padding: 8px 8px 0; background: var(--raised); }
  .ls__dots { display: inline-flex; gap: 6px; padding: 0 8px 12px 4px; }
  .ls__dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--border); }
  .ls__tab { display: inline-flex; align-items: center; gap: 8px; min-width: 0; max-width: 300px; height: 36px; padding: 0 12px; border-radius: 8px 8px 0 0; font-size: 13px; color: var(--text-muted); }
  .ls__tab.is-on { background: var(--surface); color: var(--text-strong); }
  .ls__tabtxt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ls__x { margin-left: 4px; color: var(--text-muted); }
  .ls__fav { flex: none; display: inline-grid; place-items: center; width: var(--s, 16px); height: var(--s, 16px); border-radius: calc(var(--s, 16px) * .22); background: var(--tile-bg); color: var(--tile-fg); box-shadow: inset 0 0 0 1px var(--border); }
  .ls__fav svg { width: 78%; height: 78%; }
  .ls__fav--ghost { background: var(--border); box-shadow: none; }
  .ls__url { display: flex; align-items: center; gap: 8px; margin: 0; padding: 8px 12px; background: var(--surface); border-bottom: 1px solid var(--border); font: 13px/20px var(--font-mono); color: var(--text-muted); }
  .ls__url > span:last-child { padding: 2px 12px; border-radius: var(--radius-pill); background: var(--raised); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ls__lock { width: 10px; height: 12px; border-radius: 2px; background: var(--text-muted); flex: none; }
  .ls__page { display: grid; align-content: start; gap: 10px; padding: 16px 20px 20px; }
  .ls__nav { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-bottom: 6px; }
  .ls__navl { display: inline-flex; gap: 16px; font-size: 13px; color: var(--text-muted); }
  .ls__navl i { font-style: normal; }
  .ls__h { font-size: 20px; line-height: 26px; font-weight: 600; letter-spacing: var(--track-tight); color: var(--text-strong); }
  .ls__line { height: 10px; border-radius: var(--radius-pill); background: var(--border); }
  .w60 { width: 60%; } .w40 { width: 40%; }
  .ls__blocks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
  .ls__blocks i { height: 48px; border-radius: var(--radius-ctl); background: var(--raised); }
  .ls__sizes { display: inline-flex; align-items: end; gap: 16px; }
  .ls__fz { display: inline-grid; justify-items: center; gap: 4px; }
  .ls__fz em { font: normal 500 11px/1 var(--font-mono); color: var(--text-muted); }

  /* 2. Écran d'accueil */
  .ls__home { position: relative; display: grid; grid-template-columns: repeat(3, 56px); grid-auto-rows: auto; justify-content: center; align-content: center; gap: 12px 20px; padding: 24px 16px 96px; border-radius: var(--radius-card); background: var(--raised); min-height: 220px; }
  .ls__app { width: 56px; height: 56px; border-radius: var(--ls-app-radius); background: var(--border); display: grid; place-items: center; }
  .ls__app--brand { background: var(--tile-bg); color: var(--tile-fg); box-shadow: inset 0 0 0 1px var(--border); }
  .ls__app--brand svg { width: 62%; height: 62%; }
  .ls__applbl { height: 8px; width: 40px; justify-self: center; margin-top: -4px; border-radius: var(--radius-pill); background: var(--border); }
  .ls__applbl.is-brand { width: auto; height: auto; background: none; font-size: 12px; line-height: 14px; color: var(--text-strong); }
  .ls__notif { position: absolute; left: 12px; right: 12px; bottom: 12px; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--radius-card); background: var(--surface); box-shadow: var(--shadow-overlay); border: 1px solid var(--border); font-size: 14px; line-height: 18px; }
  .ls__notif b { display: block; color: var(--text-strong); font-weight: 600; }
  .ls__notif em { font-style: normal; color: var(--text-muted); display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
  .ls__app--mini { width: 32px; height: 32px; flex: none; }

  /* 3. Profil */
  .ls__profile { position: relative; display: grid; gap: 2px; padding: 0 16px 16px; border: 1px solid var(--border); border-radius: var(--radius-card); overflow: hidden; background: var(--surface); }
  .ls__cover { height: 72px; margin: 0 -16px; background-color: var(--accent-subtle); background-image: repeating-linear-gradient(-12deg, transparent 0 10px, var(--accent-subtle-border) 10px 11px); }
  .ls__avatar { width: 72px; height: 72px; margin-top: -36px; margin-bottom: 8px; display: grid; place-items: center; border-radius: 50%; background: var(--tile-bg); color: var(--tile-fg); box-shadow: 0 0 0 4px var(--surface), inset 0 0 0 1px var(--border); }
  .ls[data-avatar=square] .ls__avatar { border-radius: 16px; }
  .ls__avatar svg { width: 56%; height: 56%; }
  .ls__pname { margin: 0; display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: 16px; color: var(--text-strong); }
  .ls__verified { width: 16px; height: 16px; }
  .ls__verified circle { fill: var(--info); }
  .ls__verified path { fill: none; stroke: var(--surface); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .ls__handle { margin: 0; font-size: 14px; color: var(--text-muted); }
  .ls__bio { margin: 8px 0 0; font-size: 14px; line-height: 20px; color: var(--text); }
  .ls__stats { margin: 8px 0 0; display: flex; gap: 16px; font-size: 14px; color: var(--text-muted); }
  .ls__stats b { color: var(--text-strong); font-weight: 600; }

  /* 4. Carte de visite qui se retourne */
  .ls__flip { display: grid; place-items: center; padding: 16px; border: 0; border-radius: var(--radius-card); background: var(--raised); cursor: pointer; perspective: 1200px; font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
  .ls__flip:focus-visible { outline: var(--focus-width) solid var(--focus-ring); outline-offset: var(--focus-offset); }
  .ls__card { position: relative; display: block; width: min(100%, 400px); aspect-ratio: 85 / 55; transform-style: preserve-3d; transition: transform 900ms cubic-bezier(.3, 1.3, .4, 1); }
  .ls__flip[aria-pressed=true] .ls__card { transform: rotateY(180deg); }
  .ls__flip:hover .ls__card { transform: rotateY(-8deg) rotateX(4deg); }
  .ls__flip[aria-pressed=true]:hover .ls__card { transform: rotateY(172deg) rotateX(4deg); }
  .ls__face { position: absolute; inset: 0; display: grid; border-radius: 10px; backface-visibility: hidden; -webkit-backface-visibility: hidden; box-shadow: var(--shadow-popover); overflow: hidden; }
  .ls__face--front { place-items: center; align-content: center; gap: 12px; background: var(--tile-bg); color: var(--tile-fg); }
  .ls[data-tile=light] .ls__face--front { box-shadow: var(--shadow-popover), inset 0 0 0 1px var(--border); }
  .ls__bigmark { width: 64px; height: 64px; }
  .ls__cardword { font-size: 28px; font-weight: 650; letter-spacing: -0.045em; }
  .ls__face--back { transform: rotateY(180deg); grid-template-rows: auto 1fr auto; padding: 20px 22px; background: var(--surface); color: var(--text); text-align: left; box-shadow: var(--shadow-popover), inset 0 0 0 1px var(--border); }
  .ls__who { align-self: center; display: grid; gap: 2px; }
  .ls__who b { font-size: 17px; font-weight: 600; color: var(--text-strong); }
  .ls__who em { font-style: normal; font-size: 14px; color: var(--text-muted); }
  .ls__contact { font: 12px/18px var(--font-mono); color: var(--text-muted); }

  @media (max-width: 760px) {
    .ls__head { flex-direction: column; align-items: start; gap: 16px; }
    .ls__head .ls__lockup { display: none; }
    .ls__grid { grid-template-columns: 1fr; }
    .ls__cell--browser, .ls__cell--card { grid-column: auto; }
    .ls__cell { padding: 12px; border-radius: var(--radius-card); }
    .ls__tab:not(.is-on) { display: none; }
    .ls__tab { max-width: none; flex: 1; }
    .ls__cap { flex-wrap: wrap; }
    .ls__face--back { padding: 16px; }
    .ls__contact { font-size: 12px; line-height: 17px; }
    .ls__navl { display: none; }
    .ls__h { font-size: 17px; line-height: 22px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .ls__card { transition: none; }
    .ls__flip:hover .ls__card { transform: none; }
    .ls__flip[aria-pressed=true]:hover .ls__card { transform: rotateY(180deg); }
  }
</style>

<script>
/* LogoSitu — nom de marque, retournement de la carte et libellés dynamiques. */
(function () {
  function slug(s) { return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'marque'; }
  function init(root) {
    if (root._logoSitu) return root._logoSitu;
    var flip = root.querySelector('.ls__flip');
    flip.addEventListener('click', function () { flip.setAttribute('aria-pressed', String(flip.getAttribute('aria-pressed') !== 'true')); });
    var api = {
      brand: function (name) {
        name = (name || 'Strata').trim() || 'Strata';
        root.querySelectorAll('[data-brand]').forEach(function (n) { n.textContent = name; });
        root.querySelectorAll('[data-slug]').forEach(function (n) { n.textContent = slug(name); });
      },
      radius: function (pct) { root.style.setProperty('--ls-app-radius', pct + '%'); var l = root.querySelector('[data-radius]'); if (l) l.textContent = String(pct).replace('.', ',') + ' %'; },
      avatar: function (shape) { root.dataset.avatar = shape; var l = root.querySelector('[data-avatar-lbl]'); if (l) l.textContent = shape === 'square' ? 'Carré arrondi' : 'Cercle'; },
      tile: function (t) { root.dataset.tile = t; },
      flip: function (on) { flip.setAttribute('aria-pressed', String(!!on)); }
    };
    root._logoSitu = api;
    return api;
  }
  window.LogoSitu = { init: init };
  document.querySelectorAll('[data-logo-situ]').forEach(init);
})();
</script>

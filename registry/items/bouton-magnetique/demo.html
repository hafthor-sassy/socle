<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bouton magnétique — démo</title>
<link rel="stylesheet" href="../../../css/tokens.css">
<link rel="stylesheet" href="../../../demo-kit/demo.css">
<script src="../../../demo-kit/demo.js"></script>
<style id="component-css"></style>
<style>
  .stage { min-height: 100vh; display: grid; place-items: center; align-content: center; gap: 28px; padding: 48px 24px; text-align: center; }
  .hint { font: 500 12px/18px var(--font-mono); letter-spacing: var(--track-caps); text-transform: uppercase; color: var(--text-muted); }
  .zone { position: absolute; left: 50%; top: 50%; border: 1px dashed var(--border-control); border-radius: 999px; pointer-events: none; opacity: 0; transition: opacity var(--motion-base) var(--ease-out); }
  .show-zone .zone { opacity: .7; }
  .wrap { position: relative; }
  .is-thumb .stage { gap: 0; }
  .is-thumb .hint { display: none; }
  .is-thumb .mag { scale: 1.9; }
</style>
</head>
<body>
<main class="stage">
  <div class="wrap"><span class="zone" id="zone" aria-hidden="true"></span><div id="live"></div></div>
  <p class="hint">Approchez le curseur · relâchez pour le ressort</p>
</main>
<script>
  var props = Socle.props({ label: 'Démarrer un projet', variant: 'solid', strength: 0.4, radius: 120, stiffness: 220, damping: 16, zone: false });
  var ARROW = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  var btn = null;
  function render(p) {
    var live = document.getElementById('live');
    if (!btn) {
      live.innerHTML = '<button class="mag" type="button" data-magnetic><span class="mag__label"></span><span class="mag__icon" aria-hidden="true">' + ARROW + '</span></button>';
      btn = live.firstChild;
      if (window.Magnetic) Magnetic.attach(btn);
    }
    btn.dataset.variant = p.variant;
    btn.querySelector('.mag__label').textContent = p.label || 'Bouton';
    btn.style.setProperty('--mag-strength', p.strength);
    btn.style.setProperty('--mag-radius', p.radius + 'px');
    btn.style.setProperty('--mag-stiffness', p.stiffness);
    btn.style.setProperty('--mag-damping', p.damping);
    document.documentElement.classList.toggle('show-zone', !!p.zone);
    var z = document.getElementById('zone');
    requestAnimationFrame(function () {
      var w = btn.offsetWidth + p.radius * 2, h = btn.offsetHeight + p.radius * 2;
      z.style.width = w + 'px'; z.style.height = h + 'px'; z.style.marginLeft = (-w / 2) + 'px'; z.style.marginTop = (-h / 2) + 'px';
    });
  }
  fetch('code/index.html').then(function (r) { return r.text(); }).then(function (t) {
    var m = t.match(/<style>([\s\S]*?)<\/style>/);
    if (m) document.getElementById('component-css').textContent = m[1];
  }).catch(function () {});
  var s = document.createElement('script');
  s.src = 'code/magnetic.js';
  s.onload = function () { render(props); thumbLoop(); };
  document.head.appendChild(s);
  Socle.onChange(render);
  Socle.onReplay(function () { if (btn && btn._magnetic) { btn._magnetic.target(40, -18, true); setTimeout(function () { btn._magnetic.target(0, 0, false); }, 380); } });
  /* Vignette : un curseur fictif tourne autour du bouton. */
  function thumbLoop() {
    if (!Socle.thumb || Socle.reducedMotion() || !btn || !btn._magnetic) return;
    var pts = [[34, -14], [-30, 12], [18, 16], [0, 0]], i = 0;
    setInterval(function () { var q = pts[i++ % pts.length]; btn._magnetic.target(q[0], q[1], !!(q[0] || q[1])); }, 900);
  }
</script>
</body>
</html>

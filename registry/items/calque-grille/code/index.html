<!-- Calque de grille — HTML + CSS + JS, autonome. Nécessite tokens.css.
     Collez ce bloc en fin de <body> sur n'importe quelle page : la touche G affiche les colonnes et la ligne de base de 8 px,
     Maj + G change de calque, Échap le masque. Les réglages se lisent sur data-* de [data-grid-overlay]. -->
<link rel="stylesheet" href="tokens.css">

<!-- SECTION -->
<div data-grid-overlay
  data-columns="12" data-gutter="24" data-margin="48" data-max-width="1280" data-baseline="8"
  data-mode="both" data-tone="accent" data-opacity="12" data-visible="false">
  <div class="gl" aria-hidden="true">
    <div class="gl__base"></div>
    <div class="gl__cols"></div>
  </div>
  <div class="gl-hud" role="region" aria-label="Calque de grille">
    <p class="gl-hud__info" aria-live="polite"><span class="gl-hud__dot"></span><span data-gl-info>12 col · 24 · 48</span></p>
    <div class="gl-hud__seg" role="radiogroup" aria-label="Calque affiché">
      <button type="button" role="radio" data-gl-mode="columns">Colonnes</button>
      <button type="button" role="radio" data-gl-mode="baseline">Base</button>
      <button type="button" role="radio" data-gl-mode="both">Les deux</button>
    </div>
    <button class="gl-hud__cycle" type="button" data-gl-cycle aria-label="Changer de calque">Les deux</button>
  </div>
  <button class="gl-toggle" type="button" aria-pressed="false" aria-keyshortcuts="G" aria-label="Afficher la grille (touche G)">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
      <rect x="3.75" y="3.75" width="16.5" height="16.5" rx="2.25"/><path d="M9.25 3.75v16.5M14.75 3.75v16.5"/>
    </svg>
    <kbd>G</kbd>
  </button>
</div>
<!-- /SECTION -->

<style>
  [data-grid-overlay] {
    --gl-cols: 12; --gl-gutter: 24px; --gl-margin: 48px; --gl-max: 1280px; --gl-base: 8px;
    --gl-tone: var(--accent); --gl-o: 12%;
  }
  [data-grid-overlay][data-tone="info"] { --gl-tone: var(--info); }
  [data-grid-overlay][data-tone="down"] { --gl-tone: var(--down); }
  [data-grid-overlay][data-tone="neutral"] { --gl-tone: var(--text-strong); }

  /* Calque plein écran, au-dessus de tout, ne capte jamais le pointeur */
  .gl { position: fixed; inset: 0; z-index: var(--z-overlay); pointer-events: none; visibility: hidden; }
  .is-gl-on .gl { visibility: visible; }
  .gl__cols { position: absolute; top: 0; bottom: 0; left: 0; right: 0; margin: 0 auto; max-width: var(--gl-max); padding: 0 var(--gl-margin);
    display: grid; grid-template-columns: repeat(var(--gl-cols), minmax(0, 1fr)); column-gap: var(--gl-gutter); }
  .gl__col { position: relative; background: color-mix(in srgb, var(--gl-tone) var(--gl-o), transparent);
    box-shadow: inset 1px 0 color-mix(in srgb, var(--gl-tone) calc(var(--gl-o) * 3), transparent), inset -1px 0 color-mix(in srgb, var(--gl-tone) calc(var(--gl-o) * 3), transparent);
    transform-origin: 50% 0; transform: scaleY(0); opacity: 0;
    transition: transform 560ms cubic-bezier(.16, 1, .3, 1) calc(var(--i) * 28ms), opacity 200ms var(--ease-out) calc(var(--i) * 28ms); }
  .gl__col span { position: absolute; top: 8px; left: 0; right: 0; text-align: center; color: var(--gl-tone); font: 600 10px/16px var(--font-mono); font-variant-numeric: tabular-nums; }
  .gl__base { position: absolute; inset: 0; opacity: 0; transition: opacity 320ms var(--ease-out);
    background-image: linear-gradient(to bottom, color-mix(in srgb, var(--gl-tone) calc(var(--gl-o) * .75), transparent) 1px, transparent 1px),
                      linear-gradient(to bottom, color-mix(in srgb, var(--gl-tone) calc(var(--gl-o) * 2.2), transparent) 1px, transparent 1px);
    background-size: 100% var(--gl-base), 100% calc(var(--gl-base) * 4); background-position: 0 var(--gl-shift, 0px); }
  .is-gl-on[data-mode="columns"] .gl__col, .is-gl-on[data-mode="both"] .gl__col { transform: scaleY(1); opacity: 1; }
  .is-gl-on[data-mode="baseline"] .gl__base { opacity: 1; }
  .is-gl-on[data-mode="both"] .gl__base { opacity: .75; }
  [data-grid-overlay]:not(.is-gl-on) .gl__col { transition-duration: 220ms, 160ms; transition-delay: 0ms; }

  /* Panneau d'état */
  .gl-hud { position: fixed; left: 16px; bottom: calc(16px + var(--safe-bottom)); z-index: calc(var(--z-overlay) + 1); display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 16px;
    background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius-pill); box-shadow: var(--shadow-popover);
    transform: translateY(12px) scale(.98); opacity: 0; visibility: hidden; transition: transform 380ms cubic-bezier(.34, 1.4, .64, 1), opacity 180ms var(--ease-out), visibility 0s 380ms; }
  .is-gl-on .gl-hud { transform: none; opacity: 1; visibility: visible; transition-delay: 0s; }
  .gl-hud__info { margin: 0; display: inline-flex; align-items: center; gap: 8px; color: var(--text-strong); font: 500 13px/20px var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .gl-hud__dot { width: 8px; height: 8px; border-radius: 2px; background: var(--gl-tone); }
  .gl-hud__seg { display: inline-flex; padding: 2px; background: var(--raised); border-radius: var(--radius-pill); }
  .gl-hud__seg button { min-height: 36px; padding: 0 12px; border: 0; border-radius: var(--radius-pill); background: none; color: var(--text-muted); font: 500 13px/1 var(--font-sans); cursor: pointer; transition: background-color var(--motion-fast) var(--ease-out), color var(--motion-fast) var(--ease-out); }
  .gl-hud__seg button:hover { color: var(--text-strong); }
  .gl-hud__cycle { display: none; min-height: 44px; padding: 0 16px; border: 0; border-radius: var(--radius-pill); background: var(--raised); color: var(--text-strong); font: 500 14px/1 var(--font-sans); cursor: pointer; }
  .gl-hud__seg button[aria-checked="true"] { background: var(--surface); color: var(--text-strong); box-shadow: var(--shadow-overlay); }

  /* Bouton : seul accès au toucher, raccourci G affiché */
  .gl-toggle { position: fixed; right: 16px; bottom: calc(16px + var(--safe-bottom)); z-index: calc(var(--z-overlay) + 1); display: inline-flex; align-items: center; gap: 8px; height: 48px; padding: 0 12px 0 14px;
    background: var(--surface); color: var(--text-strong); border: 1px solid var(--border); border-radius: var(--radius-pill); box-shadow: var(--shadow-popover); cursor: pointer;
    transition: scale 220ms cubic-bezier(.34, 1.56, .64, 1), background-color var(--motion-base) var(--ease-out), color var(--motion-base) var(--ease-out); -webkit-tap-highlight-color: transparent; }
  .gl-toggle:active { scale: .94; }
  .gl-toggle[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: transparent; }
  .gl-toggle kbd { display: grid; place-items: center; min-width: 24px; height: 24px; padding: 0 6px; border-radius: 6px; border: 1px solid currentColor; font: 600 12px/1 var(--font-mono); opacity: .8; }
  .gl-toggle:focus-visible, .gl-hud__seg button:focus-visible, .gl-hud__cycle:focus-visible { outline: var(--focus-width) solid var(--focus-ring); outline-offset: var(--focus-offset); }

  @media (max-width: 640px) {
    .gl-hud { left: 12px; right: 76px; padding: 4px 4px 4px 16px; justify-content: space-between; }
    .gl-hud__seg { display: none; }
    .gl-hud__cycle { display: inline-flex; align-items: center; }
    .gl-toggle { right: 12px; width: 52px; padding: 0; justify-content: center; }
    .gl-toggle kbd { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .gl__col, .gl__base, .gl-hud, .gl-toggle { transition: none !important; }
  }
</style>

<script>
/* Calque de grille. API : GridOverlay.mount(el, options) → { show(), hide(), toggle(), set(options), destroy() } */
(function () {
  /* Points de rupture : la dernière ligne prend les réglages de data-* ; les deux premières s'adaptent au téléphone et à la tablette. */
  function breakpoints(o) {
    return [
      { min: 0, columns: 4, gutter: 16, margin: 16 },
      { min: 768, columns: Math.min(8, o.columns), gutter: Math.min(o.gutter, 24), margin: Math.min(o.margin, 32) },
      { min: 1200, columns: o.columns, gutter: o.gutter, margin: o.margin }
    ];
  }
  var MODES = ['columns', 'baseline', 'both'];
  var LABEL = { columns: 'colonnes', baseline: 'ligne de base', both: 'colonnes et ligne de base' };
  var SHORT = { columns: 'Colonnes', baseline: 'Base', both: 'Les deux' };

  function mount(root, opts) {
    var d = root.dataset;
    var o = Object.assign({ columns: +d.columns || 12, gutter: +d.gutter || 24, margin: +d.margin || 48, maxWidth: +d.maxWidth || 1280, baseline: +d.baseline || 8,
      mode: d.mode || 'both', tone: d.tone || 'accent', opacity: +d.opacity || 12, visible: d.visible === 'true', shortcut: true }, opts || {});
    var cols = root.querySelector('.gl__cols'), info = root.querySelector('[data-gl-info]'), btn = root.querySelector('.gl-toggle');
    var segs = root.querySelectorAll('[data-gl-mode]'), cyc = root.querySelector('[data-gl-cycle]'), live = root.querySelector('.gl-hud__info'), current = null;

    function bp() { var w = window.innerWidth, list = breakpoints(o), r = list[0]; list.forEach(function (b) { if (w >= b.min) r = b; }); return r; }
    function layout() {
      var b = bp();
      root.style.setProperty('--gl-cols', b.columns);
      root.style.setProperty('--gl-gutter', b.gutter + 'px');
      root.style.setProperty('--gl-margin', b.margin + 'px');
      root.style.setProperty('--gl-max', o.maxWidth + 'px');
      root.style.setProperty('--gl-base', o.baseline + 'px');
      root.style.setProperty('--gl-o', o.opacity + '%');
      root.dataset.tone = o.tone;
      if (cols.children.length !== b.columns) {
        cols.innerHTML = '';
        for (var i = 0; i < b.columns; i++) { var c = document.createElement('div'); c.className = 'gl__col'; c.style.setProperty('--i', i); c.innerHTML = '<span>' + (i + 1) + '</span>'; cols.appendChild(c); }
      }
      info.textContent = b.columns + ' col · ' + b.gutter + ' · ' + b.margin + (o.mode !== 'columns' && window.innerWidth > 640 ? ' · base ' + o.baseline : '');
      current = b;
    }
    function sync() {
      root.dataset.mode = o.mode;
      root.classList.toggle('is-gl-on', !!o.visible);
      btn.setAttribute('aria-pressed', String(!!o.visible));
      btn.setAttribute('aria-label', (o.visible ? 'Masquer' : 'Afficher') + ' la grille (touche G)');
      if (cyc) { cyc.textContent = SHORT[o.mode]; cyc.setAttribute('aria-label', 'Calque affiché : ' + LABEL[o.mode] + '. Changer'); }
      segs.forEach(function (s) { var on = s.dataset.glMode === o.mode; s.setAttribute('aria-checked', String(on)); s.tabIndex = on ? 0 : -1; });
      layout();
    }
    // la ligne de base suit le défilement : elle reste collée au document, pas à l'écran
    var ticking = false;
    function onScroll() { if (ticking) return; ticking = true; requestAnimationFrame(function () { ticking = false; root.style.setProperty('--gl-shift', (-(window.scrollY % (o.baseline * 4))) + 'px'); }); }
    function onKey(e) {
      if (!o.shortcut || e.metaKey || e.ctrlKey || e.altKey) return;
      var t = e.target, tag = t && t.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (t && t.isContentEditable)) return;
      if (e.key === 'Escape' && o.visible) { set({ visible: false }); return; }
      if (e.key !== 'g' && e.key !== 'G') return;
      e.preventDefault();
      if (e.shiftKey && o.visible) set({ mode: MODES[(MODES.indexOf(o.mode) + 1) % MODES.length] }, true);
      else set({ visible: !o.visible }, true);
    }
    function announce() { live.setAttribute('aria-label', o.visible ? 'Grille affichée : ' + LABEL[o.mode] + ', ' + current.columns + ' colonnes' : 'Grille masquée'); }
    function set(next, fromUser) {
      Object.assign(o, next || {}); sync(); announce();
      if (fromUser) root.dispatchEvent(new CustomEvent('gridchange', { detail: { visible: o.visible, mode: o.mode } }));
    }
    btn.addEventListener('click', function () { set({ visible: !o.visible }, true); });
    if (cyc) cyc.addEventListener('click', function () { set({ mode: MODES[(MODES.indexOf(o.mode) + 1) % MODES.length] }, true); });
    segs.forEach(function (s, i) {
      s.addEventListener('click', function () { set({ mode: s.dataset.glMode }, true); });
      s.addEventListener('keydown', function (e) {
        var k = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0; if (!k) return;
        e.preventDefault(); var n = segs[(i + k + segs.length) % segs.length]; set({ mode: n.dataset.glMode }, true); n.focus();
      });
    });
    window.addEventListener('keydown', onKey);
    window.addEventListener('resize', layout);
    window.addEventListener('scroll', onScroll, { passive: true });
    sync(); onScroll();
    return {
      show: function () { set({ visible: true }); }, hide: function () { set({ visible: false }); }, toggle: function () { set({ visible: !o.visible }); },
      set: set, get: function () { return Object.assign({}, o, { breakpoint: current }); },
      destroy: function () { window.removeEventListener('keydown', onKey); window.removeEventListener('resize', layout); window.removeEventListener('scroll', onScroll); }
    };
  }
  window.GridOverlay = { mount: mount };
  document.querySelectorAll('[data-grid-overlay]:not([data-gl-manual])').forEach(function (el) { el._grid = mount(el); });
})();
</script>

<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FAQ conversationnelle — démo</title>
<link rel="stylesheet" href="../../../css/tokens.css">
<link rel="stylesheet" href="../../../demo-kit/demo.css">
<script src="../../../demo-kit/demo.js"></script>
<style id="component-css"></style>
<style>
  body { display: grid; align-items: center; }
  .is-thumb .fq { padding-top: 48px; padding-bottom: 48px; }
  .is-thumb .fq__note { display: none; }
</style>
</head>
<body>
<div id="mount"></div>
<script>
  var props = Socle.props({ rythme: 48, naturel: true, reflexion: 700, curseur: true, liees: true, source: true, auto: true });
  var KEYS = ['rythme', 'naturel', 'reflexion', 'curseur', 'liees', 'source', 'auto'];
  var el = null;
  function apply(p) {
    if (!el) return;
    KEYS.forEach(function (k) { el.dataset[k] = String(p[k]); });
    if (el._faqconv) el._faqconv.update();
  }
  fetch('code/index.html').then(function (r) { return r.text(); }).then(function (t) {
    var css = t.match(/<style>([\s\S]*?)<\/style>/), js = t.match(/<script>([\s\S]*?)<\/script>/), mk = t.match(/<!-- SECTION -->([\s\S]*?)<!-- \/SECTION -->/);
    document.getElementById('component-css').textContent = css ? css[1] : '';
    document.getElementById('mount').innerHTML = mk ? mk[1] : '';
    el = document.querySelector('[data-faqconv]');
    KEYS.forEach(function (k) { el.dataset[k] = String(props[k]); });
    var q = new URLSearchParams(location.search);
    if (Socle.thumb || q.get('pre')) el.dataset.auto = 'false';
    try { new Function(js ? js[1] : '')(); } catch (e) { console.error(e); }
    var f = el._faqconv;
    if (f && (Socle.thumb || q.get('pre'))) f.prefill((q.get('pre') || 'couverture').split(','));
  });
  Socle.onChange(apply);
  Socle.onReplay(function () { if (el && el._faqconv) el._faqconv.play(['couverture', 'franchise']); });
</script>
</body>
</html>

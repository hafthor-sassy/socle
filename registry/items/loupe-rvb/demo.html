<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loupe RVB — démo</title>
<link rel="stylesheet" href="../../../css/tokens.css">
<link rel="stylesheet" href="../../../demo-kit/demo.css">
<script src="../../../demo-kit/demo.js"></script>
<style id="component-css"></style>
<style>
  body { min-height: 100vh; display: grid; align-items: center; }
  .is-thumb .lp { grid-template-columns: 1fr; max-width: 640px; padding: 24px; }
  .is-thumb .lp__info, .is-thumb .lp__hint { display: none; }
</style>
</head>
<body>
<div id="mount"></div>
<script>
  var props = Socle.props({ size: 200, zoom: 2.6, shift: 5, barrel: true, dim: 0.28, shape: 'square', stiffness: 260, src: '' });
  var KEYS = ['size', 'zoom', 'shift', 'barrel', 'dim', 'shape', 'stiffness', 'src'];
  var el = null;
  function apply(p) {
    if (!el) return;
    KEYS.forEach(function (k) { el.dataset[k] = String(p[k]); });
    if (el._loupe) el._loupe.update(RgbLoupe.read(el)); else RgbLoupe.init(document);
  }
  fetch('code/index.html').then(function (r) { return r.text(); }).then(function (t) {
    var css = t.match(/<style>([\s\S]*?)<\/style>/), js = t.match(/<script>([\s\S]*?)<\/script>/), mk = t.match(/<!-- SECTION -->([\s\S]*?)<!-- \/SECTION -->/);
    document.getElementById('component-css').textContent = css ? css[1] : '';
    document.getElementById('mount').innerHTML = mk ? mk[1] : '';
    el = document.querySelector('[data-loupe]');
    if (new URLSearchParams(location.search).get('fallback') === 'canvas') el.dataset.fallback = 'canvas';
    KEYS.forEach(function (k) { el.dataset[k] = String(props[k]); });
    try { new Function(js ? js[1] : '')(); } catch (e) { console.error(e); }
    apply(props);
    var m = /[?&]peek=([\d.]+),([\d.]+)/.exec(location.search);
    if ((m || Socle.thumb) && el._loupe) setTimeout(function () { el._loupe.peek(m ? +m[1] : .5, m ? +m[2] : .4); }, 400);
  });
  Socle.onChange(apply);
  Socle.onReplay(function () {
    if (!el || !el._loupe) return;
    var pts = [[.5, .38], [.7, .5], [.5, .68], [.3, .5], [.5, .5]], i = 0;
    (function next() { if (i >= pts.length) { setTimeout(function () { el._loupe.peek(null); }, 700); return; } el._loupe.peek(pts[i][0], pts[i][1]); i++; setTimeout(next, 650); })();
  });
</script>
</body>
</html>

<!-- Globe des clients — HTML + CSS + JS intégré, WebGL1 maison sans bibliothèque (repli Canvas 2D). Nécessite tokens.css (Geist).
     Marque fictive : Hélia (paiements internationaux pour PME). Villes réelles, chiffres fictifs.
     Réglages sur la racine : data-vitesse (°/s de rotation auto), data-inclinaison (°), data-densite (points),
     data-arcs, data-impulsions, data-region (index de départ, -1 = aucune). Terres : Natural Earth 110 m (domaine public). -->
<link rel="stylesheet" href="tokens.css">

<!-- SECTION -->
<section class="gc" data-globe-clients data-vitesse="6" data-inclinaison="18" data-densite="14000" data-arcs="true" data-impulsions="true" data-region="-1" aria-labelledby="gc-titre">
  <div class="gc__text">
    <a class="gc__brand" href="#accueil" aria-label="Hélia, accueil">
      <svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="50" class="gc__b1"/><circle cx="50" cy="50" r="27" class="gc__b2"/><ellipse cx="50" cy="50" rx="11" ry="27" class="gc__b2"/><path d="M23 50h54" class="gc__b2"/><circle cx="74" cy="29" r="9" class="gc__b3"/></svg>
      <span>Hélia</span>
    </a>
    <p class="gc__eyebrow">Paiements internationaux</p>
    <h2 class="gc__title" id="gc-titre"><span data-total>34 430</span> entreprises encaissent avec Hélia, dans 64&nbsp;pays.</h2>
    <p class="gc__lead">Vos clients paient dans leur devise, vous recevez des euros le jour même. Choisissez une région pour voir où nous sommes déjà.</p>
    <ul class="gc__regions" role="list" data-regions>
      <li><button type="button" data-r="0" aria-pressed="false"><span class="gc__rn">Europe</span><span class="gc__rv">18 420</span><span class="gc__rs">29 pays · +14 %</span></button></li>
      <li><button type="button" data-r="1" aria-pressed="false"><span class="gc__rn">Amérique du Nord</span><span class="gc__rv">6 210</span><span class="gc__rs">2 pays · +31 %</span></button></li>
      <li><button type="button" data-r="4" aria-pressed="false"><span class="gc__rn">Asie-Pacifique</span><span class="gc__rv">4 870</span><span class="gc__rs">14 pays · +42 %</span></button></li>
      <li><button type="button" data-r="3" aria-pressed="false"><span class="gc__rn">Afrique et Moyen-Orient</span><span class="gc__rv">3 340</span><span class="gc__rs">12 pays · +27 %</span></button></li>
      <li><button type="button" data-r="2" aria-pressed="false"><span class="gc__rn">Amérique latine</span><span class="gc__rv">1 590</span><span class="gc__rs">7 pays · +19 %</span></button></li>
    </ul>
  </div>

  <div class="gc__stage">
    <div class="gc__globe" data-globe>
      <div class="gc__disc" aria-hidden="true"></div>
      <canvas class="gc__canvas" data-canvas role="img" aria-label="Globe : clients Hélia dans 64 pays, flux de paiement depuis Paris vers 17 villes. Le détail par région est dans la liste."></canvas>
      <div class="gc__tip" data-tip aria-hidden="true"><strong data-tip-a></strong><span data-tip-b></span></div>
      <p class="gc__chip" data-chip aria-live="polite"></p>
    </div>
    <p class="gc__help" aria-hidden="true">Glissez pour faire tourner le globe</p>
  </div>

  <table class="gc__sr">
    <caption>Clients Hélia par ville</caption>
    <thead><tr><th scope="col">Ville</th><th scope="col">Région</th><th scope="col">Clients</th></tr></thead>
    <tbody data-table></tbody>
  </table>
</section>
<!-- /SECTION -->

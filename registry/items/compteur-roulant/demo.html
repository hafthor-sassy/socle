<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compteur qui roule — démo</title>
<link rel="stylesheet" href="../../../css/tokens.css">
<link rel="stylesheet" href="../../../demo-kit/demo.css">
<script src="../../../demo-kit/demo.js"></script>
<style id="component-css"></style>
<style>
  .stage { min-height: 100vh; display: grid; place-items: center; padding: 48px 24px; }
  @media (max-width: 600px) { .stage { padding: 12px 10px 32px; } }
  .is-thumb .stage { padding: 24px; }
</style>
</head>
<body>
<main class="stage"><div id="mount" style="display:contents"></div></main>
<script>
  var props = Socle.props({ spectateurs: 1284, format: 'entier', raideur: 210, amortissement: 22, decalage: 45, flou: true, plafond: '99', direct: true });
  var root = null, booted = false, lastFmt = 'entier';
  function render(p) {
    if (!root || !root._compteurs) return;
    root.style.setProperty('--rn-stiffness', p.raideur);
    root.style.setProperty('--rn-damping', p.amortissement);
    root.style.setProperty('--rn-stagger', p.decalage);
    root.dataset.flou = String(!!p.flou);
    root.dataset.direct = String(!!p.direct);
    var capChanged = root.dataset.plafond !== String(p.plafond);
    root.dataset.plafond = String(p.plafond);
    root._compteurs.refresh();
    if (p.format !== lastFmt) { lastFmt = p.format; root._compteurs.viewersFormat(p.format); }
    root._compteurs.viewers(p.spectateurs);
  }
  fetch('code/index.html').then(function (r) { return r.text(); }).then(function (t) {
    var css = t.match(/<style>([\s\S]*?)<\/style>/), js = t.match(/<script>([\s\S]*?)<\/script>/), mk = t.match(/<!-- SECTION -->([\s\S]*?)<!-- \/SECTION -->/);
    document.getElementById('component-css').textContent = css ? css[1] : '';
    var mount = document.getElementById('mount');
    mount.innerHTML = mk ? mk[1] : '';
    root = mount.querySelector('[data-compteurs]');
    root.dataset.plafond = String(props.plafond);
    try { new Function(js ? js[1] : '')(); } catch (e) { console.error(e); }
    render(props); booted = true;
  });
  Socle.onChange(render);
  /* Rejouer : quantité 1 → 3, ajout au panier, puis un afflux de visiteurs. */
  Socle.onReplay(function () {
    var c = root && root._compteurs; if (!c) return;
    c.qty(1);
    setTimeout(function () { c.qty(2); }, 300);
    setTimeout(function () { c.qty(3); }, 650);
    setTimeout(function () { c.add(); }, 1150);
    setTimeout(function () { c.viewers(props.spectateurs + 317); }, 1700);
  });
</script>
</body>
</html>

<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hero typographique — démo</title>
<link rel="stylesheet" href="../../../css/tokens.css">
<link rel="stylesheet" href="../../../demo-kit/demo.css">
<script src="../../../demo-kit/demo.js"></script>
<style id="component-css"></style>
<style>
html.bg-grid .htp { background: transparent; }
  .is-thumb .htp { min-height: 100vh; }
</style>
</head>
<body>
<div id="mount"></div>
<script>
  /* Props → attributs data-* et textes du composant ; son script est relancé à chaque réglage (le code copié est exactement celui affiché). */
  var props = Socle.props({"titre": "Des marques qui tiennent la distance.", "motAccent": "distance", "entree": "montee", "duree": 1100, "decalage": 110, "align": "gauche", "trait": true, "cta": "Démarrer un projet"});
  var src = null, mount = document.getElementById('mount');
  function render(p) {
    if (!src) return;
    var old = mount.firstElementChild && mount.querySelector('[data-hero-typo]');
    if (old && old._inst) old._inst.destroy();
    mount.innerHTML = src.markup;
    var root = mount.querySelector('[data-hero-typo]');
    var h = root.querySelector('[data-htp-title]');
    if (p.titre) h.textContent = p.titre;
    h.setAttribute('data-accent-word', p.motAccent || '');
    root.dataset.entree = p.entree; root.dataset.duree = p.duree; root.dataset.decalage = p.decalage;
    root.dataset.align = p.align; root.dataset.trait = String(p.trait);
    var c = root.querySelector('.htp__cta-label'); if (c && p.cta) c.textContent = p.cta;
    try { new Function(src.script)(); } catch (e) { console.error(e); }
  }
  fetch('code/index.html').then(function (r) { return r.text(); }).then(function (t) {
    var css = t.match(/<style>([\s\S]*?)<\/style>/);
    var js = t.match(/<script>([\s\S]*?)<\/script>/);
    var mk = t.match(/<!-- SECTION -->([\s\S]*?)<!-- \/SECTION -->/);
    document.getElementById('component-css').textContent = css ? css[1] : '';
    src = { markup: mk ? mk[1] : '', script: js ? js[1] : '' };
    render(props);

  });
  Socle.onChange(render);
  Socle.onReplay(render);
</script>
</body>
</html>

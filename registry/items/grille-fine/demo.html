<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grille fine — démo</title>
<link rel="stylesheet" href="../../../css/tokens.css">
<link rel="stylesheet" href="../../../demo-kit/demo.css">
<script src="../../../demo-kit/demo.js"></script>
<style id="component-css"></style>
<style>
  .hero-zone { min-height: 100vh !important; display: grid; place-items: center; text-align: center; padding: 48px 24px; }
  .copy { display: grid; justify-items: center; gap: 16px; max-width: 640px; }
  .eyebrow { font: 500 12px/18px var(--font-mono); letter-spacing: var(--track-caps); text-transform: uppercase; color: var(--text-muted); }
  h1 { font-size: clamp(2rem, 1.4rem + 2.6vw, 3.25rem); line-height: 1.08; letter-spacing: -0.02em; font-weight: 600; }
  p { color: var(--text-muted); font-size: 17px; line-height: 1.6; max-width: 46ch; }
  .is-thumb h1 { font-size: 40px; }
  .is-thumb p { font-size: 16px; }
</style>
</head>
<body>
<section class="hero-zone">
  <div class="grid-bg" id="bg" aria-hidden="true"></div>
  <div class="copy">
    <span class="eyebrow">Background</span>
    <h1>Un fond qui reste à sa place.</h1>
    <p>Une trame discrète qui dérive lentement derrière le contenu, sans lui voler la vedette.</p>
  </div>
</section>
<script>
  var props = Socle.props({ pattern: 'dots', size: 24, opacity: 0.35, thickness: 1, speed: 12, direction: 'diagonal' });
  var DIRS = { diagonal: [1, 1], right: [1, 0], down: [0, 1] };
  var bg = document.getElementById('bg');
  function motif(p) {
    var s = p.size, c = s / 2, t = p.thickness;
    if (p.pattern === 'lines') return '<path d="M' + s + ' 0V' + s + 'H0" fill="none" stroke="currentColor" stroke-width="' + t + '"/>';
    if (p.pattern === 'cross') return '<path d="M' + c + ' ' + (c - 3) + 'v6M' + (c - 3) + ' ' + c + 'h6" fill="none" stroke="currentColor" stroke-width="' + t + '" stroke-linecap="round"/>';
    return '<circle cx="' + c + '" cy="' + c + '" r="' + t + '" fill="currentColor"/>';
  }
  function render(p) {
    var d = DIRS[p.direction] || DIRS.diagonal;
    bg.style.setProperty('--grid-size', p.size + 'px');
    bg.style.setProperty('--grid-opacity', p.opacity);
    bg.style.setProperty('--grid-duration', (p.speed > 0 ? p.size / p.speed : 1) + 's');
    bg.style.setProperty('--grid-dx', d[0]);
    bg.style.setProperty('--grid-dy', d[1]);
    bg.innerHTML = '<svg class="grid-bg__svg"' + (p.speed > 0 ? '' : ' style="animation:none"') + '><defs><pattern id="grid-bg-motif" width="' + p.size + '" height="' + p.size + '" patternUnits="userSpaceOnUse">' + motif(p) + '</pattern></defs><rect width="100%" height="100%" fill="url(#grid-bg-motif)"/></svg>';
  }
  fetch('code/index.html').then(function (r) { return r.text(); }).then(function (t) {
    var m = t.match(/<style>([\s\S]*?)<\/style>/);
    if (m) document.getElementById('component-css').textContent = m[1];
  }).catch(function () {});
  render(props);
  Socle.onChange(render);
  Socle.onReplay(render);
</script>
</body>
</html>

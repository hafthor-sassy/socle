<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pile de dialogues — démo</title>
<link rel="stylesheet" href="../../../css/tokens.css">
<link rel="stylesheet" href="../../../demo-kit/demo.css">
<script src="../../../demo-kit/demo.js"></script>
<style id="component-css"></style>
<style>
  .app { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: 100vh; }
  .side { display: grid; align-content: start; gap: 4px; padding: 20px 12px; border-right: 1px solid var(--border); background: var(--surface); }
  .brand { display: inline-flex; align-items: center; gap: 10px; padding: 0 8px 16px; color: var(--text-strong); font: 600 17px/1 var(--font-sans); letter-spacing: -0.02em; }
  .side a { display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 10px; border-radius: 8px; color: var(--text-muted); font-size: 14px; text-decoration: none; }
  .side a.is-on { background: var(--state-press); color: var(--text-strong); font-weight: 500; }
  .side .sp { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; background: var(--raised); font: 600 10px/1 var(--font-mono); color: var(--text-muted); }
  .side p { margin: 16px 10px 6px; color: var(--text-muted); font: 500 11px/16px var(--font-mono); letter-spacing: var(--track-caps); text-transform: uppercase; }
  .main { padding: 32px 40px 64px; }
  .crumb { color: var(--text-muted); font-size: 14px; }
  .main h1 { margin: 8px 0 24px; font-size: clamp(1.5rem, 1.2rem + 1vw, 2rem); letter-spacing: -0.03em; font-weight: 600; }
  .rows { max-width: 760px; margin-bottom: 32px; border-top: 1px solid var(--border); }
  .row { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 16px; padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .row span { color: var(--text-muted); } .row b { color: var(--text-strong); font-weight: 500; }
  .zone-t { margin: 0 0 12px; color: var(--text-muted); font: 500 12px/18px var(--font-mono); letter-spacing: var(--track-caps); text-transform: uppercase; }
  @media (max-width: 899px) { .app { grid-template-columns: 1fr; } .side { display: none; } .main { padding: 20px 16px 48px; } .row { grid-template-columns: 1fr; gap: 2px; padding: 12px 0; } }
  .mtop { display: none; align-items: center; gap: 10px; margin-bottom: 20px; color: var(--text-strong); font: 600 17px/1 var(--font-sans); }
  @media (max-width: 899px) { .mtop { display: flex; } }
  .is-thumb .side, .is-thumb .rows, .is-thumb .crumb { display: none; } .is-thumb .app { grid-template-columns: 1fr; }
</style>
</head>
<body>
<div class="app">
  <nav class="side" aria-label="Exemple">
    <span class="brand"><svg width="26" height="26" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="28" style="fill:var(--accent)"/><path d="M50 24l16 16-16 16-16-16z" style="fill:var(--accent-fg)"/><path d="M50 62v16" fill="none" style="stroke:var(--accent-fg)" stroke-width="9" stroke-linecap="round"/></svg>Jalon</span>
    <a href="#">Ma semaine</a><a href="#">Boîte de réception</a>
    <p>Espaces</p>
    <a href="#" class="is-on"><span class="sp">RS</span>Refonte site 2027</a><a href="#"><span class="sp">MK</span>Marketing</a><a href="#"><span class="sp">PR</span>Produit</a>
  </nav>
  <main class="main">
    <span class="mtop"><svg width="26" height="26" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="28" style="fill:var(--accent)"/><path d="M50 24l16 16-16 16-16-16z" style="fill:var(--accent-fg)"/><path d="M50 62v16" fill="none" style="stroke:var(--accent-fg)" stroke-width="9" stroke-linecap="round"/></svg>Jalon</span>
    <span class="crumb">Refonte site 2027 › Paramètres</span>
    <h1>Paramètres de l’espace</h1>
    <div class="rows">
      <div class="row"><span>Nom</span><b>Refonte site 2027</b></div>
      <div class="row"><span>Propriétaire</span><b>Camille Roux</b></div>
      <div class="row"><span>Membres</span><b>12 personnes · 3 invités</b></div>
    </div>
    <p class="zone-t">Zone sensible</p>
    <div id="mount"></div>
  </main>
</div>
<script>
  var props = Socle.props({ level: '2', offset: 14, scale: 0.05, duration: 420, backdrop: 'back', confirm: true });
  var src = null, mount = document.getElementById('mount'), tour = [];
  function api() { var r = mount.querySelector('[data-dstack]'); return r && r._dstack; }
  function goLevel(lv) {
    var a = api(); if (!a || lv === 'closed') return;
    a.open();
    if (lv === '2' || lv === '3') a.push('move');
    if (lv === '3') a.push('confirm');
  }
  function render(p) {
    if (!src) return;
    tour.forEach(clearTimeout); tour = [];
    var a = api(); if (a) a.destroy();
    mount.innerHTML = src.markup;
    var r = mount.querySelector('[data-dstack]');
    r.dataset.offset = p.offset; r.dataset.scale = p.scale; r.dataset.backdrop = p.backdrop; r.dataset.confirm = p.confirm;
    r.style.setProperty('--ds-dur', p.duration + 'ms');
    try { new Function(src.script)(); } catch (e) { console.error(e); }
    goLevel(p.level);
  }
  function replay() {
    var a = api(); if (!a) return; tour.forEach(clearTimeout); tour = [];
    var at = function (t, f) { tour.push(setTimeout(f, t)); };
    a.close(); at(400, a.open); at(1300, function () { a.push('move'); }); at(2300, function () { a.push('confirm'); }); at(3400, a.back); at(4200, a.back);
  }
  fetch('code/index.html').then(function (r) { return r.text(); }).then(function (t) {
    var css = t.match(/<style>([\s\S]*?)<\/style>/), js = t.match(/<script>([\s\S]*?)<\/script>/), mk = t.match(/<!-- SECTION -->([\s\S]*?)<!-- \/SECTION -->/);
    document.getElementById('component-css').textContent = css ? css[1] : '';
    src = { markup: mk ? mk[1] : '', script: js ? js[1] : '' };
    render(props);
  });
  Socle.onChange(render);
  Socle.onReplay(replay);
</script>
</body>
</html>

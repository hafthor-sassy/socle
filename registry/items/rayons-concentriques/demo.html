<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rayons concentriques — démo</title>
<script>(function (q) { if (!q.get('accent')) document.documentElement.setAttribute('data-accent', 'emeraude'); })(new URLSearchParams(location.search));</script>
<link rel="stylesheet" href="../../../css/tokens.css">
<link rel="stylesheet" href="../../../demo-kit/demo.css">
<script src="../../../demo-kit/demo.js"></script>
<style id="component-css"></style>
<style>
  .page { min-height: 100vh; display: grid; align-content: center; padding: 32px 24px; }
  .page > * { width: 100%; max-width: 1040px; margin: 0 auto; }
  @media (max-width: 600px) { .page { padding: 12px; align-content: start; } }
  .is-thumb .page { padding: 0; }
  .is-thumb .page > * { max-width: none; }
  .is-thumb .rc { border: 0; border-radius: 0; min-height: 100vh; }
</style>
</head>
<body>
<main class="page" id="mount"></main>
<script>
  var props = Socle.props({ rayon: 24, marge: 8, mode: 'concentric' });
  var inst = null;
  function opts(p) { return { radius: p.rayon, padding: p.marge, mode: p.mode }; }
  fetch('code/index.html').then(function (r) { return r.text(); }).then(function (t) {
    var css = t.match(/<style>([\s\S]*?)<\/style>/), sec = t.match(/<!-- SECTION -->([\s\S]*?)<!-- \/SECTION -->/), js = t.match(/<script>([\s\S]*?)<\/script>/);
    document.getElementById('component-css').textContent = css ? css[1] : '';
    var mount = document.getElementById('mount');
    mount.innerHTML = sec ? sec[1].replace('data-concentric', 'data-concentric data-rc-manual') : '';
    var s = document.createElement('script'); s.textContent = js ? js[1] : ''; document.body.appendChild(s);
    inst = Concentric.mount(mount.querySelector('[data-concentric]'), opts(props));
    /* Vignette : la marge respire pour montrer le recalcul */
    if (Socle.thumb && !Socle.reducedMotion()) {
      var seq = [16, 4, 8], i = 0, vis = true;
      new IntersectionObserver(function (e) { vis = e[0].isIntersecting; }).observe(document.body);
      setInterval(function () { if (vis) inst.set({ padding: seq[i++ % seq.length] }); }, 1600);
    }
  }).catch(function () {});
  Socle.onChange(function (p) { if (inst) inst.set(opts(p)); });
  Socle.onReplay(function () { if (inst) inst.replay(); });
</script>
</body>
</html>

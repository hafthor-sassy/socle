<!-- Rayons concentriques — HTML + CSS + JS, autonome. Nécessite tokens.css. Palette conseillée : <html data-accent="emeraude">.
     La règle tient en une ligne de CSS : rayon intérieur = max(rayon extérieur − marge, 0). Le script ne sert qu'à la loupe et aux réglages. -->
<link rel="stylesheet" href="tokens.css">

<!-- SECTION -->
<section class="rc" data-concentric data-mode="concentric" style="--rc-r: 24px; --rc-p: 8px" aria-labelledby="rc-title">
 <div class="rc__grid">
  <div class="rc__stage">
    <!-- Niveau 1 : le panneau -->
    <article class="rc-l rc-l--1" aria-label="Compte joint">
      <header class="rc-head">
        <span class="rc-brand">
          <svg class="rc-logo" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3.5c4.7 0 8.5 3.8 8.5 8.5s-3.8 8.5-8.5 8.5S3.5 16.7 3.5 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M12 7.25a4.75 4.75 0 1 1-4.75 4.75" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <circle cx="12" cy="12" r="1.75" fill="var(--accent)"/>
          </svg>
          Nacre
        </span>
        <span class="rc-chip">Compte joint</span>
      </header>
      <!-- Niveau 2 : la carte -->
      <div class="rc-l rc-l--2">
        <p class="rc-k">Solde disponible</p>
        <p class="rc-amount">4 218,60 €</p>
        <p class="rc-delta"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg>+ 312,00 € ce mois-ci</p>
        <!-- Niveau 3 : les actions -->
        <div class="rc-actions">
          <button class="rc-l rc-l--3 rc-btn rc-btn--solid" type="button">Virer</button>
          <button class="rc-l rc-l--3 rc-btn" type="button">Recevoir</button>
        </div>
      </div>
    </article>
  </div>

  <aside class="rc__side" aria-labelledby="rc-title">
    <div class="rc__side-head">
      <h3 class="rc__title" id="rc-title">Rayons concentriques</h3>
      <div class="rc-seg" role="radiogroup" aria-label="Calcul du rayon">
        <button type="button" role="radio" data-rc-mode="concentric">Concentrique</button>
        <button type="button" role="radio" data-rc-mode="same">Identique</button>
      </div>
    </div>
    <svg class="rc-loupe" viewBox="0 0 320 240" role="img" aria-labelledby="rc-loupe-desc" data-rc-loupe>
      <desc id="rc-loupe-desc">Coin supérieur gauche agrandi des trois niveaux</desc>
    </svg>
    <dl class="rc-legend" data-rc-legend></dl>
    <p class="rc-verdict" data-rc-verdict role="status"></p>
    <div class="rc-ranges">
      <label class="rc-range">
        <span class="rc-range__head"><span>Rayon du panneau</span><output data-rc-rout>24 px</output></span>
        <input type="range" min="8" max="40" step="4" value="24" data-rc-rad>
      </label>
      <label class="rc-range">
        <span class="rc-range__head"><span>Marge entre niveaux</span><output data-rc-out>8 px</output></span>
        <input type="range" min="4" max="24" step="4" value="8" data-rc-pad>
      </label>
    </div>
  </aside>
 </div>
</section>
<!-- /SECTION -->

<style>
  .rc {
    --rc-r: 24px; --rc-p: 8px;
    --rc-r2: max(calc(var(--rc-r) - var(--rc-p)), 0px);
    --rc-r3: max(calc(var(--rc-r) - var(--rc-p) * 2), 0px);
    --rc-ease: cubic-bezier(.34, 1.3, .64, 1);
    container-type: inline-size;
    background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius-sheet); overflow: hidden;
  }
  .rc__grid { display: grid; grid-template-columns: minmax(0, 1fr) 360px; }
  /* Mode « identique » : le défaut à éviter, même rayon partout */
  .rc[data-mode="same"] { --rc-r2: var(--rc-r); --rc-r3: var(--rc-r); }

  .rc__stage { display: grid; place-items: center; padding: 48px 32px; background: var(--raised);
    background-image: radial-gradient(color-mix(in srgb, var(--text-muted) 22%, transparent) 1px, transparent 1px); background-size: 16px 16px; }

  /* La règle : chaque niveau retire sa marge au rayon du parent */
  .rc-l { transition: border-radius 420ms var(--rc-ease), padding 420ms var(--rc-ease); }
  .rc-l--1 { width: min(100%, 440px); padding: var(--rc-p); border-radius: var(--rc-r); background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow-popover); }
  .rc-l--2 { padding: calc(var(--rc-p) + 12px) calc(var(--rc-p) + 12px) var(--rc-p); border-radius: var(--rc-r2); background: var(--raised); }
  .rc-l--3 { border-radius: var(--rc-r3); }

  .rc-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 12px 16px; }
  .rc-brand { display: inline-flex; align-items: center; gap: 8px; color: var(--text-strong); font: 650 17px/24px var(--font-sans); letter-spacing: -0.02em; }
  .rc-logo { width: 24px; height: 24px; }
  .rc-chip { padding: 4px 10px; border-radius: var(--radius-pill); background: var(--accent-subtle); color: var(--text-strong); font: 500 12px/16px var(--font-sans); }
  .rc-k { margin: 0; color: var(--text-muted); font: 500 14px/20px var(--font-sans); }
  .rc-amount { margin: 4px 0 0; color: var(--text-strong); font: 600 40px/48px var(--font-sans); letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
  .rc-delta { margin: 4px 0 20px; display: inline-flex; align-items: center; gap: 4px; color: var(--up); font: 500 14px/20px var(--font-sans); }
  .rc-actions { display: grid; grid-template-columns: 1fr 1fr; gap: var(--rc-p); transition: gap 420ms var(--rc-ease); }
  .rc-btn { min-height: 48px; border: 1px solid var(--border); background: var(--surface); color: var(--text-strong); font: 500 16px/1 var(--font-sans); cursor: pointer; transition: border-radius 420ms var(--rc-ease), background-color var(--motion-base) var(--ease-out), scale 200ms var(--rc-ease); }
  .rc-btn--solid { background: var(--accent); color: var(--accent-fg); border-color: transparent; }
  .rc-btn:active { scale: .97; }
  .rc-btn:focus-visible, .rc-seg button:focus-visible { outline: var(--focus-width) solid var(--focus-ring); outline-offset: var(--focus-offset); }

  /* Panneau d'explication */
  .rc__side { display: grid; align-content: start; gap: 16px; padding: 24px; border-left: 1px solid var(--border); }
  .rc__side-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .rc__title { margin: 0; color: var(--text-strong); font: 600 16px/24px var(--font-sans); }
  .rc-seg { display: inline-flex; padding: 2px; border-radius: var(--radius-pill); background: var(--raised); border: 1px solid var(--border); }
  .rc-seg button { min-height: 36px; padding: 0 12px; border: 0; border-radius: var(--radius-pill); background: none; color: var(--text-muted); font: 500 13px/1 var(--font-sans); cursor: pointer; }
  .rc-seg button[aria-checked="true"] { background: var(--surface); color: var(--text-strong); box-shadow: var(--shadow-overlay); }

  .rc-loupe { display: block; width: 100%; height: auto; border-radius: var(--radius-card); background: var(--raised); border: 1px solid var(--border); }
  .rc-loupe .g { stroke: var(--border); stroke-width: 1; }
  .rc-loupe .a1 { stroke: var(--text-strong); }
  .rc-loupe .a2 { stroke: var(--accent); }
  .rc-loupe .a3 { stroke: var(--text-muted); }
  .rc-loupe .arc { fill: none; stroke-width: 2; stroke-linecap: round; }
  .rc-loupe .band1 { fill: color-mix(in srgb, var(--accent) 16%, transparent); }
  .rc-loupe .band2 { fill: color-mix(in srgb, var(--accent) 7%, transparent); }
  .rc-loupe .ray { stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
  .rc-loupe .ctr { stroke: var(--raised); stroke-width: 2; }
  .rc-loupe text { font: 500 11px var(--font-mono); fill: var(--text-muted); }
  .rc-loupe .lbl { fill: var(--text-strong); }
  .rc-loupe .zoom { fill: var(--text-muted); letter-spacing: .04em; }

  .rc-legend { margin: 0; display: grid; gap: 8px; }
  .rc-legend div { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .rc-legend i { width: 12px; height: 3px; border-radius: 2px; }
  .rc-legend dt { display: inline-flex; align-items: center; gap: 8px; color: var(--text); font: 500 14px/20px var(--font-sans); }
  .rc-legend dd { margin: 0; color: var(--text-strong); font: 500 13px/20px var(--font-mono); font-variant-numeric: tabular-nums; }
  .rc-verdict { margin: 0; padding: 12px; border-radius: var(--radius-ctl); font: 500 14px/20px var(--font-sans); background: var(--tint-green-bg); color: var(--tint-green-fg); border: 1px solid var(--tint-green-border); }
  .rc-verdict[data-tone="warn"] { background: var(--tint-amber-bg); color: var(--tint-amber-fg); border-color: var(--tint-amber-border); }

  .rc-ranges { display: grid; gap: 4px; }
  .rc-range { display: grid; gap: 0; }
  .rc-range__head { display: flex; justify-content: space-between; color: var(--text-strong); font: 500 14px/20px var(--font-sans); }
  .rc-range output { font: 500 13px/20px var(--font-mono); }
  .rc-range input { width: 100%; height: 44px; margin: 0; accent-color: var(--accent); cursor: pointer; }

  @container (max-width: 760px) {
    .rc__grid { grid-template-columns: 1fr; }
    .rc__stage { padding: 32px 16px; }
    .rc__side { border-left: 0; border-top: 1px solid var(--border); padding: 20px 16px; }
    .rc-amount { font-size: 36px; line-height: 40px; }
  }
  @media (prefers-reduced-motion: reduce) { .rc-l, .rc-btn, .rc-actions { transition: none; } }
</style>

<script>
/* Rayons concentriques : loupe du coin et réglages. API : Concentric.mount(el, { radius, padding, mode }) → { set(options) } */
(function () {
  var S2 = Math.SQRT1_2;
  function mount(root, opts) {
    var cs = getComputedStyle(root);
    var o = Object.assign({ radius: parseFloat(cs.getPropertyValue('--rc-r')) || 24, padding: parseFloat(cs.getPropertyValue('--rc-p')) || 8, mode: root.dataset.mode || 'concentric', loupe: true }, opts || {});
    var svg = root.querySelector('[data-rc-loupe]'), legend = root.querySelector('[data-rc-legend]'), verdict = root.querySelector('[data-rc-verdict]');
    var pad = root.querySelector('[data-rc-pad]'), out = root.querySelector('[data-rc-out]'), rad = root.querySelector('[data-rc-rad]'), rout = root.querySelector('[data-rc-rout]'), segs = root.querySelectorAll('[data-rc-mode]');
    var shown = null, raf = 0, reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

    function radii(R, P, mode) { return mode === 'same' ? [R, R, R] : [R, Math.max(R - P, 0), Math.max(R - 2 * P, 0)]; }
    function f1(n) { return (Math.round(n * 10) / 10).toString().replace('.', ','); }
    var PX = '\u00a0px';

    function draw(st) {
      var R = st.R, P = st.P, r = st.r, W = Math.max(R, 2 * P + r[2]) + 2 * P + 28, s = 210 / W, ox = 40, oy = 15;
      function X(v) { return (ox + v * s).toFixed(2); } function Y(v) { return (oy + v * s).toFixed(2); }
      function corner(k) { var o = k * P, rk = r[k]; return { o: o, rk: rk, d: 'M' + X(o) + ' ' + Y(W) + 'V' + Y(o + rk) + (rk > 0 ? 'A' + (rk * s).toFixed(2) + ' ' + (rk * s).toFixed(2) + ' 0 0 1 ' + X(o + rk) + ' ' + Y(o) : '') + 'H' + X(W) }; }
      function band(a, b) {
        var A = corner(a), B = corner(b);
        return A.d + 'V' + Y(B.o) + 'H' + X(B.o + B.rk) + (B.rk > 0 ? 'A' + (B.rk * s).toFixed(2) + ' ' + (B.rk * s).toFixed(2) + ' 0 0 0 ' + X(B.o) + ' ' + Y(B.o + B.rk) : '') + 'V' + Y(W) + 'Z';
      }
      var h = '<desc id="rc-loupe-desc">' + svg.querySelector('desc').textContent + '</desc>';
      for (var g = 0; g <= W; g += 8) h += '<path class="g" d="M' + X(g) + ' ' + Y(0) + 'V' + Y(W) + 'M' + X(0) + ' ' + Y(g) + 'H' + X(W) + '"/>';
      h += '<path class="band1" d="' + band(0, 1) + '"/><path class="band2" d="' + band(1, 2) + '"/>';
      var cls = ['a1', 'a2', 'a3'];
      for (var k = 0; k < 3; k++) {
        var c = corner(k);
        h += '<path class="arc ' + cls[k] + '" d="' + c.d + '"/>';
        h += '<text x="' + (+X(W) + 8) + '" y="' + (+Y(c.o) + 4) + '">r ' + Math.round(c.rk) + '</text>';
        if (c.rk > 0) {
          var cx = c.o + c.rk, cy = c.o + c.rk;
          h += '<path class="ray ' + cls[k] + '" d="M' + X(cx) + ' ' + Y(cy) + 'L' + X(cx - c.rk * S2) + ' ' + Y(cy - c.rk * S2) + '"/>';
          h += '<circle class="ctr" cx="' + X(cx) + '" cy="' + Y(cy) + '" r="4" style="fill:var(' + ['--text-strong', '--accent', '--text-muted'][k] + ')"/>';
        }
      }
      // épaisseur au coin, mesurée sur la diagonale
      var dg = (P + (r[1] - R) * (1 - S2)) * Math.SQRT2, p0 = R * (1 - S2), p1 = p0 + dg * S2;
      h += '<path class="ray a2" style="stroke-dasharray:none;stroke-width:1.5" d="M' + X(p0) + ' ' + Y(p0) + 'L' + X(p1) + ' ' + Y(p1) + '"/>';
      h += '<text class="lbl" x="' + (+X(p1) + 12) + '" y="' + (+Y(p1) + 18) + '">' + f1(dg) + PX + '</text>';
      h += '<text class="zoom" x="300" y="228" text-anchor="end">×' + f1(s) + '</text>';
      svg.innerHTML = h;
      return dg;
    }
    function legendHTML(st) {
      var rows = [['Panneau', 'var(--text-strong)', st.R + PX],
        ['Carte', 'var(--accent)', st.mode === 'same' ? st.R + PX : st.R + ' − ' + st.P + (st.R - st.P < 0 ? ' → ' : ' = ') + st.r[1] + PX],
        ['Boutons', 'var(--text-muted)', st.mode === 'same' ? st.R + PX : st.r[1] + ' − ' + st.P + (st.r[1] - st.P < 0 ? ' → ' : ' = ') + st.r[2] + PX]];
      legend.innerHTML = rows.map(function (q) { return '<div><dt><i style="background:' + q[1] + '"></i>' + q[0] + '</dt><dd>' + q[2] + '</dd></div>'; }).join('');
    }
    function target() { return { R: o.radius, P: o.padding, r: radii(o.radius, o.padding, o.mode), mode: o.mode }; }
    function render() {
      var t = target();
      root.style.setProperty('--rc-r', o.radius + 'px');
      root.style.setProperty('--rc-p', o.padding + 'px');
      root.dataset.mode = o.mode;
      segs.forEach(function (b) { var on = b.dataset.rcMode === o.mode; b.setAttribute('aria-checked', String(on)); b.tabIndex = on ? 0 : -1; });
      pad.value = o.padding; out.textContent = o.padding + '\u00a0px'; rad.value = o.radius; rout.textContent = o.radius + '\u00a0px';
      legendHTML(t);
      // la loupe interpole vers la nouvelle géométrie (420 ms, même courbe que le CSS)
      var from = shown || t, start = performance.now();
      cancelAnimationFrame(raf);
      (function step(now) {
        var k = reduce || !shown ? 1 : Math.min(1, (now - start) / 420), e = 1 - Math.pow(1 - k, 3);
        var cur = { R: from.R + (t.R - from.R) * e, P: from.P + (t.P - from.P) * e, r: t.r.map(function (v, i) { return from.r[i] + (v - from.r[i]) * e; }) };
        var dg = draw(cur); shown = cur;
        if (k < 1) raf = requestAnimationFrame(step);
        else verdictText(t, dg);
      })(performance.now());
    }
    function verdictText(t, dg) {
      var tone = 'ok', msg;
      if (t.mode === 'same') { tone = 'warn'; msg = 'Même rayon partout : la marge passe de ' + t.P + PX + ' sur les bords à ' + f1(dg) + PX + ' dans le coin, qui paraît gonflé.'; }
      else if (t.R - 2 * t.P <= 0) { tone = 'warn'; msg = 'La marge dépasse la moitié du rayon : les boutons perdent leur arrondi. Réduisez la marge ou augmentez le rayon.'; }
      else msg = 'Coins concentriques : la marge reste à ' + t.P + PX + ' tout autour, coin compris.';
      verdict.dataset.tone = tone; verdict.textContent = msg;
    }
    pad.addEventListener('input', function () { set({ padding: +pad.value }, true); });
    rad.addEventListener('input', function () { set({ radius: +rad.value }, true); });
    segs.forEach(function (b, i) {
      b.addEventListener('click', function () { set({ mode: b.dataset.rcMode }, true); });
      b.addEventListener('keydown', function (e) {
        var d = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0; if (!d) return;
        e.preventDefault(); var n = segs[(i + d + segs.length) % segs.length]; set({ mode: n.dataset.rcMode }, true); n.focus();
      });
    });
    function set(next, fromUser) { Object.assign(o, next || {}); render(); if (fromUser) root.dispatchEvent(new CustomEvent('concentricchange', { detail: { radius: o.radius, padding: o.padding, mode: o.mode } })); }
    render();
    return { set: set, replay: function () { var m = o.mode; set({ mode: m === 'same' ? 'concentric' : 'same' }); setTimeout(function () { set({ mode: m }); }, 700); } };
  }
  window.Concentric = { mount: mount };
  document.querySelectorAll('[data-concentric]:not([data-rc-manual])').forEach(function (el) { el._rc = mount(el); });
})();
</script>

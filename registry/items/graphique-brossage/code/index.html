<!-- Graphique à brossage — HTML + CSS + JS, sans dépendance. Nécessite tokens.css.
     Données : remplacez demoData() par vos lignes { date: 'AAAA-MM-JJ', calls, transfers, duration } via el.brushChart.setData(rows, notes).
     Événement : la section émet « brushchange » (detail : from, to, days, totals) à chaque nouvelle période. -->
<link rel="stylesheet" href="tokens.css">

<!-- SECTION -->
<section class="bc" data-brush-chart data-state="ready" data-range="30" data-days="180" data-color="chart-1" data-style="area" data-smooth="true" data-compare="true" data-annotations="true" data-duration="700" aria-labelledby="bc-title">
  <header class="bc__head">
    <div class="bc__titles">
      <p class="bc__eyebrow">Ondine · Standard vocal IA</p>
      <h2 class="bc__title" id="bc-title">Appels traités par vos agents</h2>
      <p class="bc__period" data-bc-period>&nbsp;</p>
    </div>
    <div class="bc__seg" role="group" aria-label="Raccourcis de période">
      <span class="bc__seg-ind" aria-hidden="true"></span>
      <button type="button" data-bc-range="7" aria-pressed="false"><span>7 j</span></button>
      <button type="button" data-bc-range="30" aria-pressed="false"><span>30 j</span></button>
      <button type="button" data-bc-range="90" aria-pressed="false"><span>90 j</span></button>
      <button type="button" data-bc-range="all" aria-pressed="false"><span>Tout</span></button>
    </div>
  </header>

  <dl class="bc__kpis">
    <div class="bc__kpi" data-kpi="calls"><dt>Appels traités</dt><dd><span class="bc__num" data-bc-num></span><span class="bc__delta" data-bc-delta></span></dd></div>
    <div class="bc__kpi" data-kpi="resolved"><dt>Résolus par l’IA</dt><dd><span class="bc__num" data-bc-num></span><span class="bc__delta" data-bc-delta></span></dd></div>
    <div class="bc__kpi" data-kpi="duration"><dt>Durée moyenne</dt><dd><span class="bc__num" data-bc-num></span><span class="bc__delta" data-bc-delta></span></dd></div>
    <div class="bc__kpi" data-kpi="transfers"><dt>Transférés à un humain</dt><dd><span class="bc__num" data-bc-num></span><span class="bc__delta" data-bc-delta></span></dd></div>
  </dl>

  <div class="bc__chart">
    <div class="bc__legend" aria-hidden="true">
      <span class="bc__key bc__key--main">Appels traités</span>
      <span class="bc__key bc__key--alt">Transférés à un humain</span>
    </div>
    <div class="bc__plot" data-bc-plot tabindex="0" role="group" aria-roledescription="graphique" aria-label="Appels traités par jour. Flèches gauche et droite pour lire chaque jour." aria-describedby="bc-help">
      <svg class="bc__svg" data-bc-svg aria-hidden="true"></svg>
      <div class="bc__overlay" data-bc-overlay aria-hidden="true">
        <span class="bc__cursor" data-bc-cursor></span>
        <span class="bc__dot bc__dot--alt" data-bc-dot2></span>
        <span class="bc__dot" data-bc-dot></span>
        <div class="bc__tip" data-bc-tip></div>
      </div>
      <div class="bc__skel" aria-hidden="true"><svg viewBox="0 0 400 100" preserveAspectRatio="none"><path d="M0 72 C40 60 60 78 100 62 S160 40 200 52 S270 70 300 44 S370 30 400 38 V100 H0Z"/></svg></div>
      <div class="bc__msg" data-bc-msg>
        <span class="bc__msg-icon" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16M7 16v-4M12 16V7M17 16V9"/></svg></span>
        <p class="bc__msg-title" data-bc-msg-title></p>
        <p class="bc__msg-text" data-bc-msg-text></p>
        <button class="bc__btn" type="button" data-bc-retry>Réessayer</button>
      </div>
    </div>
    <div class="bc__nav" data-bc-nav>
      <svg class="bc__mini" data-bc-mini aria-hidden="true"></svg>
      <span class="bc__mcursor" data-bc-mcursor aria-hidden="true"></span>
      <div class="bc__win" data-bc-win role="slider" tabindex="0" aria-label="Période affichée, flèches pour la déplacer, haut et bas pour zoomer"></div>
      <span class="bc__handle" data-bc-handle="start" role="slider" tabindex="0" aria-label="Début de la période"></span>
      <span class="bc__handle" data-bc-handle="end" role="slider" tabindex="0" aria-label="Fin de la période"></span>
    </div>
    <p class="bc__help" id="bc-help">Glissez sur la frise pour choisir une période · double-clic pour revenir à la vue par défaut</p>
  </div>
  <p class="bc__sr" aria-live="polite" data-bc-live></p>
</section>
<!-- /SECTION -->

<style>
  .bc {
    --bc-c: var(--chart-1);

    --bc-ml: 44px;
    --bc-mr: 8px;
    --bc-h: 300px;
    --bc-spring: cubic-bezier(.34, 1.36, .64, 1);
    --bc-out: cubic-bezier(.16, 1, .3, 1);
    position: relative;
    display: grid;
    gap: 24px;
    width: 100%;
    max-width: 1120px;
    margin-inline: auto;
    padding: 24px 16px 16px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sheet);
    background: var(--surface);
    color: var(--text);
    font-family: var(--font-sans);
    -webkit-tap-highlight-color: transparent;
  }
  .bc[data-color="accent"] { --bc-c: var(--accent-vivid); }
  .bc[data-color="chart-3"] { --bc-c: var(--chart-3); }
  .bc[data-color="chart-4"] { --bc-c: var(--chart-4); }
  .bc[data-color="chart-5"] { --bc-c: var(--chart-5); }
  .bc *, .bc *::before, .bc *::after { box-sizing: border-box; }

  /* En-tête */

  .bc__period { margin-top: 4px; font: 400 14px/20px var(--font-sans); color: var(--text-muted); font-variant-numeric: tabular-nums; }

  /* Raccourcis : indicateur glissant à ressort */
  .bc__seg { position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; align-self: start; padding: 4px; border-radius: var(--radius-pill); background: var(--raised); border: 1px solid var(--border); isolation: isolate; }
  .bc__seg button { position: relative; z-index: 1; min-width: 56px; height: 36px; padding: 0 16px; border: 0; border-radius: var(--radius-pill); background: none; color: var(--text-muted); font: 500 14px/1 var(--font-sans); font-variant-numeric: tabular-nums; cursor: pointer; transition: color var(--motion-base) var(--ease-out); touch-action: manipulation; }

  .dark .bc__seg-ind { background: var(--tint-neutral-bg); border-color: var(--tint-neutral-border); }

  /* KPI */
  .bc__kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
  .bc__kpi { display: grid; gap: 8px; align-content: start; padding: 16px 0 16px 16px; }
  .bc__kpi:nth-child(odd) { padding-left: 0; border-right: 1px solid var(--border); }
  .bc__kpi:nth-child(n+3) { border-top: 1px solid var(--border); }
  .bc__kpi dt { font: 500 13px/18px var(--font-sans); color: var(--text-muted); }

  .bc__num small { font-size: .6em; font-weight: 500; letter-spacing: 0; color: var(--text-muted); margin-left: .12em; }
  .bc__roll { display: inline-block; height: 1.2em; overflow: hidden; vertical-align: top; -webkit-mask-image: linear-gradient(transparent, #000 12%, #000 88%, transparent); mask-image: linear-gradient(transparent, #000 12%, #000 88%, transparent); }
  .bc__strip { display: flex; flex-direction: column; transition: transform 760ms var(--bc-out); will-change: transform; }
  .bc__strip > span { display: block; height: 1.2em; line-height: 1.2em; text-align: center; }
  .bc__ch { display: inline-block; white-space: pre; }
  .bc__sr, .bc .sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  .bc__delta { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 8px; border-radius: var(--radius-pill); font: 500 12px/1 var(--font-sans); font-variant-numeric: tabular-nums; white-space: nowrap; background: var(--tint-neutral-bg); color: var(--tint-neutral-fg); transition: background-color var(--motion-slow) var(--ease-out), color var(--motion-slow) var(--ease-out); }
  .bc__delta[data-tone="good"] { background: var(--tint-green-bg); color: var(--tint-green-fg); }
  .bc__delta[data-tone="bad"] { background: var(--tint-red-bg); color: var(--tint-red-fg); }
  .bc__delta svg { flex: none; transition: rotate var(--motion-slow) var(--bc-spring); }
  .bc__delta[data-dir="down"] svg { rotate: 180deg; }
  .bc__delta[data-dir="flat"] svg { rotate: 90deg; }

  /* Graphique */
  .bc__chart { position: relative; display: grid; gap: 12px; min-width: 0; }

  .bc__key { display: inline-flex; align-items: center; gap: 8px; }

  .bc__plot:focus-visible { box-shadow: 0 0 0 var(--focus-width) var(--focus-ring); }
  .bc__svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .bc__grid line { stroke: var(--chart-grid); stroke-width: 1; shape-rendering: crispEdges; }

  .bc__area { fill: var(--bc-c); fill-opacity: .12; }
  .dark .bc__area { fill-opacity: .16; }
  .bc[data-style="line"] .bc__area { display: none; }
  .bc__line { fill: none; stroke: var(--bc-c); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .dark .bc__line { filter: drop-shadow(0 0 6px color-mix(in srgb, var(--bc-c) 45%, transparent)); }
  .bc__alt { fill: none; stroke: var(--bc-alt); stroke-width: 1.5; stroke-dasharray: 4 4; stroke-linejoin: round; }
  .bc[data-compare="false"] .bc__alt, .bc[data-compare="false"] .bc__dot--alt { display: none; }
  .bc__pts circle { fill: var(--surface); stroke: var(--bc-c); stroke-width: 2; }
  .bc__note-line { stroke: var(--border-control); stroke-width: 1; stroke-dasharray: 2 3; }

  .bc__overlay { position: absolute; inset: 0; pointer-events: none; }
  .bc__cursor { position: absolute; left: 0; top: 32px; bottom: 28px; width: 1px; background: var(--border-control); opacity: 0; transition: opacity var(--motion-fast) var(--ease-out); }
  .bc__dot { position: absolute; left: -6px; top: -6px; width: 12px; height: 12px; border-radius: 50%; background: var(--bc-c); border: 2px solid var(--surface); box-shadow: 0 0 0 5px color-mix(in srgb, var(--bc-c) 18%, transparent); opacity: 0; transition: opacity var(--motion-fast) var(--ease-out); }
  .bc__dot--alt { left: -5px; top: -5px; width: 10px; height: 10px; background: var(--surface); border-color: var(--bc-alt); box-shadow: none; }
  .bc__tip { position: absolute; left: 0; top: 0; min-width: 208px; padding: 12px; border-radius: var(--radius-card); background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow-popover); opacity: 0; transform: translate3d(0, 0, 0) scale(.96); transform-origin: left center; transition: opacity var(--motion-fast) var(--ease-out), scale var(--motion-base) var(--bc-spring); font: 400 13px/18px var(--font-sans); color: var(--text); font-variant-numeric: tabular-nums; }
  .dark .bc__tip { background: var(--raised); }
  .bc__tip-date { margin-bottom: 8px; font: 500 12px/16px var(--font-mono); color: var(--text-muted); }
  .bc__tip-date::first-letter { text-transform: uppercase; }
  .bc__tip-row { display: grid; grid-template-columns: 12px 1fr auto; align-items: center; gap: 8px; }
  .bc__tip-row + .bc__tip-row { margin-top: 4px; }
  .bc__tip-row i { width: 12px; height: 0; border-top: 2px solid var(--bc-c); }
  .bc__tip-row i.alt { border-top-style: dashed; border-color: var(--bc-alt); }
  .bc__tip-row i.none { border: 0; }
  .bc__tip-row b { font-weight: 600; color: var(--text-strong); }
  .bc__tip-note { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); color: var(--text-muted); }
  .bc.is-hover .bc__cursor, .bc.is-hover .bc__dot, .bc.is-hover .bc__tip { opacity: 1; }
  .bc.is-hover .bc__tip { scale: 1; }

  .bc__chip { position: absolute; top: 4px; left: 0; height: 24px; padding: 0 8px; display: inline-flex; align-items: center; gap: 6px; border-radius: var(--radius-pill); background: var(--raised); border: 1px solid var(--border); font: 500 12px/1 var(--font-sans); color: var(--text-muted); white-space: nowrap; transition: opacity var(--motion-base) var(--ease-out); }
  .bc__chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--bc-c); }
  .bc[data-annotations="false"] .bc__chip, .bc[data-annotations="false"] .bc__notes { display: none; }

  /* Frise de navigation */
  .bc__nav { position: relative; height: 56px; margin-left: calc(var(--bc-ml) - 8px); margin-right: calc(var(--bc-mr) - 8px); touch-action: none; user-select: none; -webkit-user-select: none; cursor: crosshair; }
  .bc__mini { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; border-radius: var(--radius-ctl); }
  .bc__mini-bg { fill: var(--raised); }
  .bc__mini-area { fill: var(--chart-muted); fill-opacity: .16; }
  .bc__mini-line { fill: none; stroke: var(--chart-muted); stroke-width: 1.25; opacity: .7; }
  .bc__mini-hl .bc__mini-area { fill: var(--bc-c); fill-opacity: .22; }
  .bc__mini-hl .bc__mini-line { stroke: var(--bc-c); opacity: 1; }
  .bc__month line { stroke: var(--border); }
  .bc__month text { font: 500 12px/1 var(--font-mono); fill: var(--text-muted); }
  .bc__mnote { fill: var(--bc-c); }
  .bc__mcursor { position: absolute; top: 0; bottom: 0; left: 0; width: 1px; background: var(--text-muted); opacity: 0; transition: opacity var(--motion-fast) var(--ease-out); pointer-events: none; }
  .bc.is-hover .bc__mcursor { opacity: .7; }
  .bc__win { position: absolute; top: 0; bottom: 0; left: 0; width: 0; border-radius: var(--radius-ctl); border: 1px solid var(--border-control); background: color-mix(in srgb, var(--bc-c) 6%, transparent); cursor: grab; outline: none; transition: border-color var(--motion-fast) var(--ease-out); }

  .bc.is-dragging .bc__win { cursor: grabbing; }
  .bc__handle { position: absolute; top: 50%; left: 0; width: 44px; height: 56px; margin: -28px 0 0 -22px; display: grid; place-items: center; cursor: ew-resize; outline: none; z-index: 1; }
  .bc__handle::before { content: ""; width: 10px; height: 28px; border-radius: var(--radius-pill); background: var(--surface); border: 1px solid var(--border-control); box-shadow: var(--shadow-overlay); transition: scale var(--motion-base) var(--bc-spring), background-color var(--motion-fast) var(--ease-out); }
  .bc__handle::after { content: ""; position: absolute; width: 2px; height: 10px; border-radius: 2px; background: var(--text-muted); }
  .bc__handle:hover::before, .bc__handle.is-active::before { scale: 1.12 1.1; }
  .bc__handle:focus-visible::before { outline: var(--focus-width) solid var(--focus-ring); outline-offset: 2px; }
  .bc__help { font: 400 12px/16px var(--font-sans); color: var(--text-muted); text-align: center; }

  /* États */
  .bc__skel, .bc__msg { position: absolute; inset: 32px 8px 28px var(--bc-ml); display: none; }
  .bc__skel svg { width: 100%; height: 100%; }
  .bc__skel path { fill: var(--raised); }
  .bc__msg { place-content: center; justify-items: center; gap: 8px; text-align: center; padding: 16px; }
  .bc__msg-icon { display: grid; place-items: center; width: 40px; height: 40px; margin-bottom: 4px; border-radius: 50%; background: var(--raised); color: var(--text-muted); }
  .bc__msg-title { font: 600 16px/24px var(--font-sans); color: var(--text-strong); }
  .bc__msg-text { max-width: 40ch; font: 400 14px/20px var(--font-sans); color: var(--text-muted); }
  .bc__btn { margin-top: 8px; height: 44px; padding: 0 20px; border-radius: var(--radius-pill); border: 1px solid var(--border-control); background: var(--surface); color: var(--text-strong); font: 500 14px/1 var(--font-sans); cursor: pointer; }
  .bc__btn:hover { background: var(--raised); }
  .bc__btn:focus-visible { outline: var(--focus-width) solid var(--focus-ring); outline-offset: var(--focus-offset); }
  .bc:not([data-state="ready"]) .bc__svg, .bc:not([data-state="ready"]) .bc__overlay, .bc:not([data-state="ready"]) .bc__nav > *, .bc:not([data-state="ready"]) .bc__help { visibility: hidden; }
  .bc:not([data-state="ready"]) .bc__nav { background: var(--raised); border-radius: var(--radius-ctl); }
  .bc:not([data-state="ready"]) .bc__seg { opacity: .5; pointer-events: none; }
  .bc[data-state="loading"] .bc__skel { display: block; }
  .bc[data-state="loading"] .bc__skel, .bc[data-state="loading"] .bc__nav, .bc[data-state="loading"] .bc__num { animation: bc-pulse 1.4s var(--ease-out) infinite alternate; }
  .bc[data-state="loading"] .bc__num { width: 96px; border-radius: var(--radius-ctl); background: var(--raised); color: transparent; }
  .bc[data-state="loading"] .bc__num > *, .bc[data-state="loading"] .bc__delta, .bc[data-state="loading"] .bc__period { visibility: hidden; }
  .bc[data-state="empty"] .bc__msg, .bc[data-state="error"] .bc__msg { display: grid; }
  .bc[data-state="empty"] .bc__btn { display: none; }
  @keyframes bc-pulse { from { opacity: 1; } to { opacity: .45; } }

  /* Mise en page pilotée par la largeur du composant (container queries), pas par l’écran */
  .bc { container: bc / inline-size; }
  @media (min-width: 720px) { .bc { padding: 32px 32px 24px; gap: 32px; } }
  @container bc (min-width: 600px) {
    .bc__head { grid-template-columns: 1fr auto; align-items: end; }
    .bc__chart { gap: 16px; }
    .bc__plot { height: 300px; }
  }
  @container bc (min-width: 880px) {
    .bc__kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .bc__kpi { padding: 20px 20px 20px 24px; border-top: 0 !important; }
    .bc__kpi:nth-child(odd) { padding-left: 24px; border-right: 0; }
    .bc__kpi:first-child { padding-left: 0; }
    .bc__kpi + .bc__kpi { border-left: 1px solid var(--border); }
  }
  @container bc (max-width: 599px) {
    .bc__plot { height: 232px; }
    .bc__seg button { height: 44px; min-width: 0; padding: 0 8px; }
    .bc__tip { min-width: 184px; }
    .bc__kpi dd { flex-direction: column; align-items: flex-start; }
  }
  @media (pointer: coarse) { .bc__help { display: none; } }
  @media (prefers-reduced-motion: reduce) {
    .bc__strip, .bc__seg-ind, .bc__tip, .bc__delta svg, .bc__handle::before { transition: none !important; }
    .bc[data-state="loading"] .bc__skel, .bc[data-state="loading"] .bc__nav, .bc[data-state="loading"] .bc__num { animation: none; }
  }
</style>

      root.dispatchEvent(new CustomEvent('brushchange', { detail: { from: new Date(rows[s].t), to: new Date(rows[e].t), days: len, totals: A } }));
    }
    function period() {
      if (opt.state !== 'ready') return;
      var s = Math.round(tgt.a), e = Math.round(tgt.b), len = e - s + 1, a = rows[s].t, b = rows[e].t;
      var sameY = new Date(a).getUTCFullYear() === new Date(b).getUTCFullYear();
      var txt = fdate(a, sameY ? { day: 'numeric', month: 'short' } : { day: 'numeric', month: 'short', year: 'numeric' }) + ' – ' + fdate(b, { day: 'numeric', month: 'short', year: 'numeric' }) + ' · ' + len + '\u00a0jours';
      if (s - len >= 0) txt += ' · vs\u00a0' + len + '\u00a0jours précédents';
      $('[data-bc-period]').textContent = txt;
      /* indicateur des raccourcis */
      var match = null;
      seg.querySelectorAll('[data-bc-range]').forEach(function (b) {
        var r = b.dataset.bcRange, ok = e === n - 1 && (r === 'all' ? s === 0 : len === Math.min(n, parseInt(r, 10)));
        if (ok && !match) match = b; b.setAttribute('aria-pressed', 'false');
      });

    }
    function aria(s, e) {

    }

    /* ——— Pointeur : frise (déplacer, redimensionner, tracer) ——— */
    function navIdx(e) { var r = nav.getBoundingClientRect(); return clamp((e.clientX - r.left) / (r.width || 1) * (n - 1), 0, n - 1); }
    function onDown(e) {
      if (opt.state !== 'ready' || (e.button && e.button !== 0)) return;
      var i = navIdx(e), t = e.target, mode = t === hS ? 'start' : t === hE ? 'end' : t === win ? 'move' : 'new';
      drag = { mode: mode, i0: i, a0: tgt.a, b0: tgt.b, x0: e.clientX, moved: false, el: t };
      if (t.classList.contains('bc__handle')) t.classList.add('is-active');
      root.classList.add('is-dragging');
      nav.setPointerCapture(e.pointerId);
      e.preventDefault();
    }
    function onMove(e) {
      if (!drag) { if (e.pointerType !== 'touch' && opt.state === 'ready') setHover(navIdx(e)); return; }
      var i = navIdx(e); if (Math.abs(e.clientX - drag.x0) > 3) drag.moved = true;
      if (!drag.moved) return;
      var len = drag.b0 - drag.a0;
      if (drag.mode === 'move') { var a = clamp(drag.a0 + (i - drag.i0), 0, n - 1 - len); go(a, a + len, 'drag'); }
      else if (drag.mode === 'start') go(Math.min(i, drag.b0 - 2), drag.b0, 'drag');
      else if (drag.mode === 'end') { var b = Math.max(i, drag.a0 + 2); tgt.a = drag.a0; go(drag.a0, b, 'drag'); }
      else { var lo = Math.min(i, drag.i0), hi = Math.max(i, drag.i0); if (hi - lo < 2) { if (i < drag.i0) lo = hi - 2; else hi = lo + 2; } go(clamp(lo, 0, n - 3), clamp(hi, 2, n - 1), 'drag'); }
      setHover(null);
    }
    function onUp(e) {
      if (!drag) return;
      var d = drag; drag = null;
      root.classList.remove('is-dragging');
      if (d.el.classList) d.el.classList.remove('is-active');
      if (!d.moved && d.mode === 'new') { var len = d.b0 - d.a0, a = clamp(Math.round(d.i0 - len / 2), 0, n - 1 - len); go(a, a + len); return; }
      var A = Math.round(tgt.a), B = Math.round(tgt.b);
      go(A, Math.max(A + 2, B));
    }
    nav.addEventListener('pointerdown', onDown);
    nav.addEventListener('pointermove', onMove);
    nav.addEventListener('pointerup', onUp);
    nav.addEventListener('pointercancel', onUp);
    nav.addEventListener('pointerleave', function () { if (!drag) setHover(null); });
    nav.addEventListener('dblclick', function () { setRange(opt.range); });

    /* ——— Pointeur : graphe principal (lecture au survol, au doigt) ——— */
    function plotIdx(e) { var r = plot.getBoundingClientRect(), px = e.clientX - r.left - M.l; if (px < -12 || px > w + 12) return null; return cur.a + clamp(px / w, 0, 1) * (cur.b - cur.a); }
    plot.addEventListener('pointermove', function (e) { if (opt.state === 'ready') setHover(plotIdx(e)); });
    plot.addEventListener('pointerdown', function (e) { if (opt.state === 'ready') setHover(plotIdx(e)); });
    plot.addEventListener('pointerleave', function (e) { if (e.pointerType !== 'touch') setHover(null); });

    /* ——— Clavier ——— */
    plot.addEventListener('keydown', function (e) {
      if (opt.state !== 'ready') return;
      var s = Math.round(tgt.a), en = Math.round(tgt.b), i = hover == null ? en : hover, k = e.key, st = e.shiftKey ? 7 : 1;
      if (k === 'ArrowLeft') i -= st; else if (k === 'ArrowRight') i += st; else if (k === 'Home') i = s; else if (k === 'End') i = en;
      else if (k === 'Escape') { setHover(null); return; } else return;
      e.preventDefault();
      i = clamp(i, 0, n - 1);
      if (i < s) go(i, i + (en - s)); else if (i > en) go(i - (en - s), i);
      setHover(i, true);
    });
    plot.addEventListener('blur', function () { setHover(null); });
    function keyNav(e, part) {
      if (opt.state !== 'ready') return;
      var s = Math.round(tgt.a), en = Math.round(tgt.b), len = en - s, k = e.key, st = e.shiftKey ? 7 : 1;
      var map = { ArrowLeft: -st, ArrowRight: st, ArrowDown: -st, ArrowUp: st, PageDown: -30, PageUp: 30 };
      if (part === 'win') {
        if (k === 'ArrowUp' || k === 'ArrowDown' || k === '+' || k === '-') { var z = (k === 'ArrowUp' || k === '+') ? -Math.max(1, Math.round(len * 0.15)) : Math.max(1, Math.round(len * 0.18)); var nl = clamp(len + z, 2, n - 1), c = (s + en) / 2; var a0 = clamp(Math.round(c - nl / 2), 0, n - 1 - nl); go(a0, a0 + nl); }
        else if (k === 'Home') go(0, len); else if (k === 'End') go(n - 1 - len, n - 1);
        else if (k === 'PageUp' || k === 'PageDown') { var a1 = clamp(s + (k === 'PageUp' ? len + 1 : -len - 1), 0, n - 1 - len); go(a1, a1 + len); }
        else if (map[k]) { var a2 = clamp(s + map[k], 0, n - 1 - len); go(a2, a2 + len); }

      } else if (part === 'start') {
        if (k === 'Home') go(0, en); else if (k === 'End') go(en - 2, en); else if (map[k]) go(clamp(s + map[k], 0, en - 2), en); else return;
      } else {
        if (k === 'Home') go(s, s + 2); else if (k === 'End') go(s, n - 1); else if (map[k]) go(s, clamp(en + map[k], s + 2, n - 1)); else return;
      }

    }
    win.addEventListener('keydown', function (e) { keyNav(e, 'win'); });
    hS.addEventListener('keydown', function (e) { keyNav(e, 'start'); });
    hE.addEventListener('keydown', function (e) { keyNav(e, 'end'); });
    seg.addEventListener('click', function (e) { var b = e.target.closest('[data-bc-range]'); if (b) setRange(b.dataset.bcRange); });
    $('[data-bc-retry]').addEventListener('click', function () { root.dispatchEvent(new CustomEvent('retry', { bubbles: true })); });

    /* ——— États ——— */
    function stateText() {
      var s = opt.state, t = $('[data-bc-msg-title]'), p = $('[data-bc-msg-text]');
      if (s === 'empty') { t.textContent = 'Aucun appel pour l’instant'; p.textContent = 'Dès qu’un agent décroche, les appels du jour s’affichent ici, avec leur taux de résolution.'; }
      else if (s === 'error') { t.textContent = 'Statistiques indisponibles'; p.textContent = 'La connexion au standard a échoué. Vos appels continuent d’être traités normalement.'; }

        root.querySelectorAll('[data-bc-delta]').forEach(function (x) { x.innerHTML = ''; });
        $('[data-bc-period]').textContent = s === 'empty' ? 'Aucune donnée' : 'Dernière mise à jour impossible';

      }
    }

    function setData(rs, ns) {
      rows = rs.map(function (r) { return { t: typeof r.t === 'number' ? r.t : Date.parse(r.date + 'T00:00:00Z'), calls: +r.calls || 0, transfers: +r.transfers || 0, duration: +r.duration || 0 }; });
      notes = (ns || []).map(function (o) { return { t: typeof o.t === 'number' ? o.t : Date.parse(o.date + 'T00:00:00Z'), label: o.label }; });
      n = rows.length; gmax = 1; rows.forEach(function (r) { gmax = Math.max(gmax, r.calls); });
      overlay.querySelectorAll('.bc__chip').forEach(function (c) { c.remove(); });

    }
    function refresh() {
      var prev = opt; readOpts(); root.dataset.state = opt.state;

      else if (prev.range !== opt.range) setRange(opt.range);

    var ro = new ResizeObserver(function () { size(); period(); });
    ro.observe(plot); ro.observe(nav); ro.observe(seg);

    root.brushChart = {
      setRange: function (r) { setRange(String(r)); },
      setWindow: function (s, e) { go(s, e); },
      setData: function (rs, ns) { setData(rs, ns); },
      refresh: refresh,
      destroy: function () { dead = true; cancelAnimationFrame(raf); ro.disconnect(); delete root.brushChart; }
    };
  }

  document.querySelectorAll('[data-brush-chart]').forEach(init);
})();
</script>

<!-- Adresse avec carte — HTML + CSS + JS intégré, sans dépendance ni API. Nécessite tokens.css.
     Marque fictive (Brindille, fleuriste à vélo). Rues réelles de Lyon, numéros et coordonnées fictifs, plan stylisé en SVG. -->
<link rel="stylesheet" href="tokens.css">

<!-- SECTION -->
<div class="adr" data-adresse data-style="plan" data-zone="true" data-trajet="true"
  style="--adr-zoom: 3.2; --adr-zone-km: 1.6; --adr-stiffness: 170; --adr-damping: 22; --adr-latence: 220">
 <div class="adr__in">
  <section class="adr__panel" aria-labelledby="adr-title">
    <header class="adr__head">
      <span class="adr__brand">

        Brindille

      <span class="adr__step">Étape 2 sur 3</span>
    </header>
    <div class="adr__intro">
      <h2 id="adr-title" class="adr__title">Où livrer le bouquet&nbsp;?</h2>
      <p class="adr__lead">Bouquet Garance · 48&nbsp;€ · livré à vélo depuis l’atelier de la rue Mercière.</p>
    </div>

    <div class="adr__field">
      <label class="adr__label" for="adr-input">Adresse de livraison</label>
      <div class="adr__control">
        <svg class="adr__ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.25"/></svg>
        <input id="adr-input" class="adr__input" type="text" inputmode="search" autocomplete="off" spellcheck="false"
          role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="adr-list" aria-describedby="adr-hint"
          placeholder="Ex. 12 rue Mercière">
        <span class="adr__spin" aria-hidden="true"></span>
        <button class="adr__clear" type="button" aria-label="Effacer l’adresse" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"/></svg>
        </button>
      </div>
      <p id="adr-hint" class="adr__hint">Flèches pour parcourir, Entrée pour choisir.</p>
      <ul id="adr-list" class="adr__list" role="listbox" aria-label="Suggestions d’adresses" hidden></ul>
    </div>

    <div class="adr__field adr__field--extra">
      <label class="adr__label" for="adr-extra">Complément <span class="adr__opt">facultatif</span></label>

      <span class="adr__result-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 12h16M14 6l6 6-6 6"/></svg></span>
      <div>
        <p class="adr__result-title">Saisissez une adresse</p>
        <p class="adr__result-text">Nous vous proposerons le premier créneau disponible.</p>
      </div>
    </div>

    <button class="adr__cta" type="button" disabled>Continuer vers le paiement</button>
  </section>

  <div class="adr__map" role="img" aria-label="Plan de Lyon avec la zone de livraison à vélo">
    <svg class="adr__svg" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <rect class="adr__land" x="-1000" y="-1000" width="3000" height="3000"/>
      <g class="adr__grid"></g>
      <g class="adr__parks">

        <rect x="430" y="660" width="86" height="46" rx="8"/><ellipse cx="860" cy="150" rx="40" ry="22" class="adr__lake"/>
      </g>
      <g class="adr__streets"></g>
      <g class="adr__water">
        <path d="M300-40C320 120 262 220 302 330S382 520 402 640S470 860 520 962"/>
        <path class="adr__rhone" d="M770-40C726 140 702 262 662 382S602 560 592 700S560 880 520 962L548 1060"/>
      </g>
      <g class="adr__bridges"></g>
      <g class="adr__zone"><circle class="adr__zone-c" r="400"/></g>
      <path class="adr__route" pathLength="1" d=""/>
      <g class="adr__labels"></g>
      <g class="adr__shop"><circle r="15" class="adr__shop-halo"/><circle r="8" class="adr__shop-dot"/></g>
      <g class="adr__pin" opacity="0">
        <ellipse class="adr__pin-shadow" rx="9" ry="3.5"/>
        <circle class="adr__pin-ring" r="10"/>
        <g class="adr__pin-body"><path d="M0 0C-3-6-14-14-14-25a14 14 0 0 1 28 0C14-14 3-6 0 0z"/><circle class="adr__pin-eye" cy="-25" r="5"/></g>
      </g>
    </svg>
    <div class="adr__tools">
      <button class="adr__tool" type="button" data-act="in" aria-label="Zoomer"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6v12M6 12h12"/></svg></button>
      <button class="adr__tool" type="button" data-act="out" aria-label="Dézoomer"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12"/></svg></button>
      <button class="adr__tool" type="button" data-act="fit" aria-label="Voir toute la zone"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg></button>
    </div>
    <p class="adr__legend"><span class="adr__legend-dot" aria-hidden="true"></span>Zone vélo · <span class="adr__legend-km">1,6&nbsp;km</span></p>
  </div>
 </div>
</div>
<!-- /SECTION -->

<style>

  .adr__field { position: relative; display: grid; gap: 8px; }

  .adr__input--plain { padding-left: 16px; padding-right: 16px; }
  .adr__input::placeholder { color: var(--text-muted); }

  .adr__opt-l2 { display: block; font-size: var(--t-xs); line-height: var(--t-xs-lh); color: var(--text-muted); }
  .adr__opt-km { font: 500 12px/16px var(--font-mono); color: var(--text-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .adr__opt-km[data-in="true"] { color: var(--up); }
  .adr__skel { display: grid; grid-template-columns: 32px 1fr; gap: 12px; align-items: center; min-height: 56px; padding: 8px 10px; }
  .adr__skel i { display: block; height: 10px; border-radius: 999px; background: var(--raised); position: relative; overflow: hidden; }

  .adr__skel i::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, var(--state-press), transparent); transform: translateX(-100%); animation: adr-shim 1.1s ease-in-out infinite; }
  @keyframes adr-shim { to { transform: translateX(100%); } }

  .adr__empty strong { display: block; color: var(--text-strong); font-weight: 600; }

  /* ——— Résultat ——— */
  .adr__result { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 12px; align-items: start; padding: 16px; border-radius: 12px; background: var(--raised); transition: background var(--motion-slow) var(--ease-out); }
  .adr__result-ico { width: 32px; height: 32px; border-radius: 999px; display: grid; place-items: center; background: var(--surface); color: var(--text-muted); }

  .adr__result-title { margin: 0; font: 600 var(--t-sm)/20px var(--font-sans); color: var(--text-strong); }
  .adr__result-text { margin: 2px 0 0; font-size: var(--t-sm); line-height: 20px; color: var(--text-muted); }
  .adr__result[data-state="ok"] { background: var(--tint-green-bg); }
  .adr__result[data-state="ok"] .adr__result-ico { color: var(--tint-green-fg); }
  .adr__result[data-state="ok"] .adr__result-text, .adr__result[data-state="ok"] .adr__result-title { color: var(--tint-green-fg); }

    cta.addEventListener('click', function () { cta.textContent = 'Adresse enregistrée'; setTimeout(function () { cta.textContent = 'Continuer vers le paiement'; }, 1600); });

    function refresh() {
      readCfg();
      root.querySelector('.adr__zone-c').setAttribute('r', cfg.zone);
      root.querySelector('.adr__legend-km').textContent = (cfg.zone / KM).toFixed(1).replace('.', ',') + '\u00a0km';
      if (chosen) { var o = chosen; var i = opts.indexOf(o); if (i < 0) { opts = [o]; i = 0; } choose(i); } else fit();
    }
    /* Démonstration : saisit une requête caractère par caractère puis choisit la première suggestion. */
    function demo(text, cb) {
      reset(); var i = 0; input.focus({ preventScroll: true });
      (function tick() { input.value = text.slice(0, ++i); clear.hidden = false; query(); if (i < text.length) setTimeout(tick, 70); else setTimeout(function () { choose(0); cb && cb(); }, cfg.lat + 650); })();
    }
    root._adresse = { refresh: refresh, demo: demo, reset: reset, choose: function (txt) { opts = search(txt); choose(0); } };
    root.querySelector('.adr__zone-c').setAttribute('r', cfg.zone);
    fit(); cam.x = tgt.x; cam.y = tgt.y; cam.z = tgt.z; apply();
  }
  document.querySelectorAll('[data-adresse]').forEach(function (el) { if (!el._adresse) AdresseCarte(el); });
})();
</script>

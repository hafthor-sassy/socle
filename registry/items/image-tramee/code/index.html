<!-- Image tramée — HTML + CSS + JS intégré (WebGL, repli canvas 2D). Nécessite tokens.css. Marque fictive. -->
<link rel="stylesheet" href="tokens.css">

<!-- SECTION -->
<section class="dh" aria-labelledby="dh-title">
  <div class="dh__image" data-dither
    data-mode="bayer" data-cell="3" data-reveal="nette" data-radius="150" data-speed="0.6"
    data-contrast="1.15" data-brightness="0" data-fade="0.42" data-fade-side="auto"
    data-ink="accent" data-opacity="1" data-auto="true" data-sample="paysage" data-focus="auto" data-src=""
    role="img" aria-label="Crêtes de montagne au soleil couchant, rendues en trame d’une seule encre"></div>

  <div class="dh__content" data-dither-calm>
    <p class="dh__eyebrow"><span class="dh__chip" aria-hidden="true"></span>Vélin 2.0 · export SVG 1 bit</p>
    <h1 id="dh-title" class="dh__title">Vos images, en une seule encre.</h1>
    <p class="dh__lead">Vélin convertit n’importe quelle photo en trame à la couleur de votre marque : quelques kilo-octets, nette à toutes les tailles.</p>
    <div class="dh__actions">
      <a class="dh__btn dh__btn--solid" href="#essai">Essayer gratuitement</a>
      <a class="dh__btn dh__btn--ghost" href="#exemples">Voir les exemples</a>
    </div>
    <p class="dh__meta" aria-hidden="true"><span data-dh-mode>Bayer 8×8</span><span data-dh-cell>3 px</span><span data-dh-renderer>WebGL</span></p>
    <p class="dh__status" role="status" aria-live="polite" data-dh-status></p>
  </div>
</section>
<!-- /SECTION -->

<style>
  .dh {
    position: relative;
    isolation: isolate;
    overflow: hidden;
    min-height: clamp(560px, 88svh, 820px);
    display: grid;
    align-items: center;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
  }
  .dh__image { position: absolute; inset: 0; z-index: -1; touch-action: pan-y; }
  .dh__image canvas { opacity: 1; transition: opacity var(--motion-slow) var(--ease-out); }
  .dh__image[data-state=loading] canvas { opacity: .35; }

  .dh__content { width: 100%; max-width: 1280px; margin: 0 auto; padding: 48px 24px; }
  .dh__content > * { max-width: 34rem; }
  .dh__eyebrow {
    display: inline-flex; align-items: center; gap: 8px;
    height: 32px; margin: 0 0 24px; padding: 0 12px 0 8px;
    border: 1px solid var(--border); border-radius: var(--radius-pill); background: var(--surface);
    color: var(--text-muted); font: 500 12px/1 var(--font-mono); letter-spacing: var(--track-caps); text-transform: uppercase;
  }
  /* Pastille 1 bit : un damier 2 × 2 à l'encre de la trame */
  .dh__chip {
    width: 16px; height: 16px; border-radius: 4px; flex: none;
    background: conic-gradient(var(--accent) 25%, transparent 0 50%, var(--accent) 0 75%, transparent 0) 0 0 / 8px 8px;
  }
  .dh__title {
    margin: 0; color: var(--text-strong);
    font-size: clamp(2.5rem, 1.55rem + 3.4vw, 4.5rem); line-height: 1.02; font-weight: 600; letter-spacing: -0.035em;
    text-wrap: balance;
  }
  .dh__lead { margin: 24px 0 0; color: var(--text-muted); font-size: 1.125rem; line-height: 1.75rem; max-width: 30rem; text-wrap: pretty; }
  .dh__actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 32px; }
  .dh__btn {
    display: inline-flex; align-items: center; justify-content: center;
    height: 48px; padding: 0 24px; border-radius: var(--radius-pill); border: 1px solid transparent;
    font: 500 16px/1 var(--font-sans); letter-spacing: -0.005em; text-decoration: none; white-space: nowrap;
    -webkit-tap-highlight-color: transparent;
    transition: background-color var(--motion-fast) var(--ease-out), scale var(--motion-base) cubic-bezier(.34, 1.56, .64, 1);
  }
  .dh__btn--solid { background: var(--accent); color: var(--accent-fg); }
  .dh__btn--solid:hover { background: var(--accent-hover); }
  .dh__btn--ghost { background: var(--bg); color: var(--text-strong); border-color: var(--border-control); }
  .dh__btn--ghost:hover { background: var(--raised); }
  .dh__btn:active { scale: .97; transition-duration: 90ms; }
  .dh__btn:focus-visible { outline: var(--focus-width) solid var(--focus-ring); outline-offset: 3px; }
  .dh__meta { display: flex; flex-wrap: wrap; gap: 0; margin: 40px 0 0; color: var(--text-muted); font: 500 12px/18px var(--font-mono); letter-spacing: var(--track-caps); text-transform: uppercase; }
  .dh__meta span + span::before { content: ""; display: inline-block; width: 4px; height: 4px; margin: 0 12px 2px; background: var(--border-control); vertical-align: middle; }
  .dh__status { margin: 12px 0 0; min-height: 18px; color: var(--text-muted); font: 500 12px/18px var(--font-mono); }
  .dh__status:empty { display: none; }

  @media (min-width: 720px) {
    .dh__content { padding: 64px 48px; }
  }
  @media (max-width: 719px) {
    .dh { align-items: start; }
    .dh__content { padding-top: 40px; }
    .dh__lead { font-size: 1rem; line-height: 1.5rem; margin-top: 16px; }
    .dh__actions { margin-top: 24px; }
    .dh__eyebrow { margin-bottom: 16px; }
    .dh__meta { display: none; }
  }
  @media (min-width: 1024px) { .dh__content { padding: 80px 64px; } }
  @media (prefers-reduced-motion: reduce) {
    .dh__btn, .dh__image canvas { transition: none; }
    .dh__btn:active { scale: 1; }
  }
</style>

<script>
(function () {

    focus: 'auto',        // cadrage : 'auto' | 'centre' | 'gauche' | 'droite' | 'haut' | 'bas'

    radius: 150,          // rayon de la zone révélée, px

    contrast: 1.15,
    brightness: 0,
    fade: 0.42,           // zone calme sans trame, part de la largeur (ou de la hauteur)
    fadeSide: 'auto',     // 'auto' (gauche, ou haut sous 720 px) | 'left' | 'top' | 'none'

    opacity: 1,

    'uniform vec2 u_res; uniform float u_cell; uniform sampler2D u_img; uniform vec2 u_imgSize;',
    'uniform vec3 u_ink; uniform float u_invert, u_time, u_wave, u_presence, u_mode, u_reveal;',
    'uniform vec3 u_mouse; uniform float u_contrast, u_bright, u_fade, u_intro, u_alpha; uniform vec2 u_fadeDir, u_focus; uniform float u_ramp; uniform vec4 u_region;',
    'float b2(vec2 a){ a = floor(a); return fract(a.x * .5 + a.y * a.y * .75); }',
    'float bayer8(vec2 a){ return (b2(.25 * a) * .25 + b2(.5 * a)) * .25 + b2(a) + 1. / 128.; }',
    'float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }',
    'vec2 cover(vec2 p){',
    '  p = clamp((p - u_region.xy) / u_region.zw, 0., 1.);',
    '  float ra = (u_res.x * u_region.z) / (u_res.y * u_region.w), ia = u_imgSize.x / u_imgSize.y;',

    '  return p * s + clamp(u_focus - s * .5, vec2(0.), 1. - s);',
    '}',
    'float calm(vec2 p){ if (u_fade <= 0.) return 1.; return smoothstep(u_fade, u_fade + u_ramp, dot(p, u_fadeDir)); }',
    'float gain(vec2 p){ float k = u_intro * 1.5 - (p.x * .32 + p.y * .18); return calm(p) * clamp(k * 2.2, 0., 1.); }',
    'float raw(vec2 p){',
    '  vec3 c = texture2D(u_img, cover(p)).rgb;',
    '  float l = dot(c, vec3(.2126, .7152, .0722));',
    '  l = clamp((l - .5) * u_contrast + .5 + u_bright, 0., 1.);',
    '  return mix(l, 1. - l, u_invert);',
    '}',
    'float tone(vec2 p){ return raw(p) * gain(p); }',
    'float toneW(vec2 p, float w){ return clamp(raw(p) + w, 0., 1.) * gain(p); }',
    'void main(){',
    '  vec2 f = vec2(gl_FragCoord.x, u_res.y - gl_FragCoord.y);',
    '  vec2 M = u_mouse.xy; float R = max(u_mouse.z, 1.);',
    '  float m = u_presence * (1. - smoothstep(R * .42, R, distance(f, M)));',
    '  float w = u_wave * (sin(f.x / u_res.y * 4.2 + u_time * .55) * .6 + sin((f.y * .8 - f.x * .45) / u_res.y * 6.5 - u_time * .4) * .4);',
    '  float on = 0.; vec2 cid;',
    '  if (u_mode < .5) {',
    '    float k = u_reveal > 1.5 ? 1. + floor(m * 2.6 + .4) : 1.;',
    '    float C = u_cell * k;',

    '    vec2 cc = (cid + .5) * C;',

    '  } else {',
    '    float P = u_cell * 2.;',
    '    mat2 rot = mat2(.7071068, -.7071068, .7071068, .7071068);',
    '    vec2 q = rot * f;',
    '    cid = floor(q / P);',
    '    vec2 cq = (cid + .5) * P;',
    '    vec2 cs = cq * rot;',
    '    if (u_reveal > 1.5) cs += normalize(cs - M + .001) * m * R * .16;',

    '  }',
    '  vec4 col = vec4(u_ink * on, on);',
    '  if (u_reveal < 1.5 && m > 0.) {',

    '    float e = step(bayer8(floor(f / u_cell)), m) * calm(p);',
    '    vec2 lp = (M + (f - M) * (1. - .09 * m)) / u_res;',
    '    vec4 rv;',

      g.save(); g.lineCap = 'butt';

    g.fillStyle = grad(0, H * .72, [[0, '#1b2a4a'], [.45, '#6c7aa0'], [.8, '#e9b98f'], [1, '#f7dcbc']]);
    g.fillRect(0, 0, W, H);
    var sx = W * .7, sy = H * .44;
    var halo = g.createRadialGradient(sx, sy, 10, sx, sy, 420);
    halo.addColorStop(0, 'rgba(255,240,215,.95)'); halo.addColorStop(.25, 'rgba(255,214,170,.45)'); halo.addColorStop(1, 'rgba(255,200,150,0)');

    g.fillStyle = '#fff8ec'; g.beginPath(); g.arc(sx, sy, 64, 0, Math.PI * 2); g.fill();
    for (var k = 0; k < 7; k++) {

    }

    function focus() { return FOCI[o.focus] || image.focus || FOCI.centre; }

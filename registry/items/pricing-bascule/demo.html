<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bascule à chiffres roulants — démo</title>
<script>if (!new URLSearchParams(location.search).get('accent')) document.documentElement.setAttribute('data-accent', 'aubergine');</script>
<link rel="stylesheet" href="../../../css/tokens.css">
<link rel="stylesheet" href="../../../demo-kit/demo.css">
<script src="../../../demo-kit/demo.js"></script>
<style id="component-css"></style>
<style>.stage { min-height: 100vh; display: grid; grid-template-columns: minmax(0, 1fr); place-items: center; } .is-thumb .pb { padding: 48px 40px; }</style>
</head>
<body>
<main class="stage" id="mount"></main>
<script>
  var props = Socle.props({ periode: 'mensuel', remise: 20, devise: 'EUR', miseEnAvant: '1', duree: 700, decalage: 60 });
  var root = null;
  function apply(p) {
    if (!root) return;
    root.dataset.period = p.periode;
    root.dataset.discount = String(p.remise);
    root.dataset.currency = p.devise;
    root.dataset.featured = String(p.miseEnAvant);
    root.style.setProperty('--pb-dur', p.duree + 'ms');
    root.style.setProperty('--pb-stagger', p.decalage + 'ms');
    if (root._pricing) root._pricing.render();
  }
  fetch('code/index.html').then(function (r) { return r.text(); }).then(function (t) {
    var css = t.match(/<style>([\s\S]*?)<\/style>/), mk = t.match(/<!-- SECTION -->([\s\S]*?)<!-- \/SECTION -->/), js = t.match(/<script>([\s\S]*?)<\/script>/);
    document.getElementById('component-css').textContent = css ? css[1] : '';
    document.getElementById('mount').innerHTML = mk ? mk[1] : '';
    root = document.querySelector('[data-pricing-bascule]');
    apply(props);
    try { new Function(js ? js[1] : '')(); } catch (e) { console.error(e); }
    if (Socle.thumb) root._pricing.setPeriod('annuel');
  });
  Socle.onChange(apply);
  Socle.onReplay(function () {
    if (!root || !root._pricing) return;
    var start = root.dataset.period;
    root._pricing.setPeriod(start === 'annuel' ? 'mensuel' : 'annuel');
    setTimeout(function () { root._pricing.setPeriod(start); }, 1500);
  });
</script>
</body>
</html>

<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculateur de prix au curseur — démo</title>
<link rel="stylesheet" href="../../../css/tokens.css">
<link rel="stylesheet" href="../../../demo-kit/demo.css">
<script src="../../../demo-kit/demo.js"></script>
<style id="component-css"></style>
<style>
  html.bg-grid .pcv { background: transparent; }
  .is-thumb .pcv { padding: 32px 24px 24px; }
  .is-thumb .pcv__lead, .is-thumb .pcv__eyebrow, .is-thumb .pcv__fine, .is-thumb .pcv__lines, .is-thumb .pcv__bar { display: none !important; }
  .is-thumb .pcv__in { gap: 24px; }
</style>
</head>
<body>
<div id="mount"></div>
<script>
  /* Props → attributs data-* de la section ; le script du composant est relancé à chaque réglage. */
  var props = Socle.props({ title: 'Un prix qui suit votre volume, pas l’inverse.', currency: 'EUR', period: 'month', discount: 20, sliders: 'seats,minutes,api', preset: '0', bands: true, roll: 'spring', stiffness: 170, damping: 19 });
  var src = null, mount = document.getElementById('mount'), inst = null, lastPreset = null, sweepT = 0;
  function render(p) {
    if (!src) return;
    clearTimeout(sweepT);
    var keep = inst && lastPreset === String(p.preset) ? Object.assign({}, inst.state.values) : null;
    var keepPeriod = inst && inst._period === p.period ? inst.state.period : null;
    if (inst) inst.destroy();
    var y = window.scrollY;
    mount.innerHTML = src.markup;
    var root = mount.querySelector('[data-pricing-volume]');
    root.dataset.currency = p.currency; root.dataset.period = p.period; root.dataset.discount = p.discount;
    root.dataset.sliders = p.sliders; root.dataset.preset = p.preset; root.dataset.bands = String(p.bands);
    root.dataset.roll = p.roll; root.dataset.stiffness = p.stiffness; root.dataset.damping = p.damping;
    var h = root.querySelector('h2'); if (h && p.title) h.textContent = p.title;
    try { new Function(src.script)(); } catch (e) { console.error(e); }
    inst = root._pcv; inst._period = p.period; lastPreset = String(p.preset);
    if (keep) inst.set(keep, { instant: true });
    if (keepPeriod && keepPeriod !== inst.state.period) { root.querySelector('[data-period="' + keepPeriod + '"]').click(); }
    window.scrollTo(0, y);
  }
  /* Rejouer : les curseurs repartent du minimum et remontent cran par cran jusqu’à l’exemple. */
  function sweep() {
    if (!inst) return;
    var root = mount.querySelector('[data-pricing-volume]'), cfg = JSON.parse(root.querySelector('[data-pcv-config]').textContent);
    var target = Object.assign({}, inst.state.values), keys = Object.keys(target);
    var idx = {}, stops = {};
    cfg.sliders.forEach(function (s) { stops[s.key] = s.stops; idx[s.key] = s.stops.indexOf(target[s.key]); });
    var start = {}; keys.forEach(function (k) { start[k] = stops[k][0]; });
    inst.set(start, { instant: true });
    if (Socle.reducedMotion()) { inst.set(target, { instant: true }); return; }
    var n = 0, max = Math.max.apply(null, keys.map(function (k) { return idx[k]; }));
    (function step() {
      n++; var v = {};
      keys.forEach(function (k) { v[k] = stops[k][Math.min(idx[k], Math.round(idx[k] * n / max))]; });
      inst.set(v, { instant: true });
      if (n < max) sweepT = setTimeout(step, 90);
    })();
  }
  fetch('code/index.html').then(function (r) { return r.text(); }).then(function (t) {
    var css = t.match(/<style>([\s\S]*?)<\/style>/);
    var js = t.match(/<script>([\s\S]*?)<\/script>/);
    var mk = t.match(/<!-- SECTION -->([\s\S]*?)<!-- \/SECTION -->/);
    document.getElementById('component-css').textContent = css ? css[1] : '';
    src = { markup: mk ? mk[1] : '', script: js ? js[1] : '' };
    render(props);
    if (Socle.thumb) thumbLoop();
  });
  Socle.onChange(render);
  Socle.onReplay(function () { sweep(); });

  /* Vignette : passe d’un exemple à l’autre, en pause hors écran. */
  function thumbLoop() {
    if (Socle.reducedMotion()) return;
    var visible = true, i = 0;
    if ('IntersectionObserver' in window) new IntersectionObserver(function (e) { visible = e[0].isIntersecting; }).observe(document.body);
    setInterval(function () {
      if (!visible || document.hidden || !inst) return;
      var b = mount.querySelectorAll('.pcv__preset'); if (!b.length) return;
      i = (i + 1) % b.length; b[i].click();
    }, 2600);
  }
</script>
</body>
</html>

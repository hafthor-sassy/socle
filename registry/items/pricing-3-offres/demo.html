<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pricing 3 offres — démo</title>
<link rel="stylesheet" href="../../../css/tokens.css">
<link rel="stylesheet" href="../../../demo-kit/demo.css">
<script src="../../../demo-kit/demo.js"></script>
<style id="component-css"></style>
<style>
  html.bg-grid .pricing { background: transparent; }
  .is-thumb .pricing { padding-top: 56px; }
</style>
</head>
<body>
<div id="mount"></div>
<script>
  var props = Socle.props({ period: 'monthly', discount: 20, compare: true, faq: true });
  var src = null;
  var mount = document.getElementById('mount');
  function render(p) {
    if (!src) return;
    var y = window.scrollY;
    mount.innerHTML = src.markup;
    var root = mount.querySelector('.pricing');
    root.dataset.period = p.period;
    root.dataset.discount = p.discount;
    if (!p.compare || Socle.thumb) { var c = root.querySelector('[data-compare]'); c && c.remove(); }
    if (!p.faq || Socle.thumb) { var f = root.querySelector('[data-faq]'); f && f.remove(); }
    try { new Function(src.script)(); } catch (e) { console.error(e); }
    window.scrollTo(0, y);
  }
  fetch('code/index.html').then(function (r) { return r.text(); }).then(function (t) {
    var css = t.match(/<style>([\s\S]*?)<\/style>/);
    var js = t.match(/<script>([\s\S]*?)<\/script>/);
    var mk = t.match(/<!-- SECTION -->([\s\S]*?)<!-- \/SECTION -->/);
    document.getElementById('component-css').textContent = css ? css[1] : '';
    src = { markup: mk ? mk[1] : '', script: js ? js[1] : '' };
    render(props);
  });
  Socle.onChange(render);
  Socle.onReplay(render);
</script>
</body>
</html>
